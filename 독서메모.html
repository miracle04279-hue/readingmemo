<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>독서 구절 사진 기록장</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 귀여운 한글 폰트 및 Inter 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&family=Inter:wght@400;500;600;700&family=Jua&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Gamja Flower"', '"Gaegu"', 'Inter', 'sans-serif'],
            serif: ['"Jua"', '"Gaegu"', 'sans-serif'],
          },
          colors: {
            paper: '#FDF8F2',
            surface: '#FFFDF9',
            ink: '#241D18',
            muted: '#66594E',
            accent: '#C96A42',
            accentSoft: '#FCEEE6',
            shelfWood: '#F2E7D8',
          },
        },
      },
    };
  </script>
  <style>
    /* 모바일 중심 가독성 및 귀여운 손글씨 둥근 글자 조화 */
    html, body {
      background-color: #FDF8F2;
      color: #241D18;
      font-family: "Gamja Flower", "Gaegu", "Inter", sans-serif;
      font-size: 18px;
      line-height: 1.65;
      letter-spacing: 0.01em;
      word-break: keep-all;
      -webkit-tap-highlight-color: transparent;
    }
    /* 책 페이지 느낌의 미세한 종이 결 */
    .book-page-texture {
      background-color: #FFFDF9;
      background-image: radial-gradient(rgba(125, 111, 99, 0.06) 0.75px, transparent 0.75px);
      background-size: 14px 14px;
    }
    /* 책등 제본선 및 책장 하단 그림자 */
    .book-spine-edge {
      box-shadow: inset 6px 0 10px -6px rgba(44, 36, 30, 0.28), 0 4px 10px rgba(44, 36, 30, 0.08);
    }
    .shelf-ledge {
      background: linear-gradient(to bottom, #EADBC7 0%, #D9C3A8 100%);
      height: 10px;
      border-radius: 9999px;
      box-shadow: 0 3px 6px rgba(44, 36, 30, 0.12);
    }
    /* 캔버스 터치 스크롤 방지 */
    .highlighter-canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased selection:bg-accentSoft selection:text-accent">
  <!-- 전체 앱 래퍼 (모바일 중심 최대 폭 제한 + 책갈피 느낌) -->
  <div id="app" class="mx-auto max-w-md min-h-screen flex flex-col book-page-texture shadow-md border-x border-amber-900/10 relative pb-24">

    <!-- 상단 헤더 (책 표지 머리말 스타일) -->
    <header class="sticky top-0 z-20 bg-paper/95 backdrop-blur border-b-2 border-amber-900/15 px-4 py-3.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <button
            id="headerBackBtn"
            type="button"
            class="hidden items-center justify-center w-9 h-9 rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink font-bold text-sm shrink-0 transition"
            aria-label="뒤로 가기"
          >
            ←
          </button>
          <div class="min-w-0">
            <h1 id="headerTitle" class="font-serif text-lg font-bold text-ink truncate leading-tight">우리의 독서메모</h1>
            <p id="headerSubtitle" class="text-xs text-muted truncate"></p>
          </div>
        </div>

        <!-- 현재 기록하는 사용자 (맨 위 오른쪽 배치, 클릭 시 사용자 선택) -->
        <div class="flex flex-col items-end shrink-0 relative">
          <span class="text-[10px] font-semibold text-muted leading-none mb-0.5">현재 기록 중</span>
          <button
            id="activeUserBadgeBtn"
            type="button"
            class="flex items-center gap-1.5 bg-surface hover:bg-amber-100/70 active:scale-95 border border-amber-900/20 rounded-b-xl rounded-t-md px-2.5 py-1 shadow-2xs transition cursor-pointer"
            aria-label="현재 기록 중인 사용자 선택"
          >
            <span id="activeUserDot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
            <span id="activeUserLabel" class="text-xs font-bold text-ink">뀨뀨</span>
            <span class="text-[10px] text-muted">▾</span>
          </button>

          <!-- 사용자 선택 팝오버 -->
          <div
            id="activeUserDropdown"
            class="hidden absolute right-0 top-full mt-1.5 w-40 rounded-2xl bg-surface border border-amber-900/20 shadow-lg py-1.5 z-40"
          ></div>
        </div>
      </div>
    </header>

    <!-- 메인 콘텐츠 영역 (뷰 전환) -->
    <main id="mainContent" class="flex-1 px-4 pt-4 space-y-6"></main>

    <!-- 하단 네비게이션 바 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-surface/95 backdrop-blur border-t border-amber-900/10 px-3 py-2 z-30">
      <div class="grid grid-cols-2 gap-2">
        <button
          id="navHomeBtn"
          type="button"
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm"
        >
          <span>📚</span>
          <span>책장 홈</span>
        </button>
        <button
          id="navSettingsBtn"
          type="button"
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60"
        >
          <span>⚙️</span>
          <span>설정</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- 커스텀 모달 컨테이너 (alert/confirm 대체용) -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4 backdrop-blur-[1px]">
    <div id="modalCard" class="w-full max-w-md max-h-[90vh] overflow-y-auto rounded-3xl bg-surface p-5 shadow-xl border border-amber-900/10 space-y-4"></div>
  </div>

  <!-- 토스트 메시지 배너 -->
  <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden max-w-xs w-max rounded-full bg-ink text-white text-xs font-medium px-4 py-2.5 shadow-lg transition-all"></div>

  <script>
    /**
     * =========================================================================
     * 1. 상태 관리 및 초기 데이터 (단일 세션 인메모리 상태)
     * =========================================================================
     */
    const AVATAR_PALETTE = [
      { bg: 'bg-amber-100', text: 'text-amber-800', dot: 'bg-amber-500', border: 'border-amber-200' },
      { bg: 'bg-sky-100', text: 'text-sky-800', dot: 'bg-sky-500', border: 'border-sky-200' },
      { bg: 'bg-emerald-100', text: 'text-emerald-800', dot: 'bg-emerald-500', border: 'border-emerald-200' },
      { bg: 'bg-rose-100', text: 'text-rose-800', dot: 'bg-rose-500', border: 'border-rose-200' },
      { bg: 'bg-violet-100', text: 'text-violet-800', dot: 'bg-violet-500', border: 'border-violet-200' },
    ];

    const HIGHLIGHT_COLORS = [
      { name: '노랑', rgba: 'rgba(250, 204, 21, 0.42)', swatch: '#FACC15' },
      { name: '연두', rgba: 'rgba(74, 222, 128, 0.42)', swatch: '#4ADE80' },
      { name: '분홍', rgba: 'rgba(244, 114, 182, 0.42)', swatch: '#F472B6' },
      { name: '하늘', rgba: 'rgba(56, 189, 248, 0.42)', swatch: '#38BDF8' },
    ];

    // 오늘 날짜 (연-월-일 형식, 시각 없음)
    function getTodayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 연도와 날짜를 읽기 쉽게 포맷팅 (시각은 포함하지 않음)
    function formatKoreanDate(dateStr) {
      if (!dateStr) return getTodayDateStr();
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${Number(parts[0])}년 ${Number(parts[1])}월 ${Number(parts[2])}일`;
    }

    // 샘플 구절 이미지용 SVG 데이터 URL 생성 (외부 네트워크 의존 없이 깔끔한 페이지 이미지 제공)
    function createSamplePageImage(titleText, quoteText, accentHex) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
          <rect width="600" height="800" fill="#FCFBF7"/>
          <rect x="36" y="36" width="528" height="728" rx="12" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="2"/>
          <text x="72" y="96" font-family="sans-serif" font-size="18" fill="#8C8278">${escapeXml(titleText)}</text>
          <line x1="72" y1="120" x2="528" y2="120" stroke="#EFECE6" stroke-width="2"/>
          <rect x="68" y="215" width="440" height="34" rx="6" fill="${accentHex}" fill-opacity="0.45"/>
          <rect x="68" y="260" width="380" height="34" rx="6" fill="${accentHex}" fill-opacity="0.45"/>
          <text x="72" y="185" font-family="sans-serif" font-size="22" fill="#3A3530">오늘 읽은 문장 중 마음에 남은 부분</text>
          <text x="74" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1E1B18">${escapeXml(quoteText.slice(0, 22))}</text>
          <text x="74" y="285" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1E1B18">${escapeXml(quoteText.slice(22, 44))}</text>
          <text x="72" y="360" font-family="sans-serif" font-size="20" fill="#57504A">조용한 오후에 다시 펼쳐보아도</text>
          <text x="72" y="395" font-family="sans-serif" font-size="20" fill="#57504A">처음 읽을 때의 온도가 그대로 남아 있다.</text>
          <text x="285" y="732" font-family="sans-serif" font-size="16" fill="#A3998E">- 84p -</text>
        </svg>
      `.trim();
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function escapeXml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    // 앱 전체 상태
    const state = {
      currentTab: 'home', // 'home' | 'settings'
      selectedBookId: null, // null이면 책장 홈, 책 ID가 있으면 해당 책의 구절 피드
      viewMode: 'home', // 'home' | 'book' | 'settings' (현재 화면 모드 명시 고정)
      activeUserId: 'user-kkyukkyu', // 현재 조작 중인 사용자 (기본: 뀨뀨)
      users: [
        { id: 'user-kkyukkyu', name: '뀨뀨', paletteIndex: 0 },
        { id: 'user-kkyungi', name: '뀽이', paletteIndex: 1 },
        { id: 'user-ttungi', name: '뚱이', paletteIndex: 2 },
      ],
      books: [],
      entries: [],
    };

    /**
     * =========================================================================
     * 2. 헬퍼 함수
     * =========================================================================
     */
    function getUserById(userId) {
      return state.users.find((u) => u.id === userId) || {
        id: userId,
        name: '알 수 없는 사용자',
        paletteIndex: 0,
      };
    }

    function getPalette(user) {
      const idx = (user?.paletteIndex ?? 0) % AVATAR_PALETTE.length;
      return AVATAR_PALETTE[idx];
    }

    function getBookById(bookId) {
      return state.books.find((b) => b.id === bookId) || null;
    }
    // 토스트 메시지 배너
    function showToast(message) {
      const toast = document.getElementById('toastBanner');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2400);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      card.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      card.innerHTML = '';
    }

    // 헤더 우측 '현재 기록 중' 사용자 드롭다운 렌더링 및 토글
    function renderActiveUserDropdown() {
      const dropdown = document.getElementById('activeUserDropdown');
      if (!dropdown) return;

      dropdown.innerHTML = state.users
        .map((u) => {
          const pal = getPalette(u);
          const isCurrent = u.id === state.activeUserId;
          return `
            <button
              type="button"
              data-pick-header-user="${escapeXml(u.id)}"
              class="w-full px-3 py-2 flex items-center justify-between gap-2 text-left text-xs transition ${
                isCurrent ? 'bg-accentSoft/80 font-bold text-accent' : 'hover:bg-amber-100/60 text-ink font-medium'
              }"
            >
              <span class="flex items-center gap-2 truncate">
                <span class="w-2.5 h-2.5 rounded-full shrink-0 ${pal.dot}"></span>
                <span class="truncate">${escapeXml(u.name)}</span>
              </span>
              ${isCurrent ? '<span class="text-[11px] font-bold">✓</span>' : ''}
            </button>
          `;
        })
        .join('');
    }

    function toggleActiveUserDropdown(forceState) {
      const dropdown = document.getElementById('activeUserDropdown');
      if (!dropdown) return;
      renderActiveUserDropdown();
      const shouldOpen =
        typeof forceState === 'boolean' ? forceState : dropdown.classList.contains('hidden');
      if (shouldOpen) {
        dropdown.classList.remove('hidden');
      } else {
        dropdown.classList.add('hidden');
      }
    }

    // 카메라 권한 상태를 확인하고 안내 문구를 반환하는 헬퍼
    // 권한 거부/미지원 환경에서도 모바일·PC 카메라 앱을 바로 열 수 있는 파일 입력 헬퍼
    function bindDirectCameraInput(inputEl, onFileSelected) {
      if (!inputEl) return;
      inputEl.setAttribute('accept', 'image/*');
      inputEl.setAttribute('capture', 'environment');
      inputEl.capture = 'environment';
      inputEl.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await readFileAsDataUrl(file);
          await onFileSelected(dataUrl);
        } catch (err) {
          showToast(err.message || '사진을 불러오지 못했습니다.');
        } finally {
          inputEl.value = '';
        }
      });
    }

    // 내장 카메라 스트림으로 직접 촬영하거나, 미지원/차단 환경이면 파일 카메라 입력으로 폴백
    function createInlineCameraHelper({
      triggerBtn,
      fallbackInput,
      panelEl,
      videoEl,
      snapBtn,
      cancelBtn,
      onCaptured,
    }) {
      let stream = null;

      function stopStream() {
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        if (videoEl) videoEl.srcObject = null;
        if (panelEl) panelEl.classList.add('hidden');
      }

      if (fallbackInput) {
        bindDirectCameraInput(fallbackInput, async (dataUrl) => {
          stopStream();
          await onCaptured(dataUrl);
        });
      }

      if (triggerBtn) {
        triggerBtn.addEventListener('click', async () => {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            if (fallbackInput) fallbackInput.click();
            return;
          }
          try {
            stopStream();
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: 'environment' } },
              audio: false,
            });
            videoEl.srcObject = stream;
            await videoEl.play();
            panelEl.classList.remove('hidden');
          } catch (_) {
            stopStream();
            if (fallbackInput) fallbackInput.click();
          }
        });
      }

      if (snapBtn) {
        snapBtn.addEventListener('click', async () => {
          if (!videoEl || !videoEl.videoWidth) return;
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = videoEl.videoWidth;
          tempCanvas.height = videoEl.videoHeight;
          const tctx = tempCanvas.getContext('2d');
          tctx.drawImage(videoEl, 0, 0, tempCanvas.width, tempCanvas.height);
          const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.9);
          stopStream();
          await onCaptured(dataUrl);
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          stopStream();
        });
      }

      return { stopStream };
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          reject(new Error('선택된 파일이 없습니다.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('파일을 읽는 중 오류가 발생했습니다.'));
        reader.readAsDataURL(file);
      });
    }

    /**
     * =========================================================================
     * 3. 메인 뷰 라우터 및 렌더링
     * =========================================================================
     */
    function renderApp() {
      const activeUser = getUserById(state.activeUserId);
      const activePalette = getPalette(activeUser);

      // 상단 우측 '현재 기록 중' 뱃지 갱신
      const activeUserLabel = document.getElementById('activeUserLabel');
      const activeUserDot = document.getElementById('activeUserDot');
      if (activeUserLabel) activeUserLabel.textContent = activeUser.name;
      if (activeUserDot) {
        activeUserDot.className = `w-2.5 h-2.5 rounded-full ${activePalette.dot}`;
      }
      renderActiveUserDropdown();

      // 하단 탭 스타일 갱신
      const navHomeBtn = document.getElementById('navHomeBtn');
      const navSettingsBtn = document.getElementById('navSettingsBtn');
      if (state.currentTab === 'home') {
        navHomeBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
        navSettingsBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';
      } else {
        navSettingsBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
        navHomeBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';
      }

      const mainContent = document.getElementById('mainContent');
      const backBtn = document.getElementById('headerBackBtn');
      const headerTitle = document.getElementById('headerTitle');
      const headerSubtitle = document.getElementById('headerSubtitle');

      if (state.currentTab === 'settings') {
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
        headerTitle.textContent = '우리의 독서메모';
        headerSubtitle.textContent = '사용자 추가 및 관리';
        renderSettingsView(mainContent);
        return;
      }

      if (state.selectedBookId) {
        const book = getBookById(state.selectedBookId);
        if (book) {
          const owner = getUserById(book.ownerId);
          backBtn.classList.remove('hidden');
          backBtn.classList.add('flex');
          headerTitle.textContent = book.title;
          headerSubtitle.textContent = `${owner.name}의 책장${book.author ? ` · ${book.author}` : ''}`;
          renderBookDetailView(mainContent, book);
          return;
        }
        state.selectedBookId = null;
      }

      backBtn.classList.add('hidden');
      backBtn.classList.remove('flex');
      headerTitle.textContent = '우리의 독서메모';
      headerSubtitle.textContent = '소중한 문장과 사진을 함께 남기는 책장';
      renderHomeView(mainContent);
    }

    // 홈 화면: 사용자별 책장 (가로 3권 배치)
    function renderHomeView(container) {
      const shelvesHtml = state.users
        .map((user) => {
          const pal = getPalette(user);
          const isCurrentUser = user.id === state.activeUserId;
          const userBooks = state.books.filter((b) => b.ownerId === user.id);

          const booksGridHtml =
            userBooks.length === 0
              ? `
                <div class="rounded-2xl border border-dashed border-amber-900/20 bg-paper/80 py-7 px-4 text-center">
                  <p class="text-sm text-muted">아직 등록된 책이 없어요.</p>
                </div>
              `
              : `
                <div class="grid grid-cols-3 gap-3">
                  ${userBooks
                    .map((book) => {
                      const entryCount = state.entries.filter((e) => e.bookId === book.id).length;
                      const coverContent = book.coverImage
                        ? `<img src="${book.coverImage}" alt="${escapeXml(book.title)} 표지" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                           <div class="hidden w-full h-full flex-col items-center justify-center p-2 text-center bg-gradient-to-br from-amber-100 to-orange-100">
                             <span class="text-xs font-bold text-ink line-clamp-3 leading-snug">${escapeXml(book.title)}</span>
                           </div>`
                        : `<div class="w-full h-full flex-col flex items-center justify-center p-2 text-center bg-gradient-to-br from-amber-100 to-orange-100">
                             <span class="text-xs font-bold text-ink line-clamp-3 leading-snug">${escapeXml(book.title)}</span>
                             ${book.author ? `<span class="mt-1 text-[10px] text-muted line-clamp-1">${escapeXml(book.author)}</span>` : ''}
                           </div>`;

                      return `
                        <button
                          type="button"
                          data-open-book="${escapeXml(book.id)}"
                          data-long-press-book="${escapeXml(book.id)}"
                          data-long-press-owner="${isCurrentUser ? 'true' : 'false'}"
                          class="group flex flex-col text-left focus:outline-none select-none"
                        >
                          <div class="relative w-full aspect-[3/4.2] rounded-r-xl rounded-l-sm overflow-hidden book-spine-edge border border-amber-900/15 bg-surface transition transform group-hover:-translate-y-0.5 group-active:scale-[0.98]">
                            ${coverContent}
                            <span class="absolute bottom-1.5 right-1.5 rounded-full bg-ink/75 text-white text-[10px] font-semibold px-1.5 py-0.5">
                              ${entryCount}장
                            </span>
                          </div>
                          <p class="mt-1.5 text-xs font-bold text-ink line-clamp-1">${escapeXml(book.title)}</p>
                          ${book.author ? `<p class="text-[11px] text-muted line-clamp-1">${escapeXml(book.author)}</p>` : ''}
                        </button>
                      `;
                    })
                    .join('')}
                </div>
                <div class="shelf-ledge mt-2.5"></div>
              `;

          return `
            <section class="rounded-3xl bg-surface/95 border border-amber-900/15 p-4 shadow-xs space-y-3 relative">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="w-3 h-3 rounded-full shrink-0 ${pal.dot}"></span>
                  <h2 class="font-serif text-base font-bold text-ink truncate">${escapeXml(user.name)}의 책장</h2>
                  <span class="text-xs text-muted shrink-0">(${userBooks.length}권)</span>
                </div>
                ${
                  isCurrentUser
                    ? `
                      <button
                        type="button"
                        data-add-book-for="${escapeXml(user.id)}"
                        class="shrink-0 rounded-2xl bg-accent hover:opacity-95 active:scale-95 text-white text-xs font-bold px-3 py-1.5 shadow-2xs transition"
                      >
                        + 책 추가
                      </button>
                    `
                    : ''
                }
              </div>
              ${booksGridHtml}
            </section>
          `;
        })
        .join('');

      container.innerHTML = shelvesHtml;
    }

    // 책 상세 뷰: 구절 사진 피드 (나중에 찍은 사진이 아래 배치) + 답글
    function renderBookDetailView(container, book) {
      const owner = getUserById(book.ownerId);
      const isBookOwner = book.ownerId === state.activeUserId;
      const bookEntries = state.entries.filter((e) => e.bookId === book.id);

      const topBarHtml = `
        <div class="rounded-3xl bg-surface border border-amber-900/15 p-4 shadow-xs flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-12 aspect-[3/4.2] rounded-r-lg rounded-l-xs overflow-hidden book-spine-edge border border-amber-900/15 bg-amber-100 shrink-0 flex items-center justify-center">
              ${
                book.coverImage
                  ? `<img src="${book.coverImage}" alt="${escapeXml(book.title)}" class="w-full h-full object-cover" />`
                  : `<span class="text-[10px] font-bold text-ink text-center px-1 line-clamp-2">${escapeXml(book.title)}</span>`
              }
            </div>
            <div class="min-w-0">
              <p class="text-xs text-muted truncate">${escapeXml(owner.name)}의 책장</p>
              <h2 class="font-serif text-base font-bold text-ink truncate">${escapeXml(book.title)}</h2>
              ${
                isBookOwner
                  ? `<button type="button" data-edit-book-cover="${escapeXml(book.id)}" class="mt-1 text-xs font-bold text-accent hover:underline">
                       표지 수정
                     </button>`
                  : ''
              }
            </div>
          </div>

          ${
            isBookOwner
              ? `
                <button
                  type="button"
                  data-open-capture-modal="${escapeXml(book.id)}"
                  class="shrink-0 rounded-2xl bg-accent hover:opacity-95 active:scale-95 text-white text-xs font-bold px-3.5 py-2.5 shadow-sm transition"
                >
                  📷 구절 찍기
                </button>
              `
              : ''
          }
        </div>
      `;

      if (bookEntries.length === 0) {
        container.innerHTML = `
          ${topBarHtml}
          <div class="rounded-3xl border border-dashed border-amber-900/20 bg-surface/80 py-10 px-4 text-center space-y-2">
            <p class="text-sm font-bold text-ink">아직 찍어둔 구절 사진이 없어요</p>
            <p class="text-xs text-muted">${escapeXml(owner.name)} 책장에서 중요한 구절을 사진으로 남겨보세요.</p>
          </div>
        `;
        return;
      }

      const entriesHtml = bookEntries
        .map((entry, idx) => {
          const author = getUserById(entry.authorId);
          const authorPal = getPalette(author);
          const isEntryAuthor = entry.authorId === state.activeUserId;
          const replies = Array.isArray(entry.replies) ? entry.replies : [];

          const repliesHtml = replies
            .map((rep) => {
              const repUser = getUserById(rep.authorId);
              const repPal = getPalette(repUser);
              return `
                <div class="rounded-2xl bg-paper border border-amber-900/10 px-3 py-2 space-y-0.5">
                  <div class="flex items-center justify-between gap-2">
                    <span class="inline-flex items-center gap-1.5 text-xs font-bold ${repPal.text}">
                      <span class="w-2 h-2 rounded-full ${repPal.dot}"></span>
                      ${escapeXml(repUser.name)}
                    </span>
                    <span class="text-[11px] text-muted">${escapeXml(formatKoreanDate(rep.date))}</span>
                  </div>
                  <p class="text-sm text-ink leading-snug">${escapeXml(rep.text)}</p>
                </div>
              `;
            })
            .join('');

          return `
            <article class="rounded-3xl bg-surface border border-amber-900/15 p-4 shadow-xs space-y-3">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-xs font-bold ${authorPal.bg} ${authorPal.text}">
                    #${idx + 1} · ${escapeXml(author.name)}
                  </span>
                  <span class="text-xs text-muted">${escapeXml(formatKoreanDate(entry.photoDate))}</span>
                </div>
                ${
                  isEntryAuthor
                    ? `
                      <div class="flex items-center gap-1.5 shrink-0">
                        <button
                          type="button"
                          data-edit-entry="${escapeXml(entry.id)}"
                          class="rounded-xl bg-amber-100/80 hover:bg-amber-200/80 text-ink text-xs font-bold px-2.5 py-1 transition"
                        >
                          수정
                        </button>
                        <button
                          type="button"
                          data-delete-entry="${escapeXml(entry.id)}"
                          class="rounded-xl bg-rose-100/80 hover:bg-rose-200/80 text-rose-700 text-xs font-bold px-2.5 py-1 transition"
                        >
                          삭제
                        </button>
                      </div>
                    `
                    : ''
                }
              </div>

              <button
                type="button"
                data-zoom-photo="${escapeXml(entry.id)}"
                class="block w-full rounded-2xl overflow-hidden border border-amber-900/15 bg-stone-100 focus:outline-none group"
                title="사진 확대 보기"
              >
                <img
                  src="${entry.photoUrl}"
                  alt="${escapeXml(author.name)}의 구절 사진"
                  class="w-full max-h-96 object-contain mx-auto transition group-hover:scale-[1.01]"
                />
              </button>

              ${
                replies.length > 0
                  ? `<div class="space-y-2 pt-1">${repliesHtml}</div>`
                  : ''
              }

              <form data-reply-form="${escapeXml(entry.id)}" class="flex items-center gap-2 pt-1">
                <input
                  type="text"
                  name="replyText"
                  placeholder="답글을 남겨보세요..."
                  class="flex-1 rounded-2xl border border-amber-900/15 bg-paper px-3.5 py-2 text-sm text-ink placeholder:text-muted/70 focus:outline-none focus:border-accent"
                />
                <button
                  type="submit"
                  class="shrink-0 rounded-2xl bg-amber-900/85 hover:bg-amber-900 text-white text-xs font-bold px-3.5 py-2.5 transition"
                >
                  등록
                </button>
              </form>
            </article>
          `;
        })
        .join('');

      container.innerHTML = `
        ${topBarHtml}
        <div class="space-y-4">${entriesHtml}</div>
      `;
    }

    // 설정 뷰: 사용자 목록 및 새 사용자 추가
    function renderSettingsView(container) {
      const usersListHtml = state.users
        .map((u) => {
          const pal = getPalette(u);
          const isCurrent = u.id === state.activeUserId;
          const bookCount = state.books.filter((b) => b.ownerId === u.id).length;
          return `
            <div class="flex items-center justify-between gap-2 rounded-2xl border border-amber-900/15 bg-paper px-3.5 py-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-3 h-3 rounded-full shrink-0 ${pal.dot}"></span>
                <div class="min-w-0">
                  <p class="text-sm font-bold text-ink truncate">${escapeXml(u.name)}</p>
                  <p class="text-xs text-muted">책 ${bookCount}권</p>
                </div>
              </div>
              <button
                type="button"
                data-select-active-user="${escapeXml(u.id)}"
                class="shrink-0 rounded-xl px-3 py-1.5 text-xs font-bold transition ${
                  isCurrent
                    ? 'bg-accent text-white'
                    : 'bg-amber-100/80 hover:bg-amber-200/80 text-ink'
                }"
              >
                ${isCurrent ? '기록 중' : '선택'}
              </button>
            </div>
          `;
        })
        .join('');

      container.innerHTML = `
        <section class="rounded-3xl bg-surface border border-amber-900/15 p-4 shadow-xs space-y-3">
          <h2 class="font-serif text-base font-bold text-ink">함께하는 사용자</h2>
          <div class="space-y-2">${usersListHtml}</div>
        </section>

        <section class="rounded-3xl bg-surface border border-amber-900/15 p-4 shadow-xs space-y-3">
          <h2 class="font-serif text-base font-bold text-ink">사용자 추가</h2>
          <form id="addUserForm" class="flex items-center gap-2">
            <input
              type="text"
              name="newUserName"
              maxlength="12"
              placeholder="새 사용자 이름"
              class="flex-1 rounded-2xl border border-amber-900/15 bg-paper px-3.5 py-2 text-sm text-ink placeholder:text-muted/70 focus:outline-none focus:border-accent"
              required
            />
            <button
              type="submit"
              class="shrink-0 rounded-2xl bg-accent hover:opacity-95 text-white text-xs font-bold px-4 py-2.5 shadow-sm transition"
            >
              추가
            </button>
          </form>
        </section>
      `;

      const addUserForm = document.getElementById('addUserForm');
      if (addUserForm) {
        addUserForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const name = String(formData.get('newUserName') || '').trim();
          if (!name) {
            showToast('사용자 이름을 입력해주세요.');
            return;
          }
          const newUser = {
            id: `user-${Date.now()}`,
            name,
            paletteIndex: state.users.length % AVATAR_PALETTE.length,
          };
          state.users.push(newUser);
          state.activeUserId = newUser.id;
          showToast(`"${name}" 사용자가 추가되었습니다.`);
          renderApp();
        });
      }
    }

    /**
     * =========================================================================
     * 4. 책 추가 모달 (표지 카메라 앱 촬영 / 파일 선택 / 선택 안 함)
     * =========================================================================
     */
    function openAddBookModal(ownerId) {
      const owner = getUserById(ownerId);
      let tempCoverUrl = '';

      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-ink">${escapeXml(owner.name)} 책장에 책 추가</h3>
          <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-amber-100/70 text-muted font-bold">✕</button>
        </div>

        <form id="addBookForm" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-ink mb-1">책 제목 *</label>
            <input
              type="text"
              name="title"
              placeholder="예: 어린 왕자"
              class="w-full rounded-2xl border border-amber-900/15 bg-paper px-3.5 py-2 text-sm text-ink focus:outline-none focus:border-accent"
              required
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-ink mb-1">지은이 (선택)</label>
            <input
              type="text"
              name="author"
              placeholder="예: 생텍쥐페리"
              class="w-full rounded-2xl border border-amber-900/15 bg-paper px-3.5 py-2 text-sm text-ink focus:outline-none focus:border-accent"
            />
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold text-ink">책 표지 사진 (선택 안 해도 돼요)</label>
              <button type="button" id="clearCoverBtn" class="hidden text-xs text-rose-600 font-medium">표지 지우기</button>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                id="openAddCoverCamBtn"
                class="cursor-pointer rounded-2xl border border-accent/40 bg-accentSoft/70 hover:bg-accentSoft py-2.5 px-3 text-xs font-bold text-accent text-center transition"
              >
                📸 카메라로 바로 찍기
              </button>
              <input id="directCoverCameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
              <label class="cursor-pointer rounded-2xl border border-amber-900/15 bg-paper hover:bg-amber-100/60 py-2.5 px-3 text-xs font-semibold text-ink text-center transition">
                🖼️ 사진 파일 선택
                <input id="bookCoverFileInput" type="file" accept="image/*" class="hidden" />
              </label>
            </div>

            <div id="addCoverCamPanel" class="hidden rounded-2xl overflow-hidden border border-amber-900/15 bg-stone-900 p-2 space-y-2">
              <video id="addCoverCamVideo" playsinline autoplay muted class="w-full max-h-60 object-cover rounded-xl bg-black"></video>
              <div class="flex gap-2">
                <button type="button" id="cancelAddCoverCamBtn" class="flex-1 py-2 rounded-xl bg-stone-700 text-white text-xs font-semibold">닫기</button>
                <button type="button" id="snapAddCoverCamBtn" class="flex-1 py-2 rounded-xl bg-accent text-white text-xs font-bold">찰칵 찍기</button>
              </div>
            </div>

            <div id="coverPreviewBox" class="hidden w-28 aspect-[3/4.2] rounded-xl overflow-hidden border border-amber-900/15 mx-auto">
              <img id="coverPreviewImg" src="" alt="표지 미리보기" class="w-full h-full object-cover" />
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" data-close-modal class="flex-1 py-2.5 rounded-2xl bg-amber-100/70 text-muted text-sm font-semibold">
              취소
            </button>
            <button type="submit" class="flex-1 py-2.5 rounded-2xl bg-accent text-white text-sm font-semibold shadow-sm">
              책장에 넣기
            </button>
          </div>
        </form>
      `);

      const fileInput = document.getElementById('bookCoverFileInput');
      const previewBox = document.getElementById('coverPreviewBox');
      const previewImg = document.getElementById('coverPreviewImg');
      const clearBtn = document.getElementById('clearCoverBtn');
      const directCamInput = document.getElementById('directCoverCameraInput');

      function applyCoverPhoto(dataUrl) {
        tempCoverUrl = dataUrl;
        previewImg.src = tempCoverUrl;
        previewBox.classList.remove('hidden');
        clearBtn.classList.remove('hidden');
        showToast('표지 사진이 등록되었습니다.');
      }

      const camHelper = createInlineCameraHelper({
        triggerBtn: document.getElementById('openAddCoverCamBtn'),
        fallbackInput: directCamInput,
        panelEl: document.getElementById('addCoverCamPanel'),
        videoEl: document.getElementById('addCoverCamVideo'),
        snapBtn: document.getElementById('snapAddCoverCamBtn'),
        cancelBtn: document.getElementById('cancelAddCoverCamBtn'),
        onCaptured: (dataUrl) => applyCoverPhoto(dataUrl),
      });

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          tempCoverUrl = await readFileAsDataUrl(file);
          previewImg.src = tempCoverUrl;
          previewBox.classList.remove('hidden');
          clearBtn.classList.remove('hidden');
        } catch (err) {
          showToast(err.message);
        }
      });

      clearBtn.addEventListener('click', () => {
        tempCoverUrl = '';
        fileInput.value = '';
        previewImg.src = '';
        previewBox.classList.add('hidden');
        clearBtn.classList.add('hidden');
      });

      document.getElementById('addBookForm').addEventListener('submit', (e) => {
        e.preventDefault();
        camHelper.stopStream();
        const formData = new FormData(e.target);
        const title = String(formData.get('title') || '').trim();
        const author = String(formData.get('author') || '').trim();
        if (!title) {
          showToast('책 제목을 입력해주세요.');
          return;
        }
        state.books.push({
          id: `book-${Date.now()}`,
          ownerId,
          title,
          author,
          coverImage: tempCoverUrl || '',
        });
        closeModal();
        showToast(`"${title}" 책이 책장에 추가되었습니다.`);
        renderApp();
      });
    }

    // 책장에서 본인 책을 길게 눌렀을 때 삭제 모달 열기
    function openDeleteBookModal(bookId) {
      const book = getBookById(bookId);
      if (!book) return;
      if (book.ownerId !== state.activeUserId) {
        showToast('본인의 책장에 있는 책만 삭제할 수 있어요.');
        return;
      }

      openModal(`
        <div class="space-y-3">
          <h3 class="text-base font-bold text-ink">"${escapeXml(book.title)}" 책을 삭제할까요?</h3>
          <p class="text-xs text-muted leading-relaxed">
            책장에 담긴 책과 해당 책에 기록된 구절 사진 및 답글이 모두 삭제됩니다.
          </p>
          <div class="flex gap-2 pt-2">
            <button type="button" data-close-modal class="flex-1 py-2.5 rounded-2xl bg-amber-100/70 text-muted text-sm font-semibold">
              취소
            </button>
            <button type="button" id="confirmDeleteBookBtn" class="flex-1 py-2.5 rounded-2xl bg-rose-600 text-white text-sm font-semibold shadow-sm">
              삭제하기
            </button>
          </div>
        </div>
      `);

      document.getElementById('confirmDeleteBookBtn').addEventListener('click', () => {
        state.books = state.books.filter((b) => b.id !== bookId);
        state.entries = state.entries.filter((e) => e.bookId !== bookId);
        if (state.selectedBookId === bookId) {
          state.selectedBookId = null;
        }
        closeModal();
        showToast(`"${book.title}" 책이 삭제되었습니다.`);
        renderApp();
      });
    }

    function openEditBookCoverModal(bookId) {

      if (book.ownerId !== state.activeUserId) {

      openModal(`

          <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-amber-100/70 text-muted font-bold">✕</button>

        <form id="editBookCoverForm" class="space-y-3.5">
          <div class="space-y-2">

            <div class="grid grid-cols-2 gap-2">

              >
                📸 카메라로 바로 찍기
              </button>
              <input id="directEditCoverCameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
              <label class="cursor-pointer rounded-2xl border border-amber-900/15 bg-paper hover:bg-amber-100/60 py-2.5 px-3 text-xs font-semibold text-ink text-center transition">
                🖼️ 사진 파일 선택
                <input id="editBookCoverFileInput" type="file" accept="image/*" class="hidden" />

            </div>

            <div id="editCoverCamPanel" class="hidden rounded-2xl overflow-hidden border border-amber-900/15 bg-stone-900 p-2 space-y-2">

            </div>

            <div id="editCoverPreviewBox" class="${tempCoverUrl ? '' : 'hidden '}w-28 aspect-[3/4.2] rounded-xl overflow-hidden border border-amber-900/15 mx-auto">
              <img id="editCoverPreviewImg" src="${tempCoverUrl}" alt="표지 미리보기" class="w-full h-full object-cover" />
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" data-close-modal class="flex-1 py-2.5 rounded-2xl bg-amber-100/70 text-muted text-sm font-semibold">
              취소
            </button>
            <button type="submit" class="flex-1 py-2.5 rounded-2xl bg-accent text-white text-sm font-semibold shadow-sm">
              저장하기
            </button>
          </div>
        </form>
      `);

      const fileInput = document.getElementById('editBookCoverFileInput');
      const previewBox = document.getElementById('editCoverPreviewBox');
      const previewImg = document.getElementById('editCoverPreviewImg');
      const removeBtn = document.getElementById('removeExistingCoverBtn');
      const directCamInput = document.getElementById('directEditCoverCameraInput');

      function applyEditedCoverPhoto(dataUrl) {
        tempCoverUrl = dataUrl;
        previewImg.src = tempCoverUrl;
        previewBox.classList.remove('hidden');
        removeBtn.classList.remove('hidden');
        showToast('새 표지 사진이 등록되었습니다.');
      }

      const camHelper = createInlineCameraHelper({
        triggerBtn: document.getElementById('openEditCoverCamBtn'),
        fallbackInput: directCamInput,
        panelEl: document.getElementById('editCoverCamPanel'),
        videoEl: document.getElementById('editCoverCamVideo'),
        snapBtn: document.getElementById('snapEditCoverCamBtn'),
        cancelBtn: document.getElementById('cancelEditCoverCamBtn'),
        onCaptured: (dataUrl) => applyEditedCoverPhoto(dataUrl),
      });

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          tempCoverUrl = await readFileAsDataUrl(file);
          previewImg.src = tempCoverUrl;
          previewBox.classList.remove('hidden');
          removeBtn.classList.remove('hidden');
        } catch (err) {
          showToast(err.message);
        }
      });

      removeBtn.addEventListener('click', () => {
        tempCoverUrl = '';
        fileInput.value = '';
        previewImg.src = '';
        previewBox.classList.add('hidden');
        removeBtn.classList.add('hidden');
      });

      document.getElementById('editBookCoverForm').addEventListener('submit', (e) => {
        e.preventDefault();
        camHelper.stopStream();
        book.coverImage = tempCoverUrl || '';
        closeModal();
        showToast('책 표지가 수정되었습니다.');
        renderApp();
      });
    }

    // 구절 사진 촬영 및 형광펜 표시 모달 (작성/수정 공용 헬퍼)
    function openEntryEditorModal({ bookId, existingEntry = null }) {
      const book = getBookById(bookId);
      if (!book) return;

      let photoDataUrl = existingEntry ? existingEntry.photoUrl : '';
      let selectedColor = HIGHLIGHT_COLORS[0];
      let isDrawing = false;
      let hasBaseImageLoaded = false;

      const baseImg = new Image();
      const highlightCanvas = document.createElement('canvas');
      const hctx = highlightCanvas.getContext('2d');

      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-ink">${existingEntry ? '구절 기록 수정' : '중요 구절 사진 찍기'}</h3>
          <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-amber-100/70 text-muted font-bold">✕</button>
        </div>

        <form id="entryEditorForm" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-ink mb-1">사진 등록일 (연·월·일)</label>
            <input
              type="date"
              name="photoDate"
              value="${escapeXml(existingEntry?.photoDate || getTodayDateStr())}"
              class="w-full rounded-2xl border border-amber-900/15 bg-paper px-3.5 py-2 text-sm text-ink focus:outline-none focus:border-accent"
              required
            />
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-semibold text-ink">구절 사진</label>
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                id="openPassageCamBtn"
                class="cursor-pointer rounded-2xl border border-accent/40 bg-accentSoft/70 hover:bg-accentSoft py-2.5 px-3 text-xs font-bold text-accent text-center transition"
              >
                📸 카메라로 바로 찍기
              </button>
              <input id="directPassageCameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
              <label class="cursor-pointer rounded-2xl border border-amber-900/15 bg-paper hover:bg-amber-100/60 py-2.5 px-3 text-xs font-semibold text-ink text-center transition">
                🖼️ 사진 파일 선택
                <input id="passageFileInput" type="file" accept="image/*" class="hidden" />
              </label>
            </div>

            <div id="passageCamPanel" class="hidden rounded-2xl overflow-hidden border border-amber-900/15 bg-stone-900 p-2 space-y-2">
              <video id="passageCamVideo" playsinline autoplay muted class="w-full max-h-64 object-cover rounded-xl bg-black"></video>
              <div class="flex gap-2">
                <button type="button" id="cancelPassageCamBtn" class="flex-1 py-2 rounded-xl bg-stone-700 text-white text-xs font-semibold">닫기</button>
                <button type="button" id="snapPassageCamBtn" class="flex-1 py-2 rounded-xl bg-accent text-white text-xs font-bold">찰칵 찍기</button>
              </div>
            </div>
          </div>

          <div id="highlighterSection" class="${photoDataUrl ? '' : 'hidden '}space-y-2">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <span class="text-xs font-semibold text-ink">형광펜으로 중요한 부분 칠하기</span>
              <button type="button" id="clearHighlightsBtn" class="text-xs font-semibold text-rose-600 hover:underline">
                형광펜 지우기
              </button>
            </div>
            <div class="flex items-center gap-2" id="highlightPalette">
              ${HIGHLIGHT_COLORS.map(
                (c, idx) => `
                  <button
                    type="button"
                    data-hl-idx="${idx}"
                    class="w-7 h-7 rounded-full border-2 ${idx === 0 ? 'border-ink scale-110' : 'border-transparent'} transition"
                    style="background-color: ${c.swatch};"
                    title="${c.name} 형광펜"
                  ></button>
                `
              ).join('')}
            </div>
            <div class="rounded-2xl overflow-hidden border border-amber-900/15 bg-stone-100">
              <canvas id="passageCanvas" class="w-full block highlighter-canvas"></canvas>
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" data-close-modal class="flex-1 py-2.5 rounded-2xl bg-amber-100/70 text-muted text-sm font-semibold">
              취소
            </button>
            <button type="submit" class="flex-1 py-2.5 rounded-2xl bg-accent text-white text-sm font-semibold shadow-sm">
              저장하기
            </button>
          </div>
        </form>
      `);

      const passageFileInput = document.getElementById('passageFileInput');
      const directCamInput = document.getElementById('directPassageCameraInput');
      const hlSection = document.getElementById('highlighterSection');
      const canvas = document.getElementById('passageCanvas');
      const ctx = canvas.getContext('2d');
      const clearHlBtn = document.getElementById('clearHighlightsBtn');

      function initCanvasWithImage(dataUrl) {
        baseImg.onload = () => {
          const maxW = 540;
          const natW = baseImg.naturalWidth || 600;
          const natH = baseImg.naturalHeight || 800;
          const scale = natW > maxW ? maxW / natW : 1;
          const targetW = Math.max(1, Math.round(natW * scale));
          const targetH = Math.max(1, Math.round(natH * scale));

          canvas.width = targetW;
          canvas.height = targetH;
          highlightCanvas.width = targetW;
          highlightCanvas.height = targetH;
          hctx.clearRect(0, 0, targetW, targetH);

          hasBaseImageLoaded = true;
          redrawCombinedCanvas();
        };
        baseImg.src = dataUrl;
      }

      function applyCapturedPassagePhoto(dataUrl) {
        photoDataUrl = dataUrl;
        hlSection.classList.remove('hidden');
        initCanvasWithImage(photoDataUrl);
        showToast('구절 사진이 준비되었습니다. 형광펜으로 칠해보세요.');
      }

      function redrawCombinedCanvas() {
        if (!hasBaseImageLoaded) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(highlightCanvas, 0, 0, canvas.width, canvas.height);
      }

      function getCanvasPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / (rect.width || 1);
        const scaleY = canvas.height / (rect.height || 1);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function startStroke(pt) {
        if (!hasBaseImageLoaded) return;
        isDrawing = true;
        hctx.save();
        hctx.lineCap = 'round';
        hctx.lineJoin = 'round';
        hctx.lineWidth = 18;
        hctx.strokeStyle = selectedColor.rgba;
        hctx.beginPath();
        hctx.moveTo(pt.x, pt.y);
      }

      function moveStroke(pt) {
        if (!isDrawing) return;
        hctx.lineTo(pt.x, pt.y);
        hctx.stroke();
        redrawCombinedCanvas();
      }

      function endStroke() {
        if (!isDrawing) return;
        isDrawing = false;
        hctx.restore();
        redrawCombinedCanvas();
      }

      canvas.addEventListener('mousedown', (e) => startStroke(getCanvasPoint(e.clientX, e.clientY)));
      canvas.addEventListener('mousemove', (e) => moveStroke(getCanvasPoint(e.clientX, e.clientY)));
      window.addEventListener('mouseup', endStroke);

      canvas.addEventListener(
        'touchstart',
        (e) => {
          if (!e.touches[0]) return;
          e.preventDefault();
          startStroke(getCanvasPoint(e.touches[0].clientX, e.touches[0].clientY));
        },
        { passive: false }
      );
      canvas.addEventListener(
        'touchmove',
        (e) => {
          if (!e.touches[0]) return;
          e.preventDefault();
          moveStroke(getCanvasPoint(e.touches[0].clientX, e.touches[0].clientY));
        },
        { passive: false }
      );
      canvas.addEventListener('touchend', endStroke);

      document.querySelectorAll('[data-hl-idx]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-hl-idx'));
          selectedColor = HIGHLIGHT_COLORS[idx] || HIGHLIGHT_COLORS[0];
          document.querySelectorAll('[data-hl-idx]').forEach((b, i) => {
            if (i === idx) {
              b.classList.add('border-ink', 'scale-110');
              b.classList.remove('border-transparent');
            } else {
              b.classList.remove('border-ink', 'scale-110');
              b.classList.add('border-transparent');
            }
          });
        });
      });

      clearHlBtn.addEventListener('click', () => {
        hctx.clearRect(0, 0, highlightCanvas.width, highlightCanvas.height);
        redrawCombinedCanvas();
      });

      const camHelper = createInlineCameraHelper({
        triggerBtn: document.getElementById('openPassageCamBtn'),
        fallbackInput: directCamInput,
        panelEl: document.getElementById('passageCamPanel'),
        videoEl: document.getElementById('passageCamVideo'),
        snapBtn: document.getElementById('snapPassageCamBtn'),
        cancelBtn: document.getElementById('cancelPassageCamBtn'),
        onCaptured: (dataUrl) => applyCapturedPassagePhoto(dataUrl),
      });

      passageFileInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          photoDataUrl = await readFileAsDataUrl(file);
          hlSection.classList.remove('hidden');
          initCanvasWithImage(photoDataUrl);
        } catch (err) {
          showToast(err.message);
        }
      });

      if (photoDataUrl) {
        hlSection.classList.remove('hidden');
        initCanvasWithImage(photoDataUrl);
      }

      const modalCard = document.getElementById('modalCard');
      const cleanupObserver = new MutationObserver(() => {
        if (!modalCard.contains(canvas)) {
          camHelper.stopStream();
          window.removeEventListener('mouseup', endStroke);
          cleanupObserver.disconnect();
        }
      });
      cleanupObserver.observe(modalCard, { childList: true });

      document.getElementById('entryEditorForm').addEventListener('submit', (e) => {
        e.preventDefault();
        camHelper.stopStream();
        window.removeEventListener('mouseup', endStroke);
        cleanupObserver.disconnect();

        const formData = new FormData(e.target);
        const photoDate = String(formData.get('photoDate') || '').trim() || getTodayDateStr();

        if (!photoDataUrl) {
          showToast('구절 사진을 촬영하거나 선택해주세요.');
          return;
        }

        const finalPhotoUrl = hasBaseImageLoaded
          ? canvas.toDataURL('image/jpeg', 0.9)
          : photoDataUrl;

        // 현재 선택된 책을 확실히 유지
        state.currentTab = 'home';
        state.selectedBookId = book.id;

        if (existingEntry) {
          existingEntry.photoUrl = finalPhotoUrl;
          existingEntry.photoDate = photoDate;
          closeModal();
          showToast('구절 기록이 수정되었습니다.');
        } else {
          state.entries.push({
            id: `entry-${Date.now()}`,
            bookId: book.id,
            authorId: state.activeUserId,
            photoUrl: finalPhotoUrl,
            photoDate,
            replies: [],
          });
          closeModal();
          showToast('구절 사진이 저장되었습니다.');
        }
        renderApp();
      });
    }

    function openCaptureEntryModal(bookId) {
      openEntryEditorModal({ bookId, existingEntry: null });
    }

    function openEditEntryModal(entryId) {
      const entry = state.entries.find((item) => item.id === entryId);
      if (!entry) return;
      openEntryEditorModal({ bookId: entry.bookId, existingEntry: entry });
    }

    function openDeleteEntryModal(entryId) {
      const entry = state.entries.find((item) => item.id === entryId);
      if (!entry) return;

      openModal(`
        <div class="space-y-3">
          <h3 class="text-base font-bold text-ink">이 구절 기록을 삭제할까요?</h3>
          <p class="text-xs text-muted">삭제한 구절 사진과 달린 답글은 복구할 수 없습니다.</p>
          <div class="flex gap-2 pt-2">
            <button type="button" data-close-modal class="flex-1 py-2.5 rounded-2xl bg-amber-100/70 text-muted text-sm font-semibold">
              취소
            </button>
            <button type="button" id="confirmDeleteEntryBtn" class="flex-1 py-2.5 rounded-2xl bg-rose-600 text-white text-sm font-semibold shadow-sm">
              삭제하기
            </button>
          </div>
        </div>
      `);

      document.getElementById('confirmDeleteEntryBtn').addEventListener('click', () => {
        state.currentTab = 'home';
        state.selectedBookId = entry.bookId;
        state.entries = state.entries.filter((item) => item.id !== entryId);
        closeModal();
        showToast('구절 기록이 삭제되었습니다.');
        renderApp();
      });
    }

    function openPhotoZoomModal(entryId) {
      const entry = state.entries.find((item) => item.id === entryId);
      if (!entry) return;
      const author = getUserById(entry.authorId);

      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <p class="text-sm font-bold text-ink">${escapeXml(author.name)}의 구절 사진</p>
              <p class="text-xs text-muted">${escapeXml(formatKoreanDate(entry.photoDate))}</p>
            </div>
            <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-amber-100/70 text-muted font-bold">✕</button>
          </div>
          <div class="rounded-2xl overflow-hidden bg-stone-900 flex items-center justify-center">
            <img src="${entry.photoUrl}" alt="확대된 구절 사진" class="max-h-[65vh] w-full object-contain" />
          </div>
        </div>
      `);
    }

    /**
     * =========================================================================
     * 9. 전역 이벤트 바인딩 (클릭 위임, 답글 폼, 네비게이션)
     * =========================================================================
     */
    function bindGlobalEvents() {
      let longPressTimer = null;
      let longPressTriggered = false;

      function clearLongPress() {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }

      function beginBookLongPress(bookBtn) {
        clearLongPress();
        longPressTriggered = false;
        const bookId = bookBtn.getAttribute('data-long-press-book');
        const isOwner = bookBtn.getAttribute('data-long-press-owner') === 'true';
        if (!bookId || !isOwner) return;

        longPressTimer = setTimeout(() => {
          longPressTriggered = true;
          openDeleteBookModal(bookId);
        }, 600);
      }

      // 터치 및 마우스 길게 누르기 감지
      document.addEventListener(
        'touchstart',
        (e) => {
          const bookBtn = e.target.closest('[data-long-press-book]');
          if (!bookBtn) return;
          beginBookLongPress(bookBtn);
        },
        { passive: true }
      );

      document.addEventListener('touchmove', () => {
        clearLongPress();
      });

      document.addEventListener('touchend', () => {
        clearLongPress();
      });

      document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const bookBtn = e.target.closest('[data-long-press-book]');
        if (!bookBtn) return;
        beginBookLongPress(bookBtn);
      });

      document.addEventListener('mouseup', () => {
        clearLongPress();
      });

      // 하단 탭 전환
      document.getElementById('navHomeBtn').addEventListener('click', () => {
        state.currentTab = 'home';
        state.selectedBookId = null;
        renderApp();
      });

      document.getElementById('navSettingsBtn').addEventListener('click', () => {
        state.currentTab = 'settings';
        state.selectedBookId = null;
        renderApp();
      });

      // 헤더 뒤로가기
      document.getElementById('headerBackBtn').addEventListener('click', () => {
        state.selectedBookId = null;
        renderApp();
      });

      // 맨 위 오른쪽 '현재 기록 중' 사용자 버튼 클릭 시 선택 메뉴 열기
      document.getElementById('activeUserBadgeBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleActiveUserDropdown();
      });

      // 모달 바깥 클릭 닫기
      document.getElementById('modalBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modalBackdrop') {
          closeModal();
        }
      });

      // 동적 버튼 클릭 이벤트 위임
      document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('activeUserDropdown');
        const badgeBtn = document.getElementById('activeUserBadgeBtn');
        if (
          dropdown &&
          !dropdown.classList.contains('hidden') &&
          !dropdown.contains(e.target) &&
          !badgeBtn?.contains(e.target)
        ) {
          dropdown.classList.add('hidden');
        }

        const pickHeaderUserBtn = e.target.closest('[data-pick-header-user]');
        if (pickHeaderUserBtn) {
          const uid = pickHeaderUserBtn.getAttribute('data-pick-header-user');
          state.activeUserId = uid;
          toggleActiveUserDropdown(false);
          const u = getUserById(uid);
          showToast(`현재 사용자가 "${u.name}"(으)로 변경되었습니다.`);
          renderApp();
          return;
        }

        const closeBtn = e.target.closest('[data-close-modal]');
        if (closeBtn) {
          closeModal();
          return;
        }

        const selectActiveUserBtn = e.target.closest('[data-select-active-user]');
        if (selectActiveUserBtn) {
          const uid = selectActiveUserBtn.getAttribute('data-select-active-user');
          state.activeUserId = uid;
          const u = getUserById(uid);
          showToast(`"${u.name}" 사용자로 전환되었습니다.`);
          renderApp();
          return;
        }

        const addBookBtn = e.target.closest('[data-add-book-for]');
        if (addBookBtn) {
          const ownerId = addBookBtn.getAttribute('data-add-book-for');
          if (ownerId !== state.activeUserId) {
            showToast('본인의 책장에만 책을 추가할 수 있어요.');
            return;
          }
          openAddBookModal(ownerId);
          return;
        }

        const openBookBtn = e.target.closest('[data-open-book]');
        if (openBookBtn) {
          if (longPressTriggered) {
            longPressTriggered = false;
            return;
          }
          const bookId = openBookBtn.getAttribute('data-open-book');
          state.currentTab = 'home';
          state.selectedBookId = bookId;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        const captureBtn = e.target.closest('[data-open-capture-modal]');
        if (captureBtn) {
          const bookId = captureBtn.getAttribute('data-open-capture-modal');
          const book = getBookById(bookId);
          if (!book || book.ownerId !== state.activeUserId) {
            showToast('해당 책장 주인만 구절 사진을 올릴 수 있어요.');
            return;
          }
          openCaptureEntryModal(bookId);
          return;
        }

        const editEntryBtn = e.target.closest('[data-edit-entry]');
        if (editEntryBtn) {
          const entryId = editEntryBtn.getAttribute('data-edit-entry');
          openEditEntryModal(entryId);
          return;
        }

        const deleteEntryBtn = e.target.closest('[data-delete-entry]');
        if (deleteEntryBtn) {
          const entryId = deleteEntryBtn.getAttribute('data-delete-entry');
          openDeleteEntryModal(entryId);
          return;
        }

        const zoomPhotoBtn = e.target.closest('[data-zoom-photo]');
        if (zoomPhotoBtn) {
          const entryId = zoomPhotoBtn.getAttribute('data-zoom-photo');
          openPhotoZoomModal(entryId);
          return;
        }

        const editBookCoverBtn = e.target.closest('[data-edit-book-cover]');
        if (editBookCoverBtn) {
          const bookId = editBookCoverBtn.getAttribute('data-edit-book-cover');
          openEditBookCoverModal(bookId);
        }
      });

      // 답글 폼 제출 위임
      document.addEventListener('submit', (e) => {
        const replyForm = e.target.closest('[data-reply-form]');
        if (!replyForm) return;
        e.preventDefault();

        const entryId = replyForm.getAttribute('data-reply-form');
        const input = replyForm.querySelector('input[name="replyText"]');
        const text = (input?.value || '').trim();
        if (!text) return;

        const entry = state.entries.find((item) => item.id === entryId);
        if (!entry) return;

        entry.replies.push({
          id: `reply-${Date.now()}`,
          authorId: state.activeUserId,
          text,
          date: getTodayDateStr(),
        });

        input.value = '';
        showToast('답글이 등록되었습니다.');
        renderApp();
      });
    }

    // 초기화 실행
    window.addEventListener('DOMContentLoaded', () => {
      bindGlobalEvents();
      renderApp();
    });
  </script>
</body>
</html>
