<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>독서 구절 사진 기록장</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 귀여운 한글 폰트 및 Inter 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&family=Inter:wght@400;500;600;700&family=Jua&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Gamja Flower"', '"Gaegu"', 'Inter', 'sans-serif'],
            serif: ['"Jua"', '"Gaegu"', 'sans-serif'],
          },
          colors: {
            paper: '#FDF8F2',
            surface: '#FFFDF9',
            ink: '#241D18',
            muted: '#66594E',
            accent: '#C96A42',
            accentSoft: '#FCEEE6',
            shelfWood: '#F2E7D8',
          },
        },
      },
    };
  </script>
  <style>
    /* 모바일 중심 가독성 및 귀여운 손글씨 둥근 글자 조화 */
    html, body {
      background-color: #FDF8F2;
      color: #241D18;
      font-family: "Gamja Flower", "Gaegu", "Inter", sans-serif;
      font-size: 18px;
      line-height: 1.65;
      letter-spacing: 0.01em;
      word-break: keep-all;
      -webkit-tap-highlight-color: transparent;
    }
    /* 책 페이지 느낌의 미세한 종이 결 */
    .book-page-texture {
      background-color: #FFFDF9;
      background-image: radial-gradient(rgba(125, 111, 99, 0.06) 0.75px, transparent 0.75px);
      background-size: 14px 14px;
    }
    /* 책등 제본선 및 책장 하단 그림자 */
    .book-spine-edge {
      box-shadow: inset 6px 0 10px -6px rgba(44, 36, 30, 0.28), 0 4px 10px rgba(44, 36, 30, 0.08);
    }
    .shelf-ledge {
      background: linear-gradient(to bottom, #EADBC7 0%, #D9C3A8 100%);
      height: 10px;
      border-radius: 9999px;
      box-shadow: 0 3px 6px rgba(44, 36, 30, 0.12);
    }
    /* 캔버스 터치 스크롤 방지 */
    .highlighter-canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased selection:bg-accentSoft selection:text-accent">
  <!-- 전체 앱 래퍼 (모바일 중심 최대 폭 제한 + 책갈피 느낌) -->
  <div id="app" class="mx-auto max-w-md min-h-screen flex flex-col book-page-texture shadow-md border-x border-amber-900/10 relative pb-24">

    <!-- 상단 헤더 (책 표지 머리말 스타일) -->
    <header class="sticky top-0 z-20 bg-paper/95 backdrop-blur border-b-2 border-amber-900/15 px-4 py-3.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <button
            id="headerBackBtn"
            type="button"
            class="hidden items-center justify-center w-9 h-9 rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink font-bold text-sm shrink-0 transition"
            aria-label="뒤로 가기"
          >
            ←
          </button>
          <div class="min-w-0">
            <h1 id="headerTitle" class="font-serif text-lg font-bold text-ink truncate leading-tight">우리의 독서메모</h1>
            <p id="headerSubtitle" class="text-xs text-muted truncate"></p>
          </div>
        </div>

        <!-- 현재 기록하는 사용자 (맨 위 오른쪽 배치, 클릭 시 사용자 선택) -->

          <span class="text-[10px] font-semibold text-muted leading-none mb-0.5">현재 기록 중</span>

            aria-label="현재 기록 중인 사용자 선택"

            <span id="activeUserDot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>

          <!-- 사용자 선택 팝오버 -->

    <!-- 메인 콘텐츠 영역 (뷰 전환) -->

    <!-- 하단 네비게이션 바 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-surface/95 backdrop-blur border-t border-amber-900/10 px-3 py-2 z-30">
      <div class="grid grid-cols-2 gap-2">
        <button
          id="navHomeBtn"
          type="button"
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm"
        >
          <span>📚</span>
          <span>책장 홈</span>
        </button>
        <button
          id="navSettingsBtn"
          type="button"
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60"
        >

  </div>

  <!-- 커스텀 모달 컨테이너 (alert/confirm 대체용) -->

    <div id="modalCard" class="w-full max-w-md max-h-[90vh] overflow-y-auto rounded-3xl bg-surface p-5 shadow-xl border border-amber-900/10 space-y-4"></div>
  </div>

  <!-- 토스트 메시지 배너 -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      collection,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /**
     * =========================================================================
     * 0. Firebase 설정 및 실시간 Firestore 연동 초기화
     * =========================================================================
     */
    const FALLBACK_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDYv4AIaGOSA1VRRGPICMMVLOMtJY-G9VA",
      authDomain: "readingmemo-a1306.firebaseapp.com",
      projectId: "readingmemo-a1306",
      storageBucket: "readingmemo-a1306.firebasestorage.app",
      messagingSenderId: "295077332637",
      appId: "1:295077332637:web:ae5f3fba2f01149592b674",
      measurementId: "G-Y5E7200DHH",
    };

    const appId = typeof __app_id !== "undefined" ? __app_id : "our-reading-memo";
    const firebaseConfig =
      typeof __firebase_config !== "undefined"
        ? JSON.parse(__firebase_config)
        : FALLBACK_FIREBASE_CONFIG;

    const isFirebaseConfigured =
      firebaseConfig &&
      firebaseConfig.apiKey &&
      !String(firebaseConfig.apiKey).startsWith("YOUR_");

    let db = null;
    let auth = null;
    let currentAuthUser = null;

    if (isFirebaseConfigured) {
      try {
        const fbApp = initializeApp(firebaseConfig);
        db = getFirestore(fbApp);
        auth = getAuth(fbApp);
      } catch (err) {
        console.error("Firebase 초기화 오류:", err);
      }
    }

    function getPublicCollection(collectionName) {
      return collection(db, "artifacts", appId, "public", "data", collectionName);
    }

    function getPublicDoc(collectionName, docId) {
      return doc(db, "artifacts", appId, "public", "data", collectionName, docId);
    }

    /**
     * =========================================================================
     * 1. 상태 관리 및 초기 데이터
     * =========================================================================
     */
    const AVATAR_PALETTE = [
      { bg: 'bg-amber-200', text: 'text-amber-950', dot: 'bg-amber-500', badge: 'bg-amber-100 text-amber-900 border-amber-300' },
      { bg: 'bg-emerald-200', text: 'text-emerald-950', dot: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
      { bg: 'bg-sky-200', text: 'text-sky-950', dot: 'bg-sky-500', badge: 'bg-sky-100 text-sky-900 border-sky-300' },
      { bg: 'bg-rose-200', text: 'text-rose-950', dot: 'bg-rose-500', badge: 'bg-rose-100 text-rose-900 border-rose-300' },
      { bg: 'bg-violet-200', text: 'text-violet-950', dot: 'bg-violet-500', badge: 'bg-violet-100 text-violet-900 border-violet-300' },
      { bg: 'bg-orange-200', text: 'text-orange-950', dot: 'bg-orange-500', badge: 'bg-orange-100 text-orange-900 border-orange-300' },
    ];

    const HIGHLIGHT_COLORS = [
      { name: '노랑', rgba: 'rgba(255, 232, 115, 0.36)', swatch: '#FFE873' },
      { name: '연두', rgba: 'rgba(155, 242, 162, 0.36)', swatch: '#9BF2A2' },
      { name: '분홍', rgba: 'rgba(255, 166, 193, 0.36)', swatch: '#FFA6C1' },
      { name: '하늘', rgba: 'rgba(148, 206, 255, 0.36)', swatch: '#94CEFF' },
    ];

    const DEFAULT_USERS = [
      { id: 'user-kkyukkyu', name: '뀨뀨', paletteIndex: 0, createdAt: 1 },
      { id: 'user-kkyungi', name: '뀽이', paletteIndex: 1, createdAt: 2 },
      { id: 'user-ttungi', name: '뚱이', paletteIndex: 2, createdAt: 3 },
    ];

    const state = {
      currentTab: 'home',
      selectedBookId: null,
      viewMode: 'home',
      activeUserId: 'user-kkyukkyu',
      cloudConnected: false,
      users: [...DEFAULT_USERS],
      books: [],
      entries: [],
    };

    /**
     * =========================================================================
     * 2. 유틸리티 함수
     * =========================================================================
     */
    function getUserById(userId) {
      return state.users.find((u) => u.id === userId) || {
        id: userId || 'unknown',
        name: '알 수 없음',
        paletteIndex: 0,
      };
    }

    function getPalette(paletteIndex = 0) {
      const idx = Math.abs(Number(paletteIndex) || 0) % AVATAR_PALETTE.length;
      return AVATAR_PALETTE[idx];
    }

    function getTodayDateStr() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let toastTimer = null;
    function showToast(message) {
      const banner = document.getElementById('toastBanner');
      banner.textContent = message;
      banner.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2400);
    }
    function openModal(htmlContent, modalSizeClass = 'max-w-md') {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      card.className = `w-full ${modalSizeClass} max-h-[94vh] overflow-y-auto rounded-3xl bg-surface p-5 shadow-xl border border-amber-900/10 space-y-4`;
      card.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      card.innerHTML = '';
    }

    function bindPhotoCaptureControls({
      triggerCamId,
      nativeCamInputId,
      galleryInputId,
      camOverlayId,
      videoId,
      captureFrameBtnId,
      cancelCamBtnId,
      onPhotoSelected,
    }) {
      const triggerCamBtn = triggerCamId ? document.getElementById(triggerCamId) : null;
      const nativeCamInput = nativeCamInputId ? document.getElementById(nativeCamInputId) : null;
      const galleryInput = galleryInputId ? document.getElementById(galleryInputId) : null;
      const camOverlay = camOverlayId ? document.getElementById(camOverlayId) : null;
      const videoEl = videoId ? document.getElementById(videoId) : null;
      const captureFrameBtn = captureFrameBtnId ? document.getElementById(captureFrameBtnId) : null;
      const cancelCamBtn = cancelCamBtnId ? document.getElementById(cancelCamBtnId) : null;

      let activeStream = null;

      function stopStream() {
        if (activeStream) {
          activeStream.getTracks().forEach((track) => track.stop());
          activeStream = null;
        }
        if (videoEl) {
          videoEl.srcObject = null;
        }
        if (camOverlay) {
          camOverlay.classList.add('hidden');
        }
      }

      function fallbackToNativeInput() {
        stopStream();
        if (nativeCamInput) {
          nativeCamInput.setAttribute('capture', 'environment');
          nativeCamInput.capture = 'environment';
          nativeCamInput.click();
        } else if (galleryInput) {
          galleryInput.click();
        }
      }

      if (triggerCamBtn) {
        triggerCamBtn.addEventListener('click', async () => {
          const isFileScheme = window.location.protocol === 'file:' || window.location.href.includes('FileProvider');
          if (isFileScheme || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            fallbackToNativeInput();
            return;
          }

          if (camOverlay && videoEl) {
            try {
              stopStream();
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' } },
                audio: false,
              });
              activeStream = stream;
              videoEl.srcObject = stream;
              camOverlay.classList.remove('hidden');
              await videoEl.play();
              return;
            } catch (err) {
              fallbackToNativeInput();
              return;
            }
          }

          fallbackToNativeInput();
        });
      }

      if (captureFrameBtn) {
        captureFrameBtn.addEventListener('click', async () => {
          if (!videoEl || !videoEl.videoWidth || !videoEl.videoHeight) {
            fallbackToNativeInput();
            return;
          }
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = videoEl.videoWidth;
          tempCanvas.height = videoEl.videoHeight;
          const tctx = tempCanvas.getContext('2d');
          tctx.drawImage(videoEl, 0, 0, tempCanvas.width, tempCanvas.height);
          const rawDataUrl = tempCanvas.toDataURL('image/jpeg', 0.85);
          stopStream();
          const compressed = await compressImageDataUrl(rawDataUrl);
          await onPhotoSelected(compressed);
        });
      }

      if (cancelCamBtn) {
        cancelCamBtn.addEventListener('click', () => {
          stopStream();
        });
      }

      if (nativeCamInput) {
        nativeCamInput.setAttribute('capture', 'environment');
        nativeCamInput.capture = 'environment';
        nativeCamInput.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = '';
          if (!file) return;
          try {
            const dataUrl = await readFileAsDataUrl(file);
            await onPhotoSelected(dataUrl);
          } catch (err) {
            showToast(err.message || '사진을 불러오지 못했습니다.');
          }
        });
      }

      if (galleryInput) {
        galleryInput.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = '';
          if (!file) return;
          try {
            const dataUrl = await readFileAsDataUrl(file);
            await onPhotoSelected(dataUrl);
          } catch (err) {
            showToast(err.message || '사진을 불러오지 못했습니다.');
          }
        });
      }

      return { stopStream };
    }

    function compressImageDataUrl(rawDataUrl, maxDimension = 960, quality = 0.78) {
      return new Promise((resolve) => {
        if (!rawDataUrl || !rawDataUrl.startsWith('data:image/')) {
          resolve(rawDataUrl);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || 800;
          const h = img.naturalHeight || 800;
          const scale = Math.max(w, h) > maxDimension ? maxDimension / Math.max(w, h) : 1;
          const targetW = Math.max(1, Math.round(w * scale));
          const targetH = Math.max(1, Math.round(h * scale));
          const c = document.createElement('canvas');
          c.width = targetW;
          c.height = targetH;
          const cctx = c.getContext('2d');
          cctx.drawImage(img, 0, 0, targetW, targetH);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(rawDataUrl);
        img.src = rawDataUrl;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          reject(new Error('선택된 파일이 없습니다.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
          const raw = String(reader.result || '');
          const compressed = await compressImageDataUrl(raw);
          resolve(compressed);
        };
        reader.onerror = () => reject(new Error('파일을 읽는 중 오류가 발생했습니다.'));
        reader.readAsDataURL(file);
      });
    }

    /**
     * =========================================================================
     * 2-1. Firestore 실시간 동기화 및 CRUD 헬퍼
     * =========================================================================
     */
    async function syncSaveUser(userObj) {
      if (!db || !currentAuthUser) return;
      try {
        await setDoc(getPublicDoc('users', userObj.id), userObj);
      } catch (err) {
        console.error('사용자 저장 오류:', err);
        showToast('클라우드 동기화에 실패했습니다.');
      }
    }

    async function syncSaveBook(bookObj) {
      if (!db || !currentAuthUser) return;
      try {
        await setDoc(getPublicDoc('books', bookObj.id), bookObj);
      } catch (err) {
        console.error('책 저장 오류:', err);
        showToast('책 저장 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncDeleteBookAndEntries(bookId, relatedEntryIds) {
      if (!db || !currentAuthUser) return;
      try {
        await deleteDoc(getPublicDoc('books', bookId));
        for (const entryId of relatedEntryIds) {
          await deleteDoc(getPublicDoc('entries', entryId));
        }
      } catch (err) {
        console.error('책 삭제 오류:', err);
        showToast('책 삭제 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncSaveEntry(entryObj) {
      if (!db || !currentAuthUser) return;
      try {
        await setDoc(getPublicDoc('entries', entryObj.id), entryObj);
      } catch (err) {
        console.error('구절 저장 오류:', err);
        showToast('구절 저장 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncUpdateEntryReplies(entryId, replies) {
      if (!db || !currentAuthUser) return;
      try {
        await updateDoc(getPublicDoc('entries', entryId), { replies });
      } catch (err) {
        console.error('답글 업데이트 오류:', err);
        showToast('답글 저장 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncDeleteEntry(entryId) {
      if (!db || !currentAuthUser) return;
      try {
        await deleteDoc(getPublicDoc('entries', entryId));
      } catch (err) {
        console.error('구절 삭제 오류:', err);
        showToast('구절 삭제 중 동기화 오류가 발생했습니다.');
      }
    }

    async function initRealtimeSync() {
      if (!db || !auth) return;
      try {
        if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentAuthUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentAuthUser = cred.user;
        }
      } catch (err) {
        console.error('Firebase 인증 오류:', err);
        showToast('실시간 연동 인증에 실패했습니다. 설정을 확인해주세요.');
        return;
      }

      if (!currentAuthUser) return;
      state.cloudConnected = true;

      onSnapshot(
        getPublicCollection('users'),
        async (snapshot) => {
          if (snapshot.empty) {
            for (const defaultUser of DEFAULT_USERS) {
              await syncSaveUser(defaultUser);
            }
            return;
          }
          const loadedUsers = [];
          snapshot.forEach((docSnap) => {
            loadedUsers.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedUsers.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          state.users = loadedUsers;
          if (!state.users.some((u) => u.id === state.activeUserId) && state.users[0]) {
            state.activeUserId = state.users[0].id;
          }
          renderApp();
        },
        (error) => {
          console.error('users 구독 오류:', error);
        }
      );

      onSnapshot(
        getPublicCollection('books'),
        (snapshot) => {
          const loadedBooks = [];
          snapshot.forEach((docSnap) => {
            loadedBooks.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedBooks.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          state.books = loadedBooks;
          renderApp();
        },
        (error) => {
          console.error('books 구독 오류:', error);
        }
      );

      onSnapshot(
        getPublicCollection('entries'),
        (snapshot) => {
          const loadedEntries = [];
          snapshot.forEach((docSnap) => {
            loadedEntries.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedEntries.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          state.entries = loadedEntries;
          renderApp();
        },
        (error) => {
          console.error('entries 구독 오류:', error);
        }
      );
    }

    /**
     * =========================================================================
     * 3. 메인 뷰 라우터 및 렌더링
     * =========================================================================
     */
    function renderApp() {
      const activeUser = getUserById(state.activeUserId);
      const activePalette = getPalette(activeUser.paletteIndex);
      document.getElementById('activeUserLabel').textContent = activeUser.name;
      document.getElementById('activeUserDot').className = `w-2.5 h-2.5 rounded-full ${activePalette.dot}`;

      const dropdown = document.getElementById('activeUserDropdown');
      dropdown.innerHTML = state.users
        .map((u) => {
          const pal = getPalette(u.paletteIndex);
          const isSelected = u.id === state.activeUserId;
          return `
            <button
              type="button"
              data-select-active-user="${u.id}"
              class="w-full flex items-center justify-between px-3 py-2 text-xs text-left hover:bg-amber-100/70 transition ${
                isSelected ? 'font-bold text-accent bg-amber-50' : 'text-ink'
              }"
            >
              <span class="flex items-center gap-2 truncate">
                <span class="w-2.5 h-2.5 rounded-full shrink-0 ${pal.dot}"></span>
                <span class="truncate">${escapeHtml(u.name)}</span>
              </span>
              ${isSelected ? '<span>✓</span>' : ''}
            </button>
          `;
        })
        .join('');

      const navHomeBtn = document.getElementById('navHomeBtn');
      const navSettingsBtn = document.getElementById('navSettingsBtn');
      if (state.currentTab === 'home') {
        navHomeBtn.className = 'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
        navSettingsBtn.className = 'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';
      } else {
        navHomeBtn.className = 'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';
        navSettingsBtn.className = 'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
      }

      const mainContent = document.getElementById('mainContent');
      const backBtn = document.getElementById('headerBackBtn');
      const headerTitle = document.getElementById('headerTitle');
      const headerSubtitle = document.getElementById('headerSubtitle');

      if (state.currentTab === 'settings') {
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
        headerTitle.textContent = '사용자 및 책장 설정';
        headerSubtitle.textContent = '기록하는 멤버를 추가하거나 관리하세요';
        renderSettingsView(mainContent);
        return;
      }

      if (state.selectedBookId) {
        const book = state.books.find((b) => b.id === state.selectedBookId);
        if (!book) {
          state.selectedBookId = null;
          renderApp();
          return;
        }
        const owner = getUserById(book.ownerId);
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
        headerTitle.textContent = book.title;
        headerSubtitle.textContent = `${owner.name}의 책장${book.author ? ` · ${book.author}` : ''}`;
        renderBookDetailView(mainContent, book);
        return;
      }

      backBtn.classList.add('hidden');
      backBtn.classList.remove('flex');
      headerTitle.textContent = '우리의 독서메모';
      headerSubtitle.textContent = state.cloudConnected
        ? '실시간 동기화 중 · 함께 남기는 책장'
        : '소중한 문장과 사진을 함께 남기는 책장';
      renderHomeView(mainContent);
    }

    /**
     * =========================================================================
     * 4. 책장 홈 뷰 렌더링 (사용자별 책장 섹션 + 책 추가 + 책 삭제)
     * =========================================================================
     */
    function renderHomeView(container) {
      const sectionsHtml = state.users
        .map((user) => {
          const pal = getPalette(user.paletteIndex);
          const userBooks = state.books.filter((b) => b.ownerId === user.id);

          const booksGridHtml = userBooks
            .map((book) => {
              const entryCount = state.entries.filter((e) => e.bookId === book.id).length;
              return `
                <div class="group relative flex flex-col">
                  <button
                    type="button"
                    data-open-book="${book.id}"
                    class="w-full text-left flex flex-col rounded-2xl overflow-hidden bg-surface border border-amber-900/15 book-spine-edge hover:-translate-y-0.5 transition cursor-pointer"
                  >
                    <div class="aspect-[3/4] w-full bg-amber-100/50 relative overflow-hidden flex items-center justify-center">
                      ${
                        book.coverImage
                          ? `<img src="${book.coverImage}" alt="${escapeHtml(book.title)} 표지" class="w-full h-full object-cover" />`
                          : `<div class="p-2.5 text-center flex flex-col items-center justify-center gap-1">
                               <span class="text-2xl">📖</span>
                               <span class="text-xs font-bold text-ink line-clamp-2 leading-snug">${escapeHtml(book.title)}</span>
                             </div>`
                      }
                      <span class="absolute bottom-1.5 right-1.5 rounded-full bg-ink/75 text-white text-[10px] font-semibold px-2 py-0.5">
                        구절 ${entryCount}
                      </span>
                    </div>
                    <div class="p-2 bg-surface">
                      <p class="text-xs font-bold text-ink truncate">${escapeHtml(book.title)}</p>
                      <p class="text-[11px] text-muted truncate">${escapeHtml(book.author || '지은이 미상')}</p>
                    </div>
                  </button>

                  <button
                    type="button"
                    data-delete-book="${book.id}"
                    title="책 삭제"
                    aria-label="${escapeHtml(book.title)} 삭제"
                    class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-surface border border-amber-900/20 text-muted hover:text-red-600 hover:border-red-300 shadow-xs flex items-center justify-center text-xs font-bold transition cursor-pointer"
                  >
                    ×
                  </button>
                </div>
              `;
            })
            .join('');

          const addBookCardHtml = `
            <button
              type="button"
              data-add-book-for-user="${user.id}"
              class="aspect-[3/4] w-full rounded-2xl border-2 border-dashed border-amber-900/25 bg-amber-50/60 hover:bg-amber-100/70 flex flex-col items-center justify-center gap-1.5 p-2 text-center transition cursor-pointer min-h-[132px]"
            >
              <span class="w-8 h-8 rounded-full bg-accentSoft text-accent flex items-center justify-center text-lg font-bold">+</span>
              <span class="text-xs font-bold text-ink leading-tight">책 추가</span>
              <span class="text-[10px] text-muted">${escapeHtml(user.name)} 책장</span>
            </button>
          `;

          return `
            <section class="rounded-3xl bg-surface/90 border border-amber-900/10 p-3.5 shadow-2xs space-y-3">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="w-7 h-7 rounded-full ${pal.bg} ${pal.text} flex items-center justify-center text-xs font-bold shrink-0">
                    ${escapeHtml(user.name.slice(0, 1))}
                  </span>
                  <h2 class="font-serif text-base font-bold text-ink truncate">${escapeHtml(user.name)}의 책장</h2>
                  <span class="text-xs text-muted shrink-0">(${userBooks.length}권)</span>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2.5 items-start">
                ${booksGridHtml}
                ${addBookCardHtml}
              </div>

              <div class="shelf-ledge w-full"></div>
            </section>
          `;
        })
        .join('');

      container.innerHTML = `
        <div class="space-y-5">
          ${sectionsHtml}
        </div>
      `;
    }

    /**
     * =========================================================================
     * 5. 책 상세 (구절 사진 피드 + 형광펜 편집 + 답글 스레드) 뷰 렌더링
     * =========================================================================
     */
    function renderBookDetailView(container, book) {
      const bookEntries = state.entries.filter((e) => e.bookId === book.id);

      const entriesHtml =
        bookEntries.length === 0
          ? `
            <div class="rounded-3xl bg-surface border border-dashed border-amber-900/20 p-8 text-center space-y-2">
              <p class="text-3xl">📷</p>
              <p class="text-sm font-bold text-ink">아직 기록된 구절 사진이 없어요</p>
              <p class="text-xs text-muted">아래 '구절 사진 찍기' 버튼으로 인상 깊은 문장을 남겨보세요.</p>
            </div>
          `
          : bookEntries
              .map((entry) => {
                const author = getUserById(entry.authorId);
                const authorPal = getPalette(author.paletteIndex);
                const replies = Array.isArray(entry.replies) ? entry.replies : [];

                const repliesListHtml = replies
                  .map((rep) => {
                    const repUser = getUserById(rep.authorId);
                    const repPal = getPalette(repUser.paletteIndex);
                    return `
                      <div class="flex items-start gap-2 rounded-2xl bg-paper px-3 py-2 border border-amber-900/10">
                        <span class="mt-0.5 px-2 py-0.5 rounded-full text-[11px] font-bold border shrink-0 ${repPal.badge}">
                          ${escapeHtml(repUser.name)}
                        </span>
                        <div class="min-w-0 flex-1">
                          <p class="text-xs text-ink break-words leading-relaxed">${escapeHtml(rep.text)}</p>
                          <p class="text-[10px] text-muted mt-0.5">${escapeHtml(rep.date || '')}</p>
                        </div>
                      </div>
                    `;
                  })
                  .join('');

                return `
                  <article class="rounded-3xl bg-surface border border-amber-900/15 shadow-2xs overflow-hidden space-y-3 pb-3.5">
                    <div class="flex items-center justify-between gap-2 px-3.5 pt-3.5">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold border shrink-0 ${authorPal.badge}">
                          ${escapeHtml(author.name)}
                        </span>
                        <span class="text-xs text-muted truncate">${escapeHtml(entry.photoDate || '')}</span>
                      </div>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <button
                          type="button"
                          data-edit-entry="${entry.id}"
                          class="px-2.5 py-1 rounded-xl bg-amber-100/80 hover:bg-amber-200/80 text-xs font-semibold text-ink transition cursor-pointer"
                        >
                          수정
                        </button>
                        <button
                          type="button"
                          data-delete-entry="${entry.id}"
                          class="px-2.5 py-1 rounded-xl bg-red-50 hover:bg-red-100 text-xs font-semibold text-red-600 transition cursor-pointer"
                        >
                          삭제
                        </button>
                      </div>
                    </div>

                    <div class="px-3.5">
                      <div class="rounded-2xl overflow-hidden border border-amber-900/10 bg-amber-50/40">
                        <img
                          src="${entry.photoUrl}"
                          alt="${escapeHtml(book.title)} 구절 사진"
                          class="w-full max-h-[420px] object-contain mx-auto bg-amber-950/[0.03]"
                        />
                      </div>
                    </div>

                    <div class="px-3.5 space-y-2">
                      <div class="space-y-1.5">
                        ${repliesListHtml}
                      </div>

                      <form data-reply-form="${entry.id}" class="flex items-center gap-2 pt-1">
                        <input
                          type="text"
                          name="replyText"
                          placeholder="${escapeHtml(getUserById(state.activeUserId).name)}(으)로 답글 남기기..."
                          class="flex-1 min-w-0 rounded-2xl border border-amber-900/20 bg-paper px-3 py-2 text-xs text-ink placeholder:text-muted/70 focus:outline-none focus:border-accent"
                        />
                        <button
                          type="submit"
                          class="px-3.5 py-2 rounded-2xl bg-accent hover:bg-accent/90 text-white text-xs font-bold shrink-0 transition cursor-pointer"
                        >
                          등록
                        </button>
                      </form>
                    </div>
                  </article>
                `;
              })
              .join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="rounded-3xl bg-surface border border-amber-900/15 p-3.5 flex items-center gap-3.5 shadow-2xs">
            <div class="w-16 h-22 rounded-xl overflow-hidden bg-amber-100/60 border border-amber-900/10 shrink-0 flex items-center justify-center">
              ${
                book.coverImage
                  ? `<img src="${book.coverImage}" alt="${escapeHtml(book.title)}" class="w-full h-full object-cover" />`
                  : `<span class="text-2xl">📖</span>`
              }
            </div>
            <div class="min-w-0 flex-1 space-y-1">
              <h2 class="font-serif text-base font-bold text-ink truncate">${escapeHtml(book.title)}</h2>
              <p class="text-xs text-muted truncate">${escapeHtml(book.author || '지은이 미상')}</p>
              <div class="flex items-center gap-2 pt-1">
                <button
                  type="button"
                  data-edit-book-cover="${book.id}"
                  class="px-2.5 py-1 rounded-xl bg-amber-100/80 hover:bg-amber-200/80 text-[11px] font-semibold text-ink transition cursor-pointer"
                >
                  표지 수정
                </button>
                <span class="text-[11px] text-muted">총 ${bookEntries.length}개의 구절</span>
              </div>
            </div>
          </div>

          <button
            type="button"
            data-open-new-entry="${book.id}"
            class="w-full py-3 px-4 rounded-2xl bg-accent hover:bg-accent/90 active:scale-[0.99] text-white font-bold text-sm shadow-sm flex items-center justify-center gap-2 transition cursor-pointer"
          >
            <span>📷</span>
            <span>구절 사진 찍기</span>
          </button>

          <div class="space-y-4">
            ${entriesHtml}
          </div>
        </div>
      `;
    }

    /**
     * =========================================================================
     * 6. 설정 뷰 렌더링 (사용자 추가)
     * =========================================================================
     */
    function renderSettingsView(container) {
      const userChipsHtml = state.users
        .map((u) => {
          const pal = getPalette(u.paletteIndex);
          const isCurrent = u.id === state.activeUserId;
          return `
            <div class="flex items-center justify-between rounded-2xl border border-amber-900/15 bg-paper px-3.5 py-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-7 h-7 rounded-full ${pal.bg} ${pal.text} flex items-center justify-center text-xs font-bold shrink-0">
                  ${escapeHtml(u.name.slice(0, 1))}
                </span>
                <span class="text-sm font-bold text-ink truncate">${escapeHtml(u.name)}</span>
                ${
                  isCurrent
                    ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-accentSoft text-accent font-semibold">현재 기록 중</span>`
                    : ''
                }
              </div>
              <button
                type="button"
                data-select-active-user="${u.id}"
                class="text-xs font-semibold px-2.5 py-1 rounded-xl bg-amber-100/80 hover:bg-amber-200/80 text-ink transition cursor-pointer"
              >
                선택
              </button>
            </div>
          `;
        })
        .join('');

      container.innerHTML = `
        <div class="space-y-5">
          <section class="rounded-3xl bg-surface border border-amber-900/15 p-4 shadow-2xs space-y-3">
            <h2 class="font-serif text-base font-bold text-ink">함께 기록하는 사용자</h2>
            <div class="space-y-2">
              ${userChipsHtml}
            </div>
          </section>

          <section class="rounded-3xl bg-surface border border-amber-900/15 p-4 shadow-2xs space-y-3">
            <h2 class="font-serif text-base font-bold text-ink">새 사용자 추가</h2>
            <form id="addUserForm" class="flex items-center gap-2">
              <input
                type="text"
                name="newUserName"
                maxlength="12"
                placeholder="예: 찌찌, 콩이"
                class="flex-1 min-w-0 rounded-2xl border border-amber-900/20 bg-paper px-3.5 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:outline-none focus:border-accent"
              />
              <button
                type="submit"
                class="px-4 py-2.5 rounded-2xl bg-accent hover:bg-accent/90 text-white text-sm font-bold shrink-0 transition cursor-pointer"
              >
                추가
              </button>
            </form>
          </section>
        </div>
      `;

      const addUserForm = document.getElementById('addUserForm');
      if (addUserForm) {
        addUserForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const name = String(formData.get('newUserName') || '').trim();
          if (!name) {
            showToast('사용자 이름을 입력해주세요.');
            return;
          }
          const newUser = {
            id: `user-${Date.now()}`,
            name,
            paletteIndex: state.users.length % AVATAR_PALETTE.length,
            createdAt: Date.now(),
          };
          state.users.push(newUser);
          state.activeUserId = newUser.id;
          renderApp();
          await syncSaveUser(newUser);
          showToast(`"${name}" 사용자가 추가되었습니다.`);
        });
      }
    }

    /**
     * =========================================================================
     * 7. 모달 핸들러 (책 추가, 책 삭제, 표지 수정, 구절 사진 찍기/형광펜, 구절 삭제)
     * =========================================================================
     */
    function openAddBookModal(ownerId) {
      const owner = getUserById(ownerId);
      let tempCoverUrl = '';

      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="font-serif text-lg font-bold text-ink">${escapeHtml(owner.name)} 책장에 책 추가</h3>
          <button type="button" id="closeModalBtn" class="w-8 h-8 rounded-full bg-amber-100/80 text-ink font-bold text-sm flex items-center justify-center cursor-pointer">✕</button>
        </div>

        <form id="addBookForm" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-ink mb-1">책 제목 *</label>
            <input
              type="text"
              name="title"
              required
              placeholder="예: 어린 왕자"
              class="w-full rounded-2xl border border-amber-900/20 bg-paper px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-accent"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-ink mb-1">지은이 (선택)</label>
            <input
              type="text"
              name="author"
              placeholder="예: 생텍쥐페리"
              class="w-full rounded-2xl border border-amber-900/20 bg-paper px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-accent"
            />
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-bold text-ink">책 표지 사진 (선택 안 해도 돼요)</label>
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                id="addBookCamBtn"
                class="py-2.5 px-3 rounded-2xl bg-accentSoft hover:bg-amber-200/70 text-ink text-xs font-bold flex items-center justify-center gap-1.5 transition cursor-pointer"
              >
                <span>📸</span>
                <span>카메라 앱으로 바로 찍기</span>
              </button>
              <label class="py-2.5 px-3 rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink text-xs font-bold flex items-center justify-center gap-1.5 transition cursor-pointer">
                <span>🖼️</span>
                <span>사진 파일 선택</span>
                <input id="addBookGalleryInput" type="file" accept="image/*" class="hidden" />
              </label>
              <input id="addBookNativeCamInput" type="file" accept="image/*" capture="environment" class="hidden" />
            </div>

            <div id="addBookCamOverlay" class="hidden rounded-2xl overflow-hidden border border-amber-900/20 bg-black p-2 space-y-2">
              <video id="addBookVideo" playsinline autoplay muted class="w-full max-h-52 object-cover rounded-xl bg-black"></video>
              <div class="flex gap-2">
                <button type="button" id="addBookCaptureBtn" class="flex-1 py-2 rounded-xl bg-accent text-white text-xs font-bold cursor-pointer">촬영하기</button>
                <button type="button" id="addBookCancelCamBtn" class="px-3 py-2 rounded-xl bg-white/20 text-white text-xs font-semibold cursor-pointer">닫기</button>
              </div>
            </div>

            <div id="addBookCoverPreview" class="hidden relative rounded-2xl overflow-hidden border border-amber-900/15 bg-amber-50/50 p-2">
              <img id="addBookCoverImg" src="" alt="표지 미리보기" class="w-24 h-32 object-cover rounded-xl mx-auto" />
              <button type="button" id="clearAddBookCoverBtn" class="mt-1.5 mx-auto block text-[11px] text-red-600 font-semibold cursor-pointer">표지 제거</button>
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" id="cancelAddBookBtn" class="flex-1 py-2.5 rounded-2xl bg-amber-100/70 text-ink text-sm font-bold cursor-pointer">취소</button>
            <button type="submit" class="flex-1 py-2.5 rounded-2xl bg-accent text-white text-sm font-bold cursor-pointer">책장에 넣기</button>
          </div>
        </form>
      `);

      const camHelper = bindPhotoCaptureControls({
        triggerCamId: 'addBookCamBtn',
        nativeCamInputId: 'addBookNativeCamInput',
        galleryInputId: 'addBookGalleryInput',
        camOverlayId: 'addBookCamOverlay',
        videoId: 'addBookVideo',
        captureFrameBtnId: 'addBookCaptureBtn',
        cancelCamBtnId: 'addBookCancelCamBtn',
        onPhotoSelected: async (dataUrl) => {
          tempCoverUrl = dataUrl;
          const previewBox = document.getElementById('addBookCoverPreview');
          const previewImg = document.getElementById('addBookCoverImg');
          previewImg.src = dataUrl;
          previewBox.classList.remove('hidden');
        },
      });

      document.getElementById('clearAddBookCoverBtn').addEventListener('click', () => {
        tempCoverUrl = '';
        document.getElementById('addBookCoverImg').src = '';
        document.getElementById('addBookCoverPreview').classList.add('hidden');
      });

      const handleClose = () => {
        camHelper.stopStream();
        closeModal();
      };
      document.getElementById('closeModalBtn').addEventListener('click', handleClose);
      document.getElementById('cancelAddBookBtn').addEventListener('click', handleClose);

      document.getElementById('addBookForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        camHelper.stopStream();

            <div class="flex gap-2">
              <button type="button" id="entryCaptureBtn" class="flex-1 py-2 rounded-xl bg-accent text-white text-xs font-bold cursor-pointer">촬영하기</button>
              <button type="button" id="entryCancelCamBtn" class="px-3 py-2 rounded-xl bg-white/20 text-white text-xs font-semibold cursor-pointer">닫기</button>

          <div id="canvasWrapper" class="rounded-2xl border border-amber-900/15 bg-amber-50/40 overflow-hidden min-h-[300px] sm:min-h-[380px] flex items-center justify-center">
            <p id="canvasPlaceholder" class="text-xs text-muted p-6 text-center">
              위 버튼으로 구절 사진을 찍거나 선택하면<br/>큰 화면에서 글자를 보며 밑줄을 그을 수 있어요.
            </p>

          </div>

          <div class="flex gap-2 pt-1">
            <button type="button" id="cancelEntryEditorBtn" class="flex-1 py-2.5 rounded-2xl bg-amber-100/70 text-ink text-sm font-bold cursor-pointer">취소</button>

      `, 'max-w-2xl');

      const canvas = document.getElementById('highlighterCanvas');
      const ctx = canvas.getContext('2d');
      const placeholder = document.getElementById('canvasPlaceholder');

      function loadImageOntoCanvas(src) {
        if (!src) return;
        const img = new Image();
        img.onload = () => {
          const maxW = 900;
          const natW = img.naturalWidth || 720;
          const natH = img.naturalHeight || 960;
          const scale = natW > maxW ? maxW / natW : 1;
          canvas.width = Math.max(1, Math.round(natW * scale));
          canvas.height = Math.max(1, Math.round(natH * scale));
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          hasBaseImageLoaded = true;
          placeholder.classList.add('hidden');
          canvas.classList.remove('hidden');
        };
        img.src = src;
      }

      if (photoDataUrl) {
        loadImageOntoCanvas(photoDataUrl);
      }

      document.querySelectorAll('[data-highlight-color]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentHighlightColor = decodeURIComponent(btn.getAttribute('data-highlight-color'));
          document.querySelectorAll('[data-highlight-color]').forEach((other) => {
            other.classList.remove('border-ink', 'bg-amber-100/80');
            other.classList.add('border-amber-900/15', 'bg-paper');
          });
          btn.classList.remove('border-amber-900/15', 'bg-paper');
          btn.classList.add('border-ink', 'bg-amber-100/80');
        });
      });

      document.getElementById('undoHighlightBtn').addEventListener('click', () => {
        if (!photoDataUrl) return;
        loadImageOntoCanvas(photoDataUrl);
        showToast('원본 사진으로 되돌렸습니다.');
      });

      function getCanvasPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / (rect.width || 1);
        const scaleY = canvas.height / (rect.height || 1);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function startStroke(clientX, clientY) {
        if (!hasBaseImageLoaded) return;
        isDrawing = true;
        const pt = getCanvasPoint(clientX, clientY);
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(10, Math.round(canvas.width * 0.024));
        ctx.strokeStyle = currentHighlightColor;
        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y);
        ctx.lineTo(pt.x + 0.1, pt.y);
        ctx.stroke();
        ctx.restore();
      }

      function moveStroke(clientX, clientY) {
        if (!isDrawing || !hasBaseImageLoaded) return;
        const pt = getCanvasPoint(clientX, clientY);
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(10, Math.round(canvas.width * 0.024));
        ctx.strokeStyle = currentHighlightColor;
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
        ctx.restore();
      }

      function endStroke() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', (e) => startStroke(e.clientX, e.clientY));
      canvas.addEventListener('mousemove', (e) => moveStroke(e.clientX, e.clientY));
      window.addEventListener('mouseup', endStroke);

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches[0]) {
          e.preventDefault();
          startStroke(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches[0]) {
          e.preventDefault();
          moveStroke(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchend', endStroke);

      const camHelper = bindPhotoCaptureControls({
        triggerCamId: 'entryCamBtn',
        nativeCamInputId: 'entryNativeCamInput',
        galleryInputId: 'entryGalleryInput',
        camOverlayId: 'entryCamOverlay',
        videoId: 'entryVideo',
        captureFrameBtnId: 'entryCaptureBtn',
        cancelCamBtnId: 'entryCancelCamBtn',
        onPhotoSelected: async (dataUrl) => {
          photoDataUrl = dataUrl;
          loadImageOntoCanvas(dataUrl);
        },
      });

      const cleanupObserver = new MutationObserver(() => {
        if (!document.body.contains(canvas)) {
          camHelper.stopStream();
          window.removeEventListener('mouseup', endStroke);
          cleanupObserver.disconnect();
        }
      });
      cleanupObserver.observe(document.body, { childList: true, subtree: true });

      const handleClose = () => {
        camHelper.stopStream();
        window.removeEventListener('mouseup', endStroke);
        cleanupObserver.disconnect();
        closeModal();
      };
      document.getElementById('closeEntryEditorBtn').addEventListener('click', handleClose);
      document.getElementById('cancelEntryEditorBtn').addEventListener('click', handleClose);

      document.getElementById('entryEditorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        camHelper.stopStream();
        window.removeEventListener('mouseup', endStroke);
        cleanupObserver.disconnect();

        const formData = new FormData(e.target);
        const photoDate = String(formData.get('photoDate') || '').trim() || getTodayDateStr();

        if (!photoDataUrl) {
          showToast('구절 사진을 촬영하거나 선택해주세요.');
          return;
        }

        const rawFinalUrl = hasBaseImageLoaded
          ? canvas.toDataURL('image/jpeg', 0.82)
          : photoDataUrl;
        const finalPhotoUrl = await compressImageDataUrl(rawFinalUrl, 960, 0.78);

        state.currentTab = 'home';
        state.selectedBookId = book.id;

        if (existingEntry) {
          existingEntry.photoUrl = finalPhotoUrl;
          existingEntry.photoDate = photoDate;
          closeModal();
          renderApp();
          await syncSaveEntry(existingEntry);
          showToast('구절 기록이 수정되었습니다.');
        } else {
          const newEntry = {
            id: `entry-${Date.now()}`,
            bookId: book.id,
            authorId: state.activeUserId,
            photoUrl: finalPhotoUrl,
            photoDate,
            replies: [],
            createdAt: Date.now(),
          };
          state.entries.push(newEntry);
          closeModal();
          renderApp();
          await syncSaveEntry(newEntry);
          showToast('구절 사진이 저장되었습니다.');
        }
      });
    }

    /**
     * =========================================================================
     * 8. 전역 이벤트 바인딩 및 앱 시작
     * =========================================================================

    function bindGlobalEvents() {
      const badgeBtn = document.getElementById('activeUserBadgeBtn');
      const dropdown = document.getElementById('activeUserDropdown');

      badgeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && !badgeBtn.contains(e.target)) {
          dropdown.classList.add('hidden');
        }
      });

      document.getElementById('navHomeBtn').addEventListener('click', () => {
        state.selectedBookId = null;
        state.currentTab = 'home';
        renderApp();
      });

      document.getElementById('navSettingsBtn').addEventListener('click', () => {
        state.currentTab = 'settings';
        renderApp();
      });

      document.getElementById('headerBackBtn').addEventListener('click', () => {
        state.selectedBookId = null;
        state.currentTab = 'home';
        renderApp();
      });

      document.getElementById('modalBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modalBackdrop') {
          closeModal();
        }
      });

      document.addEventListener('click', (e) => {
        const selectUserBtn = e.target.closest('[data-select-active-user]');
        if (selectUserBtn) {
          const userId = selectUserBtn.getAttribute('data-select-active-user');
          state.activeUserId = userId;
          dropdown.classList.add('hidden');
          renderApp();
          showToast(`${getUserById(userId).name}님으로 전환되었습니다.`);
          return;
        }

        const addBookBtn = e.target.closest('[data-add-book-for-user]');
        if (addBookBtn) {
          const ownerId = addBookBtn.getAttribute('data-add-book-for-user');
          openAddBookModal(ownerId);
          return;
        }

        const deleteBookBtn = e.target.closest('[data-delete-book]');
        if (deleteBookBtn) {
          e.stopPropagation();
          const bookId = deleteBookBtn.getAttribute('data-delete-book');
          openDeleteBookModal(bookId);
          return;
        }

        const openBookBtn = e.target.closest('[data-open-book]');
        if (openBookBtn) {
          const bookId = openBookBtn.getAttribute('data-open-book');
          state.selectedBookId = bookId;
          state.currentTab = 'home';
          renderApp();
          return;
        }

        const editCoverBtn = e.target.closest('[data-edit-book-cover]');
        if (editCoverBtn) {
          const bookId = editCoverBtn.getAttribute('data-edit-book-cover');
          openEditBookCoverModal(bookId);
          return;
        }

        const newEntryBtn = e.target.closest('[data-open-new-entry]');
        if (newEntryBtn) {
          const bookId = newEntryBtn.getAttribute('data-open-new-entry');
          openEntryEditorModal(bookId, null);
          return;
        }

        const editEntryBtn = e.target.closest('[data-edit-entry]');
        if (editEntryBtn) {
          const entryId = editEntryBtn.getAttribute('data-edit-entry');
          const entry = state.entries.find((item) => item.id === entryId);
          if (entry) {
            openEntryEditorModal(entry.bookId, entry);
          }
          return;
        }

        const deleteEntryBtn = e.target.closest('[data-delete-entry]');
        if (deleteEntryBtn) {
          const entryId = deleteEntryBtn.getAttribute('data-delete-entry');
          openDeleteEntryModal(entryId);
          return;
        }
      });

      document.addEventListener('submit', async (e) => {
        const replyForm = e.target.closest('[data-reply-form]');
        if (!replyForm) return;
        e.preventDefault();

        const entryId = replyForm.getAttribute('data-reply-form');
        const input = replyForm.querySelector('input[name="replyText"]');
        const text = (input?.value || '').trim();
        if (!text) return;

        const entry = state.entries.find((item) => item.id === entryId);
        if (!entry) return;

        entry.replies.push({
          id: `reply-${Date.now()}`,
          authorId: state.activeUserId,
          text,
          date: getTodayDateStr(),
        });

        input.value = '';
        renderApp();
        await syncUpdateEntryReplies(entry.id, entry.replies);
        showToast('답글이 등록되었습니다.');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      bindGlobalEvents();
      renderApp();
      initRealtimeSync();
    });
  </script>
</body>
</html>
