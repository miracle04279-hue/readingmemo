<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>독서 구절 사진 기록장</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 귀여운 한글 폰트 및 Inter 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&family=Inter:wght@400;500;600;700&family=Jua&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Gamja Flower"', '"Gaegu"', 'Inter', 'sans-serif'],
            serif: ['"Jua"', '"Gaegu"', 'sans-serif'],
          },
          colors: {
            paper: '#FDF8F2',
            surface: '#FFFDF9',
            ink: '#241D18',
            muted: '#66594E',
            accent: '#C96A42',
            accentSoft: '#FCEEE6',
            shelfWood: '#F2E7D8',
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      background-color: #FDF8F2;
      color: #241D18;
      font-family: "Gamja Flower", "Gaegu", "Inter", sans-serif;
      font-size: 18px;
      line-height: 1.65;
      letter-spacing: 0.01em;
      word-break: keep-all;
      -webkit-tap-highlight-color: transparent;
    }
    .book-page-texture {
      background-color: #FFFDF9;
      background-image: radial-gradient(rgba(125, 111, 99, 0.06) 0.75px, transparent 0.75px);
      background-size: 14px 14px;
    }
    .book-spine-edge {
      box-shadow: inset 6px 0 10px -6px rgba(44, 36, 30, 0.28), 0 4px 10px rgba(44, 36, 30, 0.08);
    }
    .shelf-ledge {
      background: linear-gradient(to bottom, #EADBC7 0%, #D9C3A8 100%);
      height: 10px;
      border-radius: 9999px;
      box-shadow: 0 3px 6px rgba(44, 36, 30, 0.12);
    }
    .highlighter-canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased selection:bg-accentSoft selection:text-accent">
  <!-- 전체 앱 래퍼 -->
  <div id="app" class="mx-auto max-w-md min-h-screen flex flex-col book-page-texture shadow-md border-x border-amber-900/10 relative pb-24">

    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-20 bg-paper/95 backdrop-blur border-b-2 border-amber-900/15 px-4 py-3.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <button
            id="headerBackBtn"
            type="button"
            class="hidden items-center justify-center w-9 h-9 rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink font-bold text-sm shrink-0 transition"
            aria-label="뒤로 가기"
          >
            ←
          </button>
          <div class="min-w-0">
            <h1 id="headerTitle" class="font-serif text-lg font-bold text-ink truncate leading-tight">우리의 독서메모</h1>
            <p id="headerSubtitle" class="text-xs text-muted truncate"></p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <!-- 새소식 버튼 -->
          <button
            id="newsFeedBtn"
            type="button"
            class="h-9 flex items-center gap-1.5 bg-surface hover:bg-amber-100/70 active:scale-95 border border-amber-900/20 rounded-2xl px-2.5 text-xs font-bold text-ink shadow-2xs transition cursor-pointer shrink-0"
            aria-label="새소식 보기"
          >
            <span class="text-xs leading-none">🔔</span>
            <span class="leading-none">새소식</span>
            <span
              id="newsBadgeCount"
              class="min-w-[18px] h-[18px] px-1 rounded-full bg-accent text-white text-[11px] font-bold inline-flex items-center justify-center leading-none tabular-nums"
            >0</span>
          </button>

          <!-- 현재 기록하는 사용자 (기기별 고정 잠금 지원) -->
          <div class="relative shrink-0">
            <button
              id="activeUserBadgeBtn"
              type="button"
              class="h-9 flex items-center gap-1.5 bg-surface hover:bg-amber-100/70 active:scale-95 border border-amber-900/20 rounded-2xl px-2.5 text-xs font-bold text-ink shadow-2xs transition cursor-pointer shrink-0"
              aria-label="현재 기록 중인 사용자 고정 및 변경"
            >
              <span id="activeUserDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"></span>
              <span id="activeUserLabel" class="leading-none">뀨뀨</span>
              <span id="activeUserLockIcon" class="text-[11px] leading-none text-muted">🔒</span>
            </button>

            <!-- 사용자 선택/잠금 해제 팝오버 -->
            <div
              id="activeUserDropdown"
              class="hidden absolute right-0 top-full mt-1.5 w-48 rounded-2xl bg-surface border border-amber-900/20 shadow-lg py-1.5 z-40"
            ></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main id="mainContent" class="flex-1 px-4 pt-4 space-y-6"></main>

    <!-- 하단 네비게이션 바 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-surface/95 backdrop-blur border-t border-amber-900/10 px-3 py-2 z-30">
      <div class="grid grid-cols-2 gap-2">
        <button
          id="navHomeBtn"
          type="button"
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm"
        >
          <span>📚</span>
          <span>책장 홈</span>
        </button>
        <button
          id="navSettingsBtn"
          type="button"
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60"
        >
          <span>⚙️</span>
          <span>설정</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- 커스텀 모달 컨테이너 -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4 backdrop-blur-[1px]">
    <div id="modalCard" class="w-full max-w-md max-h-[90vh] overflow-y-auto rounded-3xl bg-surface p-5 shadow-xl border border-amber-900/10 space-y-4"></div>
  </div>

  <!-- 토스트 메시지 배너 -->
  <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden max-w-xs w-max rounded-full bg-ink text-white text-xs font-medium px-4 py-2.5 shadow-lg transition-all"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      getDocs,
      enableNetwork,
      collection,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const FALLBACK_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDYv4AIaGOSA1VRRGPICMMVLOMtJY-G9VA",
      authDomain: "readingmemo-a1306.firebaseapp.com",
      projectId: "readingmemo-a1306",
      storageBucket: "readingmemo-a1306.firebasestorage.app",
      messagingSenderId: "295077332637",
      appId: "1:295077332637:web:ae5f3fba2f01149592b674",
      measurementId: "G-Y5E7200DHH",
    };

    const appId = typeof __app_id !== "undefined" ? __app_id : "our-reading-memo";
    const firebaseConfig =
      typeof __firebase_config !== "undefined"
        ? JSON.parse(__firebase_config)
        : FALLBACK_FIREBASE_CONFIG;

    const isFirebaseConfigured =
      firebaseConfig &&
      firebaseConfig.apiKey &&
      !String(firebaseConfig.apiKey).startsWith("YOUR_");

    let db = null;
    let auth = null;
    let currentAuthUser = null;

    if (isFirebaseConfigured) {
      try {
        const fbApp = initializeApp(firebaseConfig);
        db = getFirestore(fbApp);
        auth = getAuth(fbApp);
      } catch (err) {
        console.error("Firebase 초기화 오류:", err);
      }
    }

    function getPublicCollection(collectionName) {
      return collection(db, "artifacts", appId, "public", "data", collectionName);
    }

    function getPublicDoc(collectionName, docId) {
      return doc(db, "artifacts", appId, "public", "data", collectionName, docId);
    }

    const AVATAR_PALETTE = [
      { bg: 'bg-amber-200', text: 'text-amber-950', dot: 'bg-amber-500', badge: 'bg-amber-100 text-amber-900 border-amber-300' },
      { bg: 'bg-emerald-200', text: 'text-emerald-950', dot: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
      { bg: 'bg-sky-200', text: 'text-sky-950', dot: 'bg-sky-500', badge: 'bg-sky-100 text-sky-900 border-sky-300' },
      { bg: 'bg-rose-200', text: 'text-rose-950', dot: 'bg-rose-500', badge: 'bg-rose-100 text-rose-900 border-rose-300' },
      { bg: 'bg-violet-200', text: 'text-violet-950', dot: 'bg-violet-500', badge: 'bg-violet-100 text-violet-900 border-violet-300' },
      { bg: 'bg-orange-200', text: 'text-orange-950', dot: 'bg-orange-500', badge: 'bg-orange-100 text-orange-900 border-orange-300' },
    ];

    const HIGHLIGHT_COLORS = [
      { name: '노랑', hex: '#FFF28A', swatch: '#FFE873' },
      { name: '연두', hex: '#B7F5BA', swatch: '#9BF2A2' },
      { name: '분홍', hex: '#FFB5CE', swatch: '#FFA6C1' },
      { name: '하늘', hex: '#B5DCFF', swatch: '#94CEFF' },
    ];

    const DEFAULT_USERS = [
      { id: 'user-kkyukkyu', name: '뀨뀨', paletteIndex: 0, createdAt: 1 },
      { id: 'user-kkyungi', name: '뀽이', paletteIndex: 1, createdAt: 2 },
      { id: 'user-ttungi', name: '뚱이', paletteIndex: 2, createdAt: 3 },
    ];

    function readCookieValue(name) {
      const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return match ? decodeURIComponent(match[1]) : '';
    }

    function writeCookieValue(name, value, days = 365) {
      try {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
      } catch (e) {}
    }

    const IDB_NAME = 'readingmemo_device_store';
    const IDB_STORE = 'prefs';

    function openPrefsDb() {
      return new Promise((resolve) => {
        if (!('indexedDB' in window)) {
          resolve(null);
          return;
        }
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const dbInstance = req.result;
            if (!dbInstance.objectStoreNames.contains(IDB_STORE)) {
              dbInstance.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    async function savePrefToIdb(key, value) {
      const dbInstance = await openPrefsDb();
      if (!dbInstance) return;
      try {
        const tx = dbInstance.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
      } catch (e) {}
    }

    async function loadPrefFromIdb(key) {
      const dbInstance = await openPrefsDb();
      if (!dbInstance) return null;
      return new Promise((resolve) => {
        try {
          const tx = dbInstance.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    function getPersistedUserConfig() {
      const params = new URLSearchParams(window.location.search);
      const urlUserId = params.get('user') || '';

      let hashUserId = '';
      try {
        const hashParams = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
        hashUserId = hashParams.get('user') || '';
      } catch (e) {}

      let winNameUserId = '';
      let winNameLocked = '';
      try {
        if (window.name && window.name.startsWith('READINGMEMO_USER:')) {
          const parsed = JSON.parse(window.name.slice('READINGMEMO_USER:'.length));
          winNameUserId = parsed.userId || '';
          winNameLocked = typeof parsed.isLocked === 'boolean' ? String(parsed.isLocked) : '';
        }
      } catch (e) {}

      let lsUserId = '';
      let lsLocked = '';
      try {
        lsUserId = localStorage.getItem('readingmemo_active_user_id') || '';
        lsLocked = localStorage.getItem('readingmemo_user_locked') || '';
      } catch (e) {}
      const cookieUserId = readCookieValue('readingmemo_active_user_id');
      const cookieLocked = readCookieValue('readingmemo_user_locked');

      const resolvedUserId =
        lsUserId || cookieUserId || winNameUserId || urlUserId || hashUserId || '';
      const resolvedLockedStr = lsLocked || cookieLocked || winNameLocked;
      return {
        userId: resolvedUserId,
        isLocked: resolvedUserId ? resolvedLockedStr !== 'false' : false,
      };
    }

    function getSavedLastSeenAt() {
      let lsVal = 0;
      let ckVal = 0;
      try {
        lsVal = Number(localStorage.getItem('readingmemo_last_seen_at') || '0');
      } catch (e) {}
      ckVal = Number(readCookieValue('readingmemo_last_seen_at') || '0');
      const resolved = Math.max(lsVal, ckVal);
      if (resolved > 0) return resolved;

      const initialNow = Date.now();
      try {
        localStorage.setItem('readingmemo_last_seen_at', String(initialNow));
      } catch (e) {}
      writeCookieValue('readingmemo_last_seen_at', String(initialNow), 365);
      return initialNow;
    }

    const persistedUser = getPersistedUserConfig();

    const state = {
      currentTab: 'home',
      selectedBookId: null,
      activeUserId: persistedUser.userId || 'user-kkyukkyu',
      isUserLocked: persistedUser.userId ? persistedUser.isLocked : true,
      soundAlertEnabled: localStorage.getItem('readingmemo_sound_alert') !== 'false',
      browserNotifyEnabled: localStorage.getItem('readingmemo_browser_notify') === 'true',
      lastSeenAt: getSavedLastSeenAt(),
      cloudConnected: false,
      users: [...DEFAULT_USERS],
      books: [],
      entries: [],
    };

    let initialBooksLoaded = false;
    let initialEntriesLoaded = false;
    let missedCatchupDone = false;
    let isRefreshingRemoteData = false;
    const knownBookIds = new Set();
    const knownEntryIds = new Set();
    const knownReplyIds = new Set();

    function markLastSeenNow() {
      const now = Date.now();
      state.lastSeenAt = now;
      try {
        localStorage.setItem('readingmemo_last_seen_at', String(now));
      } catch (e) {}
      writeCookieValue('readingmemo_last_seen_at', String(now), 365);
    }

    function setFixedActiveUser(userId, lock = true) {
      if (!userId) return;
      state.activeUserId = userId;
      state.isUserLocked = Boolean(lock);

      try {
        localStorage.setItem('readingmemo_active_user_id', userId);
        localStorage.setItem('readingmemo_user_locked', String(state.isUserLocked));
      } catch (e) {}

      writeCookieValue('readingmemo_active_user_id', userId, 365);
      writeCookieValue('readingmemo_user_locked', String(state.isUserLocked), 365);

      try {
        window.name = `READINGMEMO_USER:${JSON.stringify({
          userId,
          isLocked: state.isUserLocked,
        })}`;
      } catch (e) {}

      savePrefToIdb('readingmemo_active_user_id', userId);
      savePrefToIdb('readingmemo_user_locked', String(state.isUserLocked));

      try {
        const url = new URL(window.location.href);
        url.searchParams.set('user', userId);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
    }

    async function hydratePrefsFromIndexedDb() {
      try {
        const savedUserId = await loadPrefFromIdb('readingmemo_active_user_id');
        const savedLocked = await loadPrefFromIdb('readingmemo_user_locked');

        if (!state.activeUserId && savedUserId) {
          state.activeUserId = savedUserId;
        }
        if (savedLocked === 'true' || savedLocked === 'false') {
          state.isUserLocked = savedLocked === 'true';
        }
        if (state.activeUserId) {
          setFixedActiveUser(state.activeUserId, state.isUserLocked);
        }
      } catch (e) {
        console.error('IndexedDB 설정 복원 오류:', e);
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTodayDateStr() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getUserById(userId) {
      return (
        state.users.find((u) => u.id === userId) ||
        state.users[0] || { id: 'user-kkyukkyu', name: '뀨뀨', paletteIndex: 0 }
      );
    }

    function getPaletteForUser(user) {
      const idx = Number(user?.paletteIndex ?? 0);
      return AVATAR_PALETTE[((idx % AVATAR_PALETTE.length) + AVATAR_PALETTE.length) % AVATAR_PALETTE.length];
    }

    function canManageBook(book) {
      return Boolean(book && book.ownerId === state.activeUserId);
    }

    function canManageEntry(entry, book = null) {
      if (!entry) return false;
      const targetBook = book || state.books.find((b) => b.id === entry.bookId);
      const ownsBook = targetBook ? targetBook.ownerId === state.activeUserId : false;
      return entry.authorId === state.activeUserId && ownsBook;
    }

    let toastTimer = null;
    function showToast(message) {
      const banner = document.getElementById('toastBanner');
      if (!banner) return;
      banner.textContent = message;
      banner.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 3000);
    }

    function openModal(html) {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      if (!backdrop || !card) return;
      card.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      if (!backdrop || !card) return;
      card.innerHTML = '';
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function playNotificationChime() {
      if (!state.soundAlertEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const notes = [659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);
          gain.gain.setValueAtTime(0.001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.14 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.36);
        });
      } catch (err) {}
    }

    function triggerIncomingActivityAlert(actorId, message) {
      if (!actorId || actorId === state.activeUserId) return;
      playNotificationChime();
      showToast(`🔔 ${message}`);
      updateNewsBadgeUI();
      if (
        state.browserNotifyEnabled &&
        'Notification' in window &&
        Notification.permission === 'granted'
      ) {
        try {
          new Notification('우리의 독서메모', { body: message });
        } catch (err) {}
      }
    }

    function collectMissedActivityMessages(sinceTs) {
      const messages = [];
      for (const book of state.books) {
        if (book.ownerId !== state.activeUserId && Number(book.createdAt || 0) > sinceTs) {
          const owner = getUserById(book.ownerId);
          messages.push(`${owner.name}님이 새 책 "${book.title}"을(를) 올렸어요.`);
        }
      }
      for (const entry of state.entries) {
        const book = state.books.find((b) => b.id === entry.bookId);
        const bookTitle = book ? book.title : '책장';
        if (entry.authorId !== state.activeUserId && Number(entry.createdAt || 0) > sinceTs) {
          const author = getUserById(entry.authorId);
          messages.push(`${author.name}님이 "${bookTitle}"에 새 구절을 올렸어요.`);
        }
        const replies = Array.isArray(entry.replies) ? entry.replies : [];
        for (const rep of replies) {
          if (rep.authorId !== state.activeUserId && Number(rep.createdAt || 0) > sinceTs) {
            const repAuthor = getUserById(rep.authorId);
            messages.push(`${repAuthor.name}님이 "${bookTitle}" 구절에 답글을 남겼어요.`);
          }
        }
      }
      return messages;
    }

    function notifyMissedActivity(messages) {
      if (!Array.isArray(messages) || messages.length === 0) return;
      playNotificationChime();
      const summary =
        messages.length === 1
          ? messages[0]
          : `앱이 꺼진 동안 새 소식 ${messages.length}건이 도착했어요! (${messages[0]})`;
      showToast(`🔔 ${summary}`);
      updateNewsBadgeUI();
      if (
        state.browserNotifyEnabled &&
        'Notification' in window &&
        Notification.permission === 'granted'
      ) {
        try {
          new Notification('우리의 독서메모', { body: summary });
        } catch (err) {}
      }
    }

    window.__collectMissedActivityMessages = collectMissedActivityMessages;
    window.__notifyMissedActivity = notifyMissedActivity;

    function compressImageDataUrl(rawDataUrl, maxDimension = 1440, quality = 0.86) {
      return new Promise((resolve) => {
        if (!rawDataUrl || !rawDataUrl.startsWith('data:image/')) {
          resolve(rawDataUrl);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || 1000;
          const h = img.naturalHeight || 750;
          const scale = Math.max(w, h) > maxDimension ? maxDimension / Math.max(w, h) : 1;
          const targetW = Math.max(1, Math.round(w * scale));
          const targetH = Math.max(1, Math.round(h * scale));
          const c = document.createElement('canvas');
          c.width = targetW;
          c.height = targetH;
          const cctx = c.getContext('2d');
          cctx.drawImage(img, 0, 0, targetW, targetH);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(rawDataUrl);
        img.src = rawDataUrl;
      });
    }

    function attachNativeCameraAndFileInputs(containerEl, onImageReady, maxDimension = 1440) {
      const inputs = containerEl.querySelectorAll(
        '[data-native-camera-input], [data-file-input]'
      );
      inputs.forEach((input) => {
        input.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            const rawUrl = String(reader.result || '');
            const compressed = await compressImageDataUrl(rawUrl, maxDimension, 0.86);
            onImageReady(compressed);
          };
          reader.readAsDataURL(file);
          input.value = '';
        });
      });
      return { stopStream: () => {} };
    }

    function maybeNotifyMissedCatchup() {
      if (!initialBooksLoaded || !initialEntriesLoaded || missedCatchupDone) return;
      missedCatchupDone = true;
      const prevSeen = state.lastSeenAt || 0;
      const missed = collectMissedActivityMessages(prevSeen);
      if (missed.length > 0) {
        notifyMissedActivity(missed);
      }

    function applyBooksSnapshotDocs(docsList) {
      const loadedBooks = docsList.map((item) => ({ ...item }));
      loadedBooks.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      state.books = loadedBooks;

      if (!initialBooksLoaded) {
        initialBooksLoaded = true;
        loadedBooks.forEach((b) => knownBookIds.add(b.id));
        maybeNotifyMissedCatchup();
      } else {
        for (const b of loadedBooks) {
          if (!knownBookIds.has(b.id)) {
            knownBookIds.add(b.id);
            if (b.ownerId && b.ownerId !== state.activeUserId) {
              const owner = getUserById(b.ownerId);
              triggerIncomingActivityAlert(
                b.ownerId,
                `${owner.name}님이 새 책 "${b.title}"을(를) 추가했어요.`
              );
            }
          }
        }
      }
    }

    function applyEntriesSnapshotDocs(docsList) {
      const loadedEntries = docsList.map((item) => ({
        ...item,
        replies: Array.isArray(item.replies) ? item.replies.map((r) => ({ ...r })) : [],
      }));
      loadedEntries.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      state.entries = loadedEntries;

      if (!initialEntriesLoaded) {
        initialEntriesLoaded = true;
        loadedEntries.forEach((e) => {
          knownEntryIds.add(e.id);
          const replies = Array.isArray(e.replies) ? e.replies : [];
          replies.forEach((rep) => {
            if (rep && rep.id) knownReplyIds.add(rep.id);
          });
        });
        maybeNotifyMissedCatchup();
      } else {
        for (const entry of loadedEntries) {
          const book = state.books.find((b) => b.id === entry.bookId);
          const bookTitle = book ? book.title : '책장';

          if (!knownEntryIds.has(entry.id)) {
            knownEntryIds.add(entry.id);
            if (entry.authorId && entry.authorId !== state.activeUserId) {
              const author = getUserById(entry.authorId);
              triggerIncomingActivityAlert(
                entry.authorId,
                `${author.name}님이 "${bookTitle}"에 새 구절을 올렸어요.`
              );
            }
          }

          const replies = Array.isArray(entry.replies) ? entry.replies : [];
          for (const rep of replies) {
            if (rep && rep.id && !knownReplyIds.has(rep.id)) {
              knownReplyIds.add(rep.id);
              if (rep.authorId && rep.authorId !== state.activeUserId) {
                const repAuthor = getUserById(rep.authorId);
                triggerIncomingActivityAlert(
                  rep.authorId,
                  `${repAuthor.name}님이 "${bookTitle}" 구절에 답글을 남겼어요.`
                );
              }
            }
          }
        }
      }
    }

    async function forceSyncLatestRemoteData() {
      if (!db || !currentAuthUser || isRefreshingRemoteData) return;
      isRefreshingRemoteData = true;
      try {
        try {
          await enableNetwork(db);
        } catch (netErr) {}

        const [booksSnap, entriesSnap] = await Promise.all([
          getDocs(getPublicCollection('books')),
          getDocs(getPublicCollection('entries')),
        ]);

        const freshBooks = [];
        booksSnap.forEach((docSnap) => {
          freshBooks.push({ id: docSnap.id, ...docSnap.data() });
        });

        const freshEntries = [];
        entriesSnap.forEach((docSnap) => {
          freshEntries.push({ id: docSnap.id, ...docSnap.data() });
        });

        applyBooksSnapshotDocs(freshBooks);
        applyEntriesSnapshotDocs(freshEntries);

        const prevSeen = state.lastSeenAt || 0;
        const missedMessages = collectMissedActivityMessages(prevSeen);
        markLastSeenNow();
        if (missedMessages.length > 0 && initialBooksLoaded && initialEntriesLoaded) {
          notifyMissedActivity(missedMessages);
        }
        updateNewsBadgeUI();
        renderApp();
      } catch (err) {
        console.error('복귀 시 최신 데이터 동기화 오류:', err);
      } finally {
        isRefreshingRemoteData = false;
      }
    }

    async function initRealtimeSync() {
      if (!db || !auth) return;
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentAuthUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentAuthUser = cred.user;
        }
      } catch (err) {
        console.error('Firebase 인증 오류:', err);
        showToast('실시간 연동 인증에 실패했습니다.');
        return;
      }

      if (!currentAuthUser) return;
      state.cloudConnected = true;

      // 1) 사용자 목록 실시간 구독
      onSnapshot(
        getPublicCollection('users'),
        async (snapshot) => {
          if (snapshot.empty) {
            for (const defaultUser of DEFAULT_USERS) {
              await syncSaveUser(defaultUser);
            }
            return;
          }
          const loadedUsers = [];
          snapshot.forEach((docSnap) => {
            loadedUsers.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedUsers.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          state.users = loadedUsers;

          const latestPersisted = getPersistedUserConfig();
          const candidateId = latestPersisted.userId || state.activeUserId;
          if (state.users.some((u) => u.id === candidateId)) {
            setFixedActiveUser(candidateId, latestPersisted.isLocked);
          } else if (state.users[0]) {
            setFixedActiveUser(state.users[0].id, true);
          }
          renderApp();
        },
        (error) => {
          console.error('users 구독 오류:', error);
        }
      );

      // 2) 책장 목록 실시간 구독
      onSnapshot(
        getPublicCollection('books'),
        (snapshot) => {
          const loadedBooks = [];
          snapshot.forEach((docSnap) => {
            loadedBooks.push({ id: docSnap.id, ...docSnap.data() });
          });
          applyBooksSnapshotDocs(loadedBooks);
          updateNewsBadgeUI();
          renderApp();
        },
        (error) => {
          console.error('books 구독 오류:', error);
        }
      );

      // 3) 구절 기록 및 답글 실시간 구독
      onSnapshot(
        getPublicCollection('entries'),
        (snapshot) => {
          const loadedEntries = [];
          snapshot.forEach((docSnap) => {
            loadedEntries.push({ id: docSnap.id, ...docSnap.data() });
          });
          applyEntriesSnapshotDocs(loadedEntries);
          updateNewsBadgeUI();
          renderApp();
        },
        (error) => {
          console.error('entries 구독 오류:', error);
        }
      );
    }

    function getRecentActivityItems() {
      const items = [];

      for (const book of state.books) {
        if (book.ownerId === state.activeUserId) continue;
        const owner = getUserById(book.ownerId);
        const ts = Number(book.createdAt || 0);
        items.push({
          id: `news-book-${book.id}`,
          type: 'book',
          bookId: book.id,
          timestamp: ts,
          actorName: owner.name,
          summary: `${owner.name}님이 새 책 "${book.title}"을(를) 책장에 꽂았어요`,
          dateLabel: ts ? new Date(ts).toLocaleDateString('ko-KR') : '',
        });
      }

      for (const entry of state.entries) {
        const book = state.books.find((b) => b.id === entry.bookId);
        const bookTitle = book ? book.title : '책장';
        const entryTs = Number(entry.createdAt || 0);

        if (entry.authorId !== state.activeUserId) {
          const author = getUserById(entry.authorId);
          items.push({
            id: `news-entry-${entry.id}`,
            type: 'entry',
            bookId: entry.bookId,
            timestamp: entryTs,
            actorName: author.name,
            summary: `${author.name}님이 "${bookTitle}"에 새 구절을 올렸어요`,
            dateLabel: entry.photoDate || (entryTs ? new Date(entryTs).toLocaleDateString('ko-KR') : ''),
          });
        }

        const replies = Array.isArray(entry.replies) ? entry.replies : [];
        for (const rep of replies) {
          const repTs = Number(rep.createdAt || 0);
          if (rep.authorId !== state.activeUserId) {
            const repAuthor = getUserById(rep.authorId);
            items.push({
              id: `news-reply-${rep.id}`,
              type: 'reply',
              bookId: entry.bookId,
              timestamp: repTs,
              actorName: repAuthor.name,
              summary: `${repAuthor.name}님이 "${bookTitle}" 구절에 답글: "${rep.text}"`,
              dateLabel: rep.date || (repTs ? new Date(repTs).toLocaleDateString('ko-KR') : ''),
            });
          }
        }
      }

      items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      return items;
    }

      function getEntrySortTimestamp(entry) {
        if (!entry) return 0;
        const created = Number(entry.createdAt);
        if (Number.isFinite(created) && created > 0) return created;

        const idMatch = String(entry.id || '').match(/(\d{10,})/);
        if (idMatch) {
          const parsedIdTs = Number(idMatch[1]);
          if (Number.isFinite(parsedIdTs) && parsedIdTs > 0) return parsedIdTs;
        }

        if (entry.photoDate) {
          const parsedDate = Date.parse(`${entry.photoDate}T00:00:00`);
          if (!Number.isNaN(parsedDate)) return parsedDate;
        }
        return 0;
      }

      const bookEntries = state.entries
        .filter((e) => e.bookId === book.id)
        .sort((a, b) => getEntrySortTimestamp(a) - getEntrySortTimestamp(b));

      const entriesHtml =
        bookEntries.length === 0
          ? `
            <div class="rounded-3xl bg-surface border border-dashed border-amber-900/15 p-8 text-center space-y-2">

                  isMyBook
                    ? '위의 "구절 사진 찍기" 버튼을 눌러 인상 깊은 문장을 남겨보세요.'
                    : `${escapeHtml(owner.name)}님이 아직 구절 사진을 올리지 않았어요.`
                }
              </p>
            </div>

          : bookEntries
              .map((entry) => {

                const canEditOrDelete = canManageEntry(entry, book);
                const replies = Array.isArray(entry.replies) ? entry.replies : [];

                      </div>
                    `;
                  })
                  .join('');

                return `
                  <article class="rounded-3xl bg-surface border border-amber-900/10 p-4 shadow-2xs space-y-3">
                    <div class="flex items-center justify-between gap-2">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${palette.badge}">
                          ${escapeHtml(author.name)}
                        </span>
                        <span class="text-xs text-muted">${escapeHtml(entry.photoDate || '')}</span>
                      </div>
                      ${
                        canEditOrDelete
                          ? `
                        <div class="flex items-center gap-1.5 shrink-0">
                          <button
                            type="button"
                            data-edit-entry="${escapeHtml(entry.id)}"
                            class="rounded-xl bg-amber-100/80 hover:bg-amber-200/80 text-ink text-[11px] font-bold px-2.5 py-1 transition cursor-pointer"
                          >
                            수정
                          </button>
                          <button
                            type="button"
                            data-delete-entry="${escapeHtml(entry.id)}"
                            class="rounded-xl bg-red-50 hover:bg-red-100 text-red-600 text-[11px] font-bold px-2.5 py-1 transition cursor-pointer"
                          >
                            삭제
                          </button>
                        </div>
                      `
                          : ''
                      }
                    </div>

                    <div class="rounded-2xl overflow-hidden border border-amber-900/15 bg-paper">
                      <img
                        src="${escapeHtml(entry.photoUrl)}"
                        alt="${escapeHtml(book.title)} 구절 사진"
                        class="w-full h-auto block"
                      />
                    </div>

                    <div class="space-y-2 pt-1">
                      <div class="space-y-1.5">${repliesHtml}</div>
                      <form data-reply-form="${escapeHtml(entry.id)}" class="flex items-center gap-2 pt-1">
                        <input
                          type="text"
                          name="replyText"
                          placeholder="이 구절에 답글 남기기..."
                          class="flex-1 min-w-0 rounded-2xl bg-paper border border-amber-900/15 px-3 py-2 text-xs text-ink placeholder:text-muted/60 focus:outline-none focus:border-accent"
                        />
                        <button
                          type="submit"
                          class="shrink-0 rounded-2xl bg-accent hover:bg-accent/90 text-white text-xs font-bold px-3.5 py-2 transition cursor-pointer"
                        >
                          등록
                        </button>
                      </form>
                    </div>
                  </article>
                `;
              })
              .join('');

      container.innerHTML = `
        <section class="rounded-3xl bg-surface border border-amber-900/10 p-4 shadow-2xs flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-12 h-16 rounded-lg overflow-hidden border border-amber-900/15 shrink-0 bg-amber-100/60 flex items-center justify-center">
              ${
                book.coverImage
                  ? `<img src="${escapeHtml(book.coverImage)}" alt="${escapeHtml(
                      book.title
                    )}" class="w-full h-full object-cover" />`
                  : `<span class="text-xl">📘</span>`
              }
            </div>
            <div class="min-w-0">
              <p class="text-[11px] font-bold text-accent">${escapeHtml(owner.name)}의 책장</p>
              <h2 class="font-serif text-base font-bold text-ink truncate">${escapeHtml(book.title)}</h2>
              <p class="text-xs text-muted truncate">${escapeHtml(
                book.author || '지은이 미상'
              )} · 구절 ${bookEntries.length}개</p>
            </div>
          </div>

          ${
            isMyBook
              ? `
            <div class="flex flex-col gap-1.5 shrink-0">
              <button
                type="button"
                data-open-new-entry="${escapeHtml(book.id)}"
                class="rounded-2xl bg-accent hover:bg-accent/90 text-white text-xs font-bold px-3 py-2 shadow-2xs transition cursor-pointer"
              >
                📷 구절 사진 찍기
              </button>
              <button
                type="button"
                data-edit-book-cover="${escapeHtml(book.id)}"
                class="rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink text-[11px] font-bold px-3 py-1.5 transition cursor-pointer"
              >
                표지 수정
              </button>
            </div>
          `
              : `<span class="text-[11px] text-muted shrink-0">내 책장만 기록 가능</span>`
          }
        </section>

        <section class="space-y-4">
          ${entriesHtml}
        </section>
      `;
    }

    function renderApp() {
      const mainContent = document.getElementById('mainContent');
      const navHomeBtn = document.getElementById('navHomeBtn');
      const navSettingsBtn = document.getElementById('navSettingsBtn');
      const backBtn = document.getElementById('headerBackBtn');
      const headerTitle = document.getElementById('headerTitle');
      const headerSubtitle = document.getElementById('headerSubtitle');

      if (!mainContent) return;

      renderActiveUserBadge();
      updateNewsBadgeUI();

      if (state.currentTab === 'settings') {
        navSettingsBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
        navHomeBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
        headerTitle.textContent = '설정';
        headerSubtitle.textContent = '알림 · 공유 · 기기 사용자 고정';
        renderSettingsView(mainContent);
        return;
      }

      navHomeBtn.className =
        'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
      navSettingsBtn.className =
        'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';

      const selectedBook = state.selectedBookId
        ? state.books.find((b) => b.id === state.selectedBookId)
        : null;

      if (selectedBook) {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
        headerTitle.textContent = selectedBook.title;
        const owner = getUserById(selectedBook.ownerId);
        headerSubtitle.textContent = `${owner.name}의 책장 · 구절 기록`;
        renderBookFeedView(mainContent, selectedBook);
        return;
      }

      backBtn.classList.add('hidden');
      backBtn.classList.remove('flex');
      headerTitle.textContent = '우리의 독서메모';
      headerSubtitle.textContent = state.cloudConnected
        ? '실시간 동기화 중 · 함께 남기는 책장'
        : '소중한 문장과 사진을 함께 남기는 책장';
      renderHomeView(mainContent);
    }

                }
              </div>
              <button

              <p class="text-xs text-muted mt-0.5">다른 사용자가 책·구절·답글을 올릴 때 소리와 알림을 받습니다.</p>
            </div>

            <div class="flex items-center justify-between gap-2 rounded-2xl bg-paper px-3.5 py-2.5 border border-amber-900/10">
              <div>
                <p class="text-xs font-bold text-ink">딩동 알림음</p>
                <p class="text-[11px] text-muted">새 활동이 들어오면 알림음을 재생합니다.</p>
              </div>
              <button
                type="button"
                id="toggleSoundAlertBtn"
                class="shrink-0 rounded-xl px-3 py-1.5 text-xs font-bold transition cursor-pointer ${
                  state.soundAlertEnabled
                    ? 'bg-accent text-white'
                    : 'bg-amber-100 text-muted'
                }"
              >
                ${state.soundAlertEnabled ? '켜짐' : '꺼짐'}
              </button>
            </div>

            <div class="flex items-center justify-between gap-2 rounded-2xl bg-paper px-3.5 py-2.5 border border-amber-900/10">
              <div>
                <p class="text-xs font-bold text-ink">기기 상단 알림</p>
                <p class="text-[11px] text-muted">브라우저 알림 권한이 허용된 경우 배너로 알립니다.</p>
              </div>
              <button
                type="button"
                id="toggleBrowserNotifyBtn"
                class="shrink-0 rounded-xl px-3 py-1.5 text-xs font-bold transition cursor-pointer ${
                  state.browserNotifyEnabled
                    ? 'bg-accent text-white'
                    : 'bg-amber-100 text-muted'
                }"
              >
                ${state.browserNotifyEnabled ? '허용됨' : '설정하기'}
              </button>
            </div>

            <button
              type="button"
              id="testNotificationSoundBtn"
              class="w-full rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink text-xs font-bold py-2.5 px-3 transition cursor-pointer"
            >
              🔔 알림음 테스트
            </button>
          </section>

          <section class="rounded-3xl bg-surface p-4 shadow-xs border border-amber-900/10 space-y-3">
            <div>
              <h2 class="font-serif text-base font-bold text-ink">🔗 책장 공유하기</h2>
              <p class="text-xs text-muted mt-0.5">함께 기록할 분들에게 공용 책장 링크를 복사해 보내세요.</p>
            </div>
            <button
              type="button"
              id="copyShareLinkBtn"
              class="w-full rounded-2xl bg-accentSoft hover:bg-accent/20 text-accent text-xs font-bold py-2.5 px-3 transition cursor-pointer"

              📋 공유 링크 복사하기
            </button>
          </section>

          <section class="rounded-3xl bg-surface p-4 shadow-xs border border-amber-900/10 space-y-3">
            <div>
              <h2 class="font-serif text-base font-bold text-ink">👥 함께 쓰는 사람들</h2>
              <p class="text-xs text-muted mt-0.5">내 기기 사용자를 고정하면 앱을 다시 열어도 계속 유지됩니다.</p>
            </div>

            <div class="space-y-2.5">
              ${usersListHtml}
            </div>

            <form id="addUserForm" class="pt-2 border-t border-amber-900/10 flex items-center gap-2">
              <input
                type="text"
                name="newUserName"
                maxlength="12"
                placeholder="새 사용자 이름 (예: 민지)"
                class="flex-1 min-w-0 rounded-2xl bg-paper border border-amber-900/15 px-3.5 py-2.5 text-sm text-ink placeholder:text-muted/60 focus:outline-none focus:border-accent"
                required
              />
              <button
                type="submit"
                class="shrink-0 rounded-2xl bg-accent hover:bg-accent/90 active:scale-95 text-white text-xs font-semibold px-4 py-2.5 shadow-xs transition"
              >
                + 추가
              </button>
            </form>
          </section>
        </div>
      `;

      document.getElementById('toggleSoundAlertBtn')?.addEventListener('click', () => {
        state.soundAlertEnabled = !state.soundAlertEnabled;
        localStorage.setItem('readingmemo_sound_alert', String(state.soundAlertEnabled));
        renderApp();
        if (state.soundAlertEnabled) {
          playNotificationChime();
          showToast('딩동 알림음이 켜졌습니다.');
        } else {
          showToast('알림음이 꺼졌습니다.');
        }
      });

      document.getElementById('toggleBrowserNotifyBtn')?.addEventListener('click', async () => {
        if (!('Notification' in window)) {
          showToast('이 브라우저에서는 시스템 알림을 지원하지 않습니다.');
          return;
        }
        if (state.browserNotifyEnabled) {
          state.browserNotifyEnabled = false;
          localStorage.setItem('readingmemo_browser_notify', 'false');
          renderApp();
          showToast('기기 상단 알림이 꺼졌습니다.');
          return;
        }
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          state.browserNotifyEnabled = true;
          localStorage.setItem('readingmemo_browser_notify', 'true');
          renderApp();
          showToast('기기 상단 알림이 허용되었습니다.');
        } else {
          showToast('브라우저 설정에서 알림 권한을 허용해주세요.');
        }
      });

      document.getElementById('testNotificationSoundBtn')?.addEventListener('click', () => {
        const prev = state.soundAlertEnabled;
        state.soundAlertEnabled = true;
        playNotificationChime();
        state.soundAlertEnabled = prev;
        showToast('🔔 딩동! 새 구절이나 답글이 오면 이 소리가 울려요.');
      });

      document.getElementById('copyShareLinkBtn')?.addEventListener('click', () => {
        const shareUrlObj = new URL(window.location.href);
        shareUrlObj.searchParams.delete('user');
        const cleanShareUrl = shareUrlObj.toString();

        let copied = false;
        try {
          const tempInput = document.createElement('input');
          tempInput.value = cleanShareUrl;
          document.body.appendChild(tempInput);
          tempInput.select();
          tempInput.setSelectionRange(0, tempInput.value.length);
          copied = document.execCommand('copy');
          document.body.removeChild(tempInput);
        } catch (err) {
          copied = false;
        }

        if (copied) {
          showToast('공유 링크가 복사되었습니다.');
        } else {
          showToast(`복사할 주소: ${cleanShareUrl}`);
        }
      });

      const addUserForm = document.getElementById('addUserForm');

          e.preventDefault();
          const formData = new FormData(e.target);
          const name = String(formData.get('newUserName') || '').trim();
          if (!name) {
            showToast('사용자 이름을 입력해주세요.');
            return;

          const newUser = {
            id: `user-${Date.now()}`,
            name,
            paletteIndex: state.users.length % AVATAR_PALETTE.length,
            createdAt: Date.now(),
          };
          state.users.push(newUser);
          setFixedActiveUser(newUser.id, true);
          renderApp();
          await syncSaveUser(newUser);
          showToast(`"${name}" 사용자가 추가되고 이 기기에 고정되었습니다.`);
        });
      }
    }

    function openAddBookModal(ownerId) {
      if (ownerId !== state.activeUserId) {
        showToast('본인의 책장에만 책을 추가할 수 있어요.');
        return;
      }
      const owner = getUserById(ownerId);
      let tempCoverUrl = '';

      openModal(`
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs font-semibold text-accent">${escapeHtml(owner.name)}의 책장</span>
            <h3 class="font-serif text-lg font-bold text-ink">새 책 꽂기</h3>

          <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-amber-100/80 text-muted hover:text-ink flex items-center justify-center">×</button>
        </div>

            <label class="block text-xs font-bold text-ink mb-1">책 제목 <span class="text-accent">*</span></label>

              name="title"
              placeholder="예: 어린 왕자"
              class="w-full rounded-2xl bg-paper border border-amber-900/15 px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-accent"

          <div>
            <label class="block text-xs font-bold text-ink mb-1">지은이 <span class="text-muted font-normal">(선택)</span></label>
            <input
              type="text"
              name="author"
              placeholder="예: 앙투안 드 생텍쥐페리"
              class="w-full rounded-2xl bg-paper border border-amber-900/15 px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-accent"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-ink mb-1.5">책 표지 사진 <span class="text-muted font-normal">(선택)</span></label>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink text-xs font-semibold py-2.5 px-3 text-center transition">
                📷 카메라로 찍기
                <input type="file" accept="image/*" capture="environment" data-native-camera-input class="hidden" />
              </label>
              <label class="cursor-pointer rounded-2xl bg-amber-100/80 hover:bg-amber-200/80 text-ink text-xs font-semibold py-2.5 px-3 text-center transition">
                🖼️ 사진 선택
                <input type="file" accept="image/*" data-file-input class="hidden" />
              </label>
            </div>

            <div id="coverPreviewBox" class="hidden mt-3 flex items-center gap-3 rounded-2xl bg-paper p-2.5 border border-amber-900/10">

              <div class="flex-1 min-w-0">
                <p class="text-xs font-semibold text-ink">표지 이미지 준비됨</p>
                <button type="button" id="clearCoverBtn" class="text-[11px] text-red-600 font-semibold mt-0.5">표지 지우기</button>

          </div>

            <button type="button" data-close-modal class="flex-1 rounded-2xl bg-amber-100/70 text-muted text-sm font-semibold py-2.5">취소</button>
            <button type="submit" class="flex-1 rounded-2xl bg-accent text-white text-sm font-bold py-2.5 shadow-sm">책장에 넣기</button>
          </div>
        </form>
      `);

      const modalCard = document.getElementById('modalCard');
      const previewBox = document.getElementById('coverPreviewBox');
      const previewImg = document.getElementById('coverPreviewImg');

      const camHelper = attachNativeCameraAndFileInputs(
        modalCard,
        (dataUrl) => {
          tempCoverUrl = dataUrl;
          previewImg.src = dataUrl;
          previewBox.classList.remove('hidden');
        },
        900
      );

      document.getElementById('clearCoverBtn').addEventListener('click', () => {
        tempCoverUrl = '';
        previewImg.src = '';
        previewBox.classList.add('hidden');
      });

      modalCard.querySelectorAll('[data-close-modal]').forEach((btn) => {
        btn.addEventListener('click', () => {
          camHelper.stopStream();
          closeModal();
        });
      });

      document.getElementById('addBookForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        camHelper.stopStream();
        const formData = new FormData(e.target);
        const title = String(formData.get('title') || '').trim();
        const author = String(formData.get('author') || '').trim();
        if (!title) {
          showToast('책 제목을 입력해주세요.');
          return;
        }
        const compressedCover = tempCoverUrl
          ? await compressImageDataUrl(tempCoverUrl, 800, 0.82)
          : '';
        const newBook = {
          id: `book-${Date.now()}`,
          ownerId,
          title,
          author,
          coverImage: compressedCover,
          createdAt: Date.now(),
        };
        knownBookIds.add(newBook.id);

      const modalCard = document.getElementById('modalCard');
      const canvasSection = document.getElementById('canvasEditorSection');
      const canvas = document.getElementById('highlightCanvas');
      const ctx = canvas.getContext('2d');

      function loadImageOntoCanvas(dataUrl) {
        if (!dataUrl) return;
        const img = new Image();
        img.onload = () => {
          const maxWidth = 1440;
          const naturalW = img.naturalWidth || 1000;
          const naturalH = img.naturalHeight || 750;
          const scale = naturalW > maxWidth ? maxWidth / naturalW : 1;
          canvas.width = Math.round(naturalW * scale);
          canvas.height = Math.round(naturalH * scale);

          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          hasBaseImageLoaded = true;
          canvasSection.classList.remove('hidden');
        };
        img.onerror = () => {

        },
        1440
      );

      modalCard.querySelectorAll('[data-hl-color]').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedColor = btn.getAttribute('data-hl-color');

          });
          btn.classList.remove('border-amber-900/15', 'bg-surface');
          btn.classList.add('border-ink', 'bg-paper', 'shadow-2xs');
        });
      });

      modalCard.querySelectorAll('[data-brush-size]').forEach((btn) => {
        btn.addEventListener('click', () => {
          brushSize = Number(btn.getAttribute('data-brush-size')) || 24;
          modalCard.querySelectorAll('[data-brush-size]').forEach((b) => {

      });

      document.getElementById('resetHighlightBtn').addEventListener('click', () => {
        if (photoDataUrl) {
          loadImageOntoCanvas(photoDataUrl);
          showToast('형광펜 밑줄이 초기화되었습니다.');
        }
      });

      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function drawHighlighterStroke(from, to) {
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = selectedColor;
        ctx.lineWidth = brushSize * (canvas.width / 360);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
        ctx.restore();
      }

      canvas.addEventListener('mousedown', (e) => {
        if (!hasBaseImageLoaded) return;
        isDrawing = true;
        lastPoint = getCanvasCoords(e.clientX, e.clientY);
        drawHighlighterStroke(lastPoint, lastPoint);
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing || !lastPoint) return;
        const current = getCanvasCoords(e.clientX, e.clientY);
        drawHighlighterStroke(lastPoint, current);
        lastPoint = current;
      });

      const endStroke = () => {
        isDrawing = false;
        lastPoint = null;
      };
      window.addEventListener('mouseup', endStroke);

      canvas.addEventListener(
        'touchstart',
        (e) => {
          if (!hasBaseImageLoaded || e.touches.length === 0) return;
          e.preventDefault();
          isDrawing = true;
          const touch = e.touches[0];
          lastPoint = getCanvasCoords(touch.clientX, touch.clientY);
          drawHighlighterStroke(lastPoint, lastPoint);
        },
        { passive: false }
      );

      canvas.addEventListener(
        'touchmove',
        (e) => {
          if (!isDrawing || !lastPoint || e.touches.length === 0) return;
          e.preventDefault();
          const touch = e.touches[0];
          const current = getCanvasCoords(touch.clientX, touch.clientY);
          drawHighlighterStroke(lastPoint, current);
          lastPoint = current;
        },
        { passive: false }
      );

      canvas.addEventListener('touchend', endStroke);

      const cleanupObserver = new MutationObserver(() => {
        if (!document.body.contains(canvas)) {
          window.removeEventListener('mouseup', endStroke);
          cleanupObserver.disconnect();
        }
      });
      cleanupObserver.observe(document.getElementById('modalCard'), { childList: true });

      modalCard.querySelectorAll('[data-close-modal]').forEach((btn) => {
        btn.addEventListener('click', () => {
          camHelper.stopStream();
          window.removeEventListener('mouseup', endStroke);
          cleanupObserver.disconnect();
          closeModal();
        });
      });

      document.getElementById('entryEditorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        camHelper.stopStream();
        window.removeEventListener('mouseup', endStroke);

        const formData = new FormData(e.target);

          closeModal();

          showToast('구절 사진이 저장되었습니다.');
        }
      });
    }

    function bindGlobalEvents() {
      let longPressTimer = null;
      let longPressTriggered = false;
      let pressStartX = 0;
      let pressStartY = 0;

      function clearBookLongPress() {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }

      document.addEventListener('pointerdown', (e) => {
        const bookBtn = e.target.closest('[data-longpress-book-id]');
        clearBookLongPress();
        longPressTriggered = false;

        if (!bookBtn) return;
        const canDelete = bookBtn.getAttribute('data-longpress-can-delete') === '1';
        const bookId = bookBtn.getAttribute('data-longpress-book-id');
        if (!canDelete || !bookId) return;

        pressStartX = e.clientX;
        pressStartY = e.clientY;

        longPressTimer = setTimeout(() => {
          longPressTriggered = true;
          longPressTimer = null;
          openDeleteBookModal(bookId);
        }, 550);
      });

      document.addEventListener('pointermove', (e) => {
        if (!longPressTimer) return;
        const dx = Math.abs(e.clientX - pressStartX);
        const dy = Math.abs(e.clientY - pressStartY);
        if (dx > 10 || dy > 10) {
          clearBookLongPress();
        }
      });

      document.addEventListener('pointerup', () => {
        clearBookLongPress();
      });

      document.addEventListener('pointercancel', () => {
        clearBookLongPress();
        longPressTriggered = false;
      });

      document.getElementById('navHomeBtn').addEventListener('click', () => {
        state.currentTab = 'home';
        state.selectedBookId = null;
        renderApp();
      });

      document.getElementById('navSettingsBtn').addEventListener('click', () => {
        state.currentTab = 'settings';
        renderApp();
      });

      document.getElementById('headerBackBtn').addEventListener('click', () => {
        state.selectedBookId = null;
        renderApp();
      });

      document.getElementById('newsFeedBtn')?.addEventListener('click', () => {
        openNewsFeedModal();
      });

      document.addEventListener('click', (e) => {
        const badgeBtn = e.target.closest('#activeUserBadgeBtn');
        const dropdown = document.getElementById('activeUserDropdown');
        if (badgeBtn && dropdown) {
          e.stopPropagation();
          dropdown.classList.toggle('hidden');
          return;
        }

        const unlockBtn = e.target.closest('#unlockActiveUserBtn');
        if (unlockBtn) {
          state.isUserLocked = false;
          try {
            localStorage.setItem('readingmemo_user_locked', 'false');
          } catch (err) {}
          writeCookieValue('readingmemo_user_locked', 'false', 365);
          renderActiveUserBadge();
          dropdown?.classList.remove('hidden');
          showToast('사용자 잠금이 해제되었습니다. 고정할 사용자를 선택해주세요.');
          return;
        }

        const selectUserBtn = e.target.closest('[data-select-active-user]');
        if (selectUserBtn) {
          const userId = selectUserBtn.getAttribute('data-select-active-user');
          setFixedActiveUser(userId, true);
          dropdown?.classList.add('hidden');
          renderApp();
          const chosen = getUserById(userId);
          showToast(`🔒 이 기기 사용자가 "${chosen.name}"님으로 고정되었습니다.`);
          return;
        }

        if (dropdown && !dropdown.classList.contains('hidden') && !e.target.closest('#activeUserDropdown')) {
          dropdown.classList.add('hidden');
        }

        const addBookBtn = e.target.closest('[data-open-add-book]');
        if (addBookBtn) {
          openAddBookModal(addBookBtn.getAttribute('data-open-add-book'));
          return;
        }

        const deleteBookBtn = e.target.closest('[data-delete-book]');
        if (deleteBookBtn) {
          e.stopPropagation();
          openDeleteBookModal(deleteBookBtn.getAttribute('data-delete-book'));
          return;
        }

        const openBookBtn = e.target.closest('[data-open-book]');
        if (openBookBtn) {
          if (longPressTriggered) {
            longPressTriggered = false;
            return;
          }
          state.selectedBookId = openBookBtn.getAttribute('data-open-book');
          renderApp();
          return;
        }

        const editBookCoverBtn = e.target.closest('[data-edit-book-cover]');
        if (editBookCoverBtn) {
          openEditBookCoverModal(editBookCoverBtn.getAttribute('data-edit-book-cover'));
          return;
        }

        const newEntryBtn = e.target.closest('[data-open-new-entry]');
        if (newEntryBtn) {
          const bookId = newEntryBtn.getAttribute('data-open-new-entry');
          const book = state.books.find((b) => b.id === bookId);
          if (book) {
            openEntryEditorModal({ book, existingEntry: null });
          }
          return;
        }

        const editEntryBtn = e.target.closest('[data-edit-entry]');
        if (editEntryBtn) {
          const entryId = editEntryBtn.getAttribute('data-edit-entry');
          const existingEntry = state.entries.find((item) => item.id === entryId);
          const book = existingEntry && state.books.find((b) => b.id === existingEntry.bookId);
          if (book && existingEntry) {
            openEntryEditorModal({ book, existingEntry });
          }
          return;
        }

        const deleteEntryBtn = e.target.closest('[data-delete-entry]');
        if (deleteEntryBtn) {
          openDeleteEntryModal(deleteEntryBtn.getAttribute('data-delete-entry'));
          return;
        }
      });

      document.addEventListener('submit', async (e) => {
        const replyForm = e.target.closest('[data-reply-form]');
        if (!replyForm) return;
        e.preventDefault();

        const entryId = replyForm.getAttribute('data-reply-form');
        const input = replyForm.querySelector('input[name="replyText"]');
        const text = (input?.value || '').trim();
        if (!text) return;

        const entry = state.entries.find((item) => item.id === entryId);
        if (!entry) return;

        if (!Array.isArray(entry.replies)) {
          entry.replies = [];
        }

        const replyId = `reply-${Date.now()}`;
        knownReplyIds.add(replyId);
        entry.replies.push({
          id: replyId,
          authorId: state.activeUserId,
          text,
          date: getTodayDateStr(),
          createdAt: Date.now(),
        });

        input.value = '';
        markLastSeenNow();
        renderApp();
        await syncUpdateEntryReplies(entry.id, entry.replies);
        showToast('답글이 등록되었습니다.');
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          markLastSeenNow();
        } else if (document.visibilityState === 'visible') {
          refreshViewOnResume();
        }
      });

      window.addEventListener('pagehide', () => {
        markLastSeenNow();
      });

      function refreshViewOnResume() {
        updateNewsBadgeUI();
        renderApp();
        forceSyncLatestRemoteData();
      }

      window.addEventListener('pageshow', () => {
        refreshViewOnResume();
      });

      window.addEventListener('focus', () => {
        refreshViewOnResume();
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await hydratePrefsFromIndexedDb();
      bindGlobalEvents();
      renderApp();
      initRealtimeSync();
    });
  </script>
</body>
</html>
