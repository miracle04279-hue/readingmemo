<body class="min-h-screen bg-paper text-ink antialiased selection:bg-accentSoft selection:text-accent">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      collection,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /**
     * =========================================================================
     * 0. Firebase 설정 및 실시간 Firestore 연동 초기화
     * =========================================================================
     */
    const FALLBACK_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDYv4AIaGOSA1VRRGPICMMVLOMtJY-G9VA",
      authDomain: "readingmemo-a1306.firebaseapp.com",
      projectId: "readingmemo-a1306",
      storageBucket: "readingmemo-a1306.firebasestorage.app",
      messagingSenderId: "295077332637",
      appId: "1:295077332637:web:ae5f3fba2f01149592b674",
      measurementId: "G-Y5E7200DHH",
    };

    const appId = typeof __app_id !== "undefined" ? __app_id : "our-reading-memo";
    const firebaseConfig =
      typeof __firebase_config !== "undefined"
        ? JSON.parse(__firebase_config)
        : FALLBACK_FIREBASE_CONFIG;

    const isFirebaseConfigured =
      firebaseConfig &&
      firebaseConfig.apiKey &&
      !String(firebaseConfig.apiKey).startsWith("YOUR_");

    let db = null;
    let auth = null;
    let currentAuthUser = null;

    if (isFirebaseConfigured) {
      try {
        const fbApp = initializeApp(firebaseConfig);
        db = getFirestore(fbApp);
        auth = getAuth(fbApp);
      } catch (err) {
        console.error("Firebase 초기화 오류:", err);
      }
    }

    function getPublicCollection(collectionName) {
      return collection(db, "artifacts", appId, "public", "data", collectionName);
    }

    function getPublicDoc(collectionName, docId) {
      return doc(db, "artifacts", appId, "public", "data", collectionName, docId);
    }

    /**
     * =========================================================================
     * 1. 상태 관리 및 초기 데이터
     * =========================================================================
     */
    const AVATAR_PALETTE = [
      { bg: 'bg-amber-200', text: 'text-amber-950', dot: 'bg-amber-500', badge: 'bg-amber-100 text-amber-900 border-amber-300' },
      { bg: 'bg-emerald-200', text: 'text-emerald-950', dot: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
      { bg: 'bg-sky-200', text: 'text-sky-950', dot: 'bg-sky-500', badge: 'bg-sky-100 text-sky-900 border-sky-300' },
      { bg: 'bg-rose-200', text: 'text-rose-950', dot: 'bg-rose-500', badge: 'bg-rose-100 text-rose-900 border-rose-300' },
      { bg: 'bg-violet-200', text: 'text-violet-950', dot: 'bg-violet-500', badge: 'bg-violet-100 text-violet-900 border-violet-300' },
      { bg: 'bg-orange-200', text: 'text-orange-950', dot: 'bg-orange-500', badge: 'bg-orange-100 text-orange-900 border-orange-300' },
    ];

    const HIGHLIGHT_COLORS = [
      { name: '노랑', hex: '#FFF28A', swatch: '#FFE873' },
      { name: '연두', hex: '#B7F5BA', swatch: '#9BF2A2' },
      { name: '분홍', hex: '#FFB5CE', swatch: '#FFA6C1' },
      { name: '하늘', hex: '#B5DCFF', swatch: '#94CEFF' },
    ];

    const DEFAULT_USERS = [
      { id: 'user-kkyukkyu', name: '뀨뀨', paletteIndex: 0, createdAt: 1 },
      { id: 'user-kkyungi', name: '뀽이', paletteIndex: 1, createdAt: 2 },
      { id: 'user-ttungi', name: '뚱이', paletteIndex: 2, createdAt: 3 },
    ];

    const savedActiveUserId = localStorage.getItem('readingmemo_active_user_id');
    const savedUserLocked = localStorage.getItem('readingmemo_user_locked');

    const state = {
      currentTab: 'home',
      selectedBookId: null,
      viewMode: 'home',
      activeUserId: savedActiveUserId || 'user-kkyukkyu',
      isUserLocked: savedActiveUserId ? savedUserLocked !== 'false' : false,
      cloudConnected: false,
      soundAlertEnabled: localStorage.getItem('readingmemo_sound_alert') !== 'false',
      browserNotifyEnabled: localStorage.getItem('readingmemo_browser_notify') === 'true',
      users: [...DEFAULT_USERS],
      books: [],
      entries: [],
    };

    let initialBooksLoaded = false;
    let initialEntriesLoaded = false;
    const knownBookIds = new Set();
    const knownEntryIds = new Set();
    const knownReplyIds = new Set();

    function setFixedActiveUser(userId, lock = true) {
      state.activeUserId = userId;
      state.isUserLocked = lock;
      localStorage.setItem('readingmemo_active_user_id', userId);
      localStorage.setItem('readingmemo_user_locked', String(lock));
    }

    /**
     * =========================================================================
     * 2. 공통 유틸리티 및 알림음 / 고해상도 이미지 처리
     * =========================================================================
     */
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getUserById(userId) {
      return (
        state.users.find((u) => u.id === userId) ||
        state.users[0] || { id: 'unknown', name: '멤버', paletteIndex: 0 }
      );
    }

    function getPaletteForUser(user) {
      const idx = (user?.paletteIndex ?? 0) % AVATAR_PALETTE.length;
      return AVATAR_PALETTE[idx];
    }

    function getTodayDateStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function canManageBook(book) {
      return Boolean(book && book.ownerId === state.activeUserId);
    }

    function canManageEntry(entry, book = null) {
      if (!entry) return false;
      const targetBook = book || state.books.find((b) => b.id === entry.bookId);
      return Boolean(
        entry.authorId === state.activeUserId &&
          targetBook &&
          targetBook.ownerId === state.activeUserId
      );
    }

    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('hidden');
      }, 2800);
    }

    // 부드러운 딩동 알림음 (Web Audio API)
    function playNotificationChime() {
      if (!state.soundAlertEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const notes = [880, 1174.66]; // A5 -> D6 맑은 딩동 화음
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);

          gain.gain.setValueAtTime(0.001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.14 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.55);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.58);
        });
      } catch (err) {
        console.warn('알림음 재생 제한:', err);
      }
    }

    function triggerIncomingActivityAlert(actorId, message) {
      if (!actorId || actorId === state.activeUserId) return;
      playNotificationChime();
      showToast(`🔔 ${message}`);

      if (
        state.browserNotifyEnabled &&
        'Notification' in window &&
        Notification.permission === 'granted'
      ) {
        try {
          new Notification('우리의 독서메모', {
            body: message,
          });
        } catch (err) {
          console.warn('시스템 알림 표시 오류:', err);
        }
      }
    }

    function copyTextToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(textarea);
      return ok;
    }

    function handleShareAppLink() {
      const shareUrl = window.location.href;
      if (navigator.share) {
        navigator
          .share({
            title: '우리의 독서메모',
            text: '함께 책장과 인상 깊은 구절 사진을 기록해요!',
            url: shareUrl,
          })
          .catch(() => {});
        return;
      }
      if (copyTextToClipboard(shareUrl)) {
        showToast('책장 공유 링크가 복사되었습니다! 카카오톡 등에 붙여넣어 공유해보세요.');
      } else {
        showToast('주소창의 링크를 복사해 공유해주세요.');
      }
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      card.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      card.innerHTML = '';
    }

    // 책 글자 선명도를 유지하면서 Firestore 용량(1MB)에 맞게 JPEG 압축
    function compressImageDataUrl(rawDataUrl, maxDimension = 1440, quality = 0.86) {
      return new Promise((resolve) => {
        if (!rawDataUrl || !rawDataUrl.startsWith('data:image/')) {
          resolve(rawDataUrl);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || 1000;
          const h = img.naturalHeight || 1000;
          const scale = Math.max(w, h) > maxDimension ? maxDimension / Math.max(w, h) : 1;
          const targetW = Math.max(1, Math.round(w * scale));
          const targetH = Math.max(1, Math.round(h * scale));
          const c = document.createElement('canvas');
          c.width = targetW;
          c.height = targetH;
          const cctx = c.getContext('2d');
          cctx.drawImage(img, 0, 0, targetW, targetH);

          let out = c.toDataURL('image/jpeg', quality);
          if (out.length > 920000) {
            out = c.toDataURL('image/jpeg', 0.76);
          }
          resolve(out);
        };
        img.onerror = () => resolve(rawDataUrl);
        img.src = rawDataUrl;
      });
    }

    function readFileAsDataUrl(file, maxDimension = 1440, quality = 0.86) {
      return new Promise((resolve, reject) => {
        if (!file) {
          reject(new Error('선택된 파일이 없습니다.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
          const raw = String(reader.result || '');
          const compressed = await compressImageDataUrl(raw, maxDimension, quality);
          resolve(compressed);
        };
        reader.onerror = () => reject(new Error('파일을 읽는 중 오류가 발생했습니다.'));
        reader.readAsDataURL(file);
      });
    }

    // 폰 기본 카메라 앱 바로 실행 + 갤러리 파일 선택 헬퍼
    function attachNativeCameraAndFileInputs(containerEl, onImageReady, maxDimension = 1440) {
      const nativeCamInput = containerEl.querySelector('[data-native-camera-input]');
      const fileInput = containerEl.querySelector('[data-file-input]');

      const handleInputFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          showToast('사진을 선명하게 불러오는 중...');
          const url = await readFileAsDataUrl(file, maxDimension, 0.86);
          onImageReady(url);
        } catch (err) {
          showToast(err.message || '사진을 불러오지 못했습니다.');
        } finally {
          e.target.value = '';
        }
      };

      nativeCamInput?.addEventListener('change', handleInputFile);
      fileInput?.addEventListener('change', handleInputFile);

      return {
        stopStream() {},
      };
    }

    /**
     * =========================================================================
     * 3. Firestore 실시간 동기화 및 CRUD 헬퍼
     * =========================================================================
     */
    async function syncSaveUser(userObj) {
      if (!db || !currentAuthUser) return;
      try {
        await setDoc(getPublicDoc('users', userObj.id), userObj);
      } catch (err) {
        console.error('사용자 저장 오류:', err);
        showToast('클라우드 동기화에 실패했습니다.');
      }
    }

    async function syncSaveBook(bookObj) {
      if (!db || !currentAuthUser) return;
      try {
        await setDoc(getPublicDoc('books', bookObj.id), bookObj);
      } catch (err) {
        console.error('책 저장 오류:', err);
        showToast('책 저장 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncDeleteBookAndEntries(bookId, relatedEntryIds) {
      if (!db || !currentAuthUser) return;
      try {
        await deleteDoc(getPublicDoc('books', bookId));
        for (const entryId of relatedEntryIds) {
          await deleteDoc(getPublicDoc('entries', entryId));
        }
      } catch (err) {
        console.error('책 삭제 오류:', err);
        showToast('책 삭제 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncSaveEntry(entryObj) {
      if (!db || !currentAuthUser) return;
      try {
        await setDoc(getPublicDoc('entries', entryObj.id), entryObj);
      } catch (err) {
        console.error('구절 저장 오류:', err);
        showToast('구절 저장 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncUpdateEntryReplies(entryId, replies) {
      if (!db || !currentAuthUser) return;
      try {
        await updateDoc(getPublicDoc('entries', entryId), { replies });
      } catch (err) {
        console.error('답글 업데이트 오류:', err);
        showToast('답글 저장 중 동기화 오류가 발생했습니다.');
      }
    }

    async function syncDeleteEntry(entryId) {
      if (!db || !currentAuthUser) return;
      try {
        await deleteDoc(getPublicDoc('entries', entryId));
      } catch (err) {
        console.error('구절 삭제 오류:', err);
        showToast('구절 삭제 중 동기화 오류가 발생했습니다.');
      }
    }

    async function initRealtimeSync() {
      if (!db || !auth) return;
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentAuthUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentAuthUser = cred.user;
        }
      } catch (err) {
        console.error('Firebase 인증 오류:', err);
        showToast('실시간 연동 인증에 실패했습니다.');
        return;
      }

      if (!currentAuthUser) return;
      state.cloudConnected = true;

      // 1) 사용자 목록 실시간 구독
      onSnapshot(
        getPublicCollection('users'),
        async (snapshot) => {
          if (snapshot.empty) {
            for (const defaultUser of DEFAULT_USERS) {
              await syncSaveUser(defaultUser);
            }
            return;
          }
          const loadedUsers = [];
          snapshot.forEach((docSnap) => {
            loadedUsers.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedUsers.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          state.users = loadedUsers;
          if (!state.users.some((u) => u.id === state.activeUserId) && state.users[0]) {
            setFixedActiveUser(state.users[0].id, state.isUserLocked);
          }
          renderApp();
        },
        (error) => {
          console.error('users 구독 오류:', error);
        }
      );

      // 2) 책장 목록 실시간 구독
      onSnapshot(
        getPublicCollection('books'),
        (snapshot) => {
          const loadedBooks = [];
          snapshot.forEach((docSnap) => {
            loadedBooks.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedBooks.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          if (initialBooksLoaded) {
            for (const book of loadedBooks) {
              if (!knownBookIds.has(book.id)) {
                const owner = getUserById(book.ownerId);
                triggerIncomingActivityAlert(
                  book.ownerId,
                  `${owner.name}님이 새 책 "${book.title}"을(를) 책장에 꽂았어요!`
                );
              }
            }
          }
          knownBookIds.clear();
          loadedBooks.forEach((b) => knownBookIds.add(b.id));
          initialBooksLoaded = true;

          state.books = loadedBooks;
          renderApp();
        },
        (error) => {
          console.error('books 구독 오류:', error);
        }
      );

      // 3) 구절 기록 및 답글 실시간 구독
      onSnapshot(
        getPublicCollection('entries'),
        (snapshot) => {
          const loadedEntries = [];
          snapshot.forEach((docSnap) => {
            loadedEntries.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedEntries.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          if (initialEntriesLoaded) {
            for (const entry of loadedEntries) {
              if (!knownEntryIds.has(entry.id)) {
                const author = getUserById(entry.authorId);
                const book = state.books.find((b) => b.id === entry.bookId);
                const bookLabel = book ? `"${book.title}"` : '책장';
                triggerIncomingActivityAlert(
                  entry.authorId,
                  `${author.name}님이 ${bookLabel}에 새 구절을 올렸어요!`
                );
              }
              const replies = Array.isArray(entry.replies) ? entry.replies : [];
              for (const rep of replies) {
                if (!knownReplyIds.has(rep.id)) {
                  const repAuthor = getUserById(rep.authorId);
                  triggerIncomingActivityAlert(
                    rep.authorId,
                    `${repAuthor.name}님이 구절에 답글을 남겼어요: "${rep.text}"`
                  );
                }
              }
            }
          }

          knownEntryIds.clear();
          knownReplyIds.clear();
          loadedEntries.forEach((e) => {
            knownEntryIds.add(e.id);
            (Array.isArray(e.replies) ? e.replies : []).forEach((r) => knownReplyIds.add(r.id));
          });
          initialEntriesLoaded = true;

          state.entries = loadedEntries;
          renderApp();
        },
        (error) => {
          console.error('entries 구독 오류:', error);
        }
      );
    }

    /**
     * =========================================================================
     * 4. 상단 사용자 고정 배지 및 메인 뷰 라우터
     * =========================================================================
     */
    function renderActiveUserBadge() {

      const palette = getPaletteForUser(activeUser);
      const dotEl = document.getElementById('activeUserDot');
      const labelEl = document.getElementById('activeUserLabel');
      const lockIconEl = document.getElementById('activeUserLockIcon');
      const statusHintEl = document.getElementById('activeUserStatusHint');
      const dropdownEl = document.getElementById('activeUserDropdown');

      if (dotEl) {
        dotEl.className = `w-2.5 h-2.5 rounded-full ${palette.dot}`;
      }
      if (labelEl) {
        labelEl.textContent = activeUser.name;
      }
      if (lockIconEl) {
        lockIconEl.textContent = state.isUserLocked ? '🔒' : '▾';
      }
      if (statusHintEl) {
        statusHintEl.textContent = state.isUserLocked ? '내 기기 고정됨' : '사용자 선택';
      }

      if (dropdownEl) {
        if (state.isUserLocked) {
          dropdownEl.innerHTML = `
            <div class="px-3 py-1.5 text-[11px] font-semibold text-muted border-b border-amber-900/10">
              이 기기는 <b>${escapeHtml(activeUser.name)}</b>님으로 고정됨
            </div>
            <button
              type="button"
              id="unlockActiveUserBtn"
              class="w-full text-left px-3 py-2 text-xs font-semibold text-accent hover:bg-amber-100/70 transition flex items-center gap-1.5"
            >
              <span>🔓</span>
              <span>잠금 해제 후 변경하기</span>
            </button>
          `;
        } else {
          dropdownEl.innerHTML = `
            <div class="px-3 py-1 text-[11px] font-semibold text-muted border-b border-amber-900/10">
              이 기기 사용자로 고정
            </div>
            ${state.users
              .map((u) => {
                const p = getPaletteForUser(u);
                const isSelected = u.id === state.activeUserId;
                return `
                  <button
                    type="button"
                    data-select-active-user="${u.id}"
                    class="w-full text-left px-3 py-2 text-xs flex items-center justify-between hover:bg-amber-100/70 transition ${
                      isSelected ? 'font-bold text-accent bg-accentSoft/60' : 'text-ink'
                    }"
                  >
                    <span class="flex items-center gap-2">
                      <span class="w-2.5 h-2.5 rounded-full ${p.dot}"></span>
                      <span>${escapeHtml(u.name)}</span>
                    </span>
                    ${isSelected ? '<span>🔒</span>' : ''}
                  </button>
                `;
              })
              .join('')}
          `;
        }
      }
    }

    function renderApp() {
      const mainContent = document.getElementById('mainContent');
      const headerTitle = document.getElementById('headerTitle');
      const headerSubtitle = document.getElementById('headerSubtitle');
      const backBtn = document.getElementById('headerBackBtn');
      const navHomeBtn = document.getElementById('navHomeBtn');
      const navSettingsBtn = document.getElementById('navSettingsBtn');

      renderActiveUserBadge();

      if (state.currentTab === 'home') {
        navHomeBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
        navSettingsBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';
      } else {
        navSettingsBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-accent text-white shadow-sm';
        navHomeBtn.className =
          'flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition bg-amber-100/60 text-muted hover:bg-amber-200/60';
      }

      if (state.currentTab === 'settings') {
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
        headerTitle.textContent = '설정 및 멤버 관리';
        headerSubtitle.textContent = '함께 기록하는 멤버와 알림을 관리하세요';
        renderSettingsView(mainContent);
        return;
      }

      if (state.selectedBookId) {
        const book = state.books.find((b) => b.id === state.selectedBookId);
        if (!book) {
          state.selectedBookId = null;
        } else {
          const owner = getUserById(book.ownerId);
          backBtn.classList.remove('hidden');
          backBtn.classList.add('flex');
          headerTitle.textContent = book.title;
          headerSubtitle.textContent = `${owner.name}의 책장${book.author ? ` · ${book.author}` : ''}`;
          renderBookDetailView(mainContent, book);
          return;
        }
      }

      backBtn.classList.add('hidden');
      backBtn.classList.remove('flex');
      headerTitle.textContent = '우리의 독서메모';
      headerSubtitle.textContent = state.cloudConnected
        ? '실시간 동기화 중 · 함께 남기는 책장'
        : '소중한 문장과 사진을 함께 남기는 책장';
      renderHomeView(mainContent);
    }

              }

              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-accentSoft text-accent">
                  ${escapeHtml(owner.name)}의 책장
                </span>
                ${
                  isBookOwner
                    ? `
                      <button
                        type="button"
                        data-edit-book-cover="${book.id}"
                        class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 hover:bg-amber-200 text-ink transition"

              <p class="text-xs text-muted">${escapeHtml(book.author || '지은이 미상')} · 구절 ${bookEntries.length}개</p>

          const bookCount = state.books.filter((b) => b.ownerId === user.id).length;

              <div class="flex items-center gap-1">
                <button type="button" data-brush-size="16" class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-surface border border-amber-900/15 text-muted">얇게</button>
                <button type="button" data-brush-size="24" class="px-2 py-1 rounded-lg text-[11px] font-bold bg-ink text-white">보통</button>
                <button type="button" data-brush-size="36" class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-surface border border-amber-900/15 text-muted">굵게</button>
              </div>
            </div>

            <!-- 실제 그림이 그려지는 캔버스 -->
            <div class="rounded-2xl overflow-hidden border border-amber-900/20 bg-amber-50">
              <canvas id="highlightCanvas" class="highlighter-canvas w-full h-auto block"></canvas>
            </div>
          </div>

          <!-- 3) 사진 날짜 지정 -->
          <div>
            <label class="block text-xs font-bold text-ink mb-1">3. 사진 기록 날짜</label>
            <input
              type="date"
              name="photoDate"
              value="${escapeHtml(existingEntry ? existingEntry.photoDate : getTodayDateStr())}"
              class="w-full rounded-2xl bg-paper border border-amber-900/15 px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-accent"
              required
            />
          </div>

          <div class="pt-1 flex items-center gap-2">
            <button type="button" data-close-modal class="flex-1 rounded-2xl bg-amber-100/70 text-muted text-sm font-semibold py-2.5">취소</button>
            <button type="submit" class="flex-1 rounded-2xl bg-accent text-white text-sm font-bold py-2.5 shadow-sm">
              ${isEdit ? '수정 완료' : '저장하기'}
            </button>
          </div>
        </form>
      `);

      const modalCard = document.getElementById('modalCard');
      const canvasSection = document.getElementById('canvasEditorSection');
      const canvas = document.getElementById('highlightCanvas');
      const ctx = canvas.getContext('2d');

      function loadImageOntoCanvas(dataUrl) {
        if (!dataUrl) return;
        const img = new Image();
        img.onload = () => {
          const maxWidth = 1440;
          const naturalW = img.naturalWidth || 1000;
          const naturalH = img.naturalHeight || 750;
          const scale = naturalW > maxWidth ? maxWidth / naturalW : 1;
          canvas.width = Math.round(naturalW * scale);
          canvas.height = Math.round(naturalH * scale);

          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          hasBaseImageLoaded = true;
          canvasSection.classList.remove('hidden');
        };
        img.onerror = () => {
          showToast('이미지를 캔버스에 불러오지 못했습니다.');
        };
        img.src = dataUrl;
      }

      if (photoDataUrl) {
        loadImageOntoCanvas(photoDataUrl);
      }

      const camHelper = attachNativeCameraAndFileInputs(
        modalCard,
        (newDataUrl) => {
          photoDataUrl = newDataUrl;
          loadImageOntoCanvas(newDataUrl);
        },
        1440
      );

      modalCard.querySelectorAll('[data-hl-color]').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedColor = btn.getAttribute('data-hl-color');
          modalCard.querySelectorAll('[data-hl-color]').forEach((b) => {
            b.classList.remove('border-ink', 'bg-paper', 'shadow-2xs');
            b.classList.add('border-amber-900/15', 'bg-surface');
          });
          btn.classList.remove('border-amber-900/15', 'bg-surface');
          btn.classList.add('border-ink', 'bg-paper', 'shadow-2xs');
        });
      });

      modalCard.querySelectorAll('[data-brush-size]').forEach((btn) => {
        btn.addEventListener('click', () => {
          brushSize = Number(btn.getAttribute('data-brush-size')) || 24;
          modalCard.querySelectorAll('[data-brush-size]').forEach((b) => {
            b.className = 'px-2 py-1 rounded-lg text-[11px] font-semibold bg-surface border border-amber-900/15 text-muted';
          });
          btn.className = 'px-2 py-1 rounded-lg text-[11px] font-bold bg-ink text-white';
        });
      });

      document.getElementById('resetHighlightBtn').addEventListener('click', () => {
        if (photoDataUrl) {
          loadImageOntoCanvas(photoDataUrl);
          showToast('형광펜 밑줄이 초기화되었습니다.');
        }
      });

      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function drawHighlighterStroke(from, to) {
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = selectedColor;
        ctx.lineWidth = brushSize * (canvas.width / 360);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
        ctx.restore();
      }

      canvas.addEventListener('mousedown', (e) => {
        if (!hasBaseImageLoaded) return;
        isDrawing = true;
        lastPoint = getCanvasCoords(e.clientX, e.clientY);
        drawHighlighterStroke(lastPoint, lastPoint);
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing || !lastPoint) return;
        const current = getCanvasCoords(e.clientX, e.clientY);
        drawHighlighterStroke(lastPoint, current);
        lastPoint = current;
      });

      const endStroke = () => {
        isDrawing = false;
        lastPoint = null;
      };
      window.addEventListener('mouseup', endStroke);

      canvas.addEventListener(
        'touchstart',
        (e) => {
          if (!hasBaseImageLoaded || e.touches.length === 0) return;
          e.preventDefault();
          isDrawing = true;
          const touch = e.touches[0];
          lastPoint = getCanvasCoords(touch.clientX, touch.clientY);
          drawHighlighterStroke(lastPoint, lastPoint);
        },
        { passive: false }
      );

      canvas.addEventListener(
        'touchmove',
        (e) => {
          if (!isDrawing || !lastPoint || e.touches.length === 0) return;
          e.preventDefault();
          const touch = e.touches[0];
          const current = getCanvasCoords(touch.clientX, touch.clientY);
          drawHighlighterStroke(lastPoint, current);
          lastPoint = current;
        },
        { passive: false }
      );

      canvas.addEventListener('touchend', endStroke);

      const cleanupObserver = new MutationObserver(() => {
        if (!document.body.contains(canvas)) {
          window.removeEventListener('mouseup', endStroke);
          cleanupObserver.disconnect();
        }
      });
      cleanupObserver.observe(document.getElementById('modalCard'), { childList: true });

      modalCard.querySelectorAll('[data-close-modal]').forEach((btn) => {
        btn.addEventListener('click', () => {
          camHelper.stopStream();
          window.removeEventListener('mouseup', endStroke);
          cleanupObserver.disconnect();
          closeModal();
        });
      });

      document.getElementById('entryEditorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        camHelper.stopStream();
        window.removeEventListener('mouseup', endStroke);
        cleanupObserver.disconnect();

        const formData = new FormData(e.target);
        const photoDate = String(formData.get('photoDate') || '').trim() || getTodayDateStr();

        if (!photoDataUrl) {
          showToast('구절 사진을 촬영하거나 선택해주세요.');
          return;
        }

        const rawFinalUrl = hasBaseImageLoaded
          ? canvas.toDataURL('image/jpeg', 0.88)
          : photoDataUrl;
        const finalPhotoUrl = await compressImageDataUrl(rawFinalUrl, 1440, 0.86);

        state.currentTab = 'home';
        state.selectedBookId = book.id;

        if (existingEntry) {
          existingEntry.photoUrl = finalPhotoUrl;
          existingEntry.photoDate = photoDate;
          closeModal();
          renderApp();
          await syncSaveEntry(existingEntry);
          showToast('구절 기록이 수정되었습니다.');
        } else {
          const newEntry = {
            id: `entry-${Date.now()}`,
            bookId: book.id,
            authorId: state.activeUserId,
            photoUrl: finalPhotoUrl,
            photoDate,
            replies: [],
            createdAt: Date.now(),
          };
          state.entries.push(newEntry);
          closeModal();
          renderApp();
          await syncSaveEntry(newEntry);
          showToast('구절 사진이 저장되었습니다.');
        }
      });
    }

    function openDeleteEntryModal(entryId) {
      const entry = state.entries.find((e) => e.id === entryId);
      if (!entry) return;
      if (!canManageEntry(entry)) {
        showToast('본인이 작성한 구절만 삭제할 수 있어요.');
        return;
      }

      openModal(`
        <div class="space-y-3 text-center">
          <div class="text-3xl">🗑️</div>
          <h3 class="font-serif text-lg font-bold text-ink">이 구절 기록을 삭제할까요?</h3>
          <p class="text-xs text-muted leading-relaxed">삭제하면 구절 사진과 달린 답글이 모두 사라집니다.</p>
          <div class="pt-2 flex items-center gap-2">
            <button type="button" id="cancelDeleteEntryBtn" class="flex-1 rounded-2xl bg-amber-100/80 text-ink text-sm font-semibold py-2.5">취소</button>
            <button type="button" id="confirmDeleteEntryBtn" class="flex-1 rounded-2xl bg-red-600 text-white text-sm font-bold py-2.5">삭제하기</button>
          </div>
        </div>
      `);

      document.getElementById('cancelDeleteEntryBtn').addEventListener('click', closeModal);
      document.getElementById('confirmDeleteEntryBtn').addEventListener('click', async () => {
        state.currentTab = 'home';
        state.selectedBookId = entry.bookId;
        state.entries = state.entries.filter((item) => item.id !== entryId);
        closeModal();
        renderApp();
        await syncDeleteEntry(entryId);
        showToast('구절 기록이 삭제되었습니다.');
      });
    }

    /**
     * =========================================================================
     * 10. 전역 이벤트 위임 바인딩
     * =========================================================================
     */
    function bindGlobalEvents() {
      document.getElementById('navHomeBtn').addEventListener('click', () => {
        state.currentTab = 'home';
        state.selectedBookId = null;
        renderApp();
      });

      document.getElementById('navSettingsBtn').addEventListener('click', () => {
        state.currentTab = 'settings';
        renderApp();
      });

      document.getElementById('headerBackBtn').addEventListener('click', () => {
        state.selectedBookId = null;
        renderApp();
      });

      document.getElementById('shareAppBtn')?.addEventListener('click', () => {
        handleShareAppLink();
      });

      document.addEventListener('click', (e) => {
        const badgeBtn = e.target.closest('#activeUserBadgeBtn');
        const dropdown = document.getElementById('activeUserDropdown');
        if (badgeBtn && dropdown) {
          e.stopPropagation();
          dropdown.classList.toggle('hidden');
          return;
        }

        const unlockBtn = e.target.closest('#unlockActiveUserBtn');
        if (unlockBtn) {
          state.isUserLocked = false;
          localStorage.setItem('readingmemo_user_locked', 'false');
          renderActiveUserBadge();
          dropdown?.classList.remove('hidden');
          showToast('사용자 잠금이 해제되었습니다. 고정할 사용자를 선택해주세요.');
          return;
        }

        const selectUserBtn = e.target.closest('[data-select-active-user]');
        if (selectUserBtn) {
          const userId = selectUserBtn.getAttribute('data-select-active-user');
          setFixedActiveUser(userId, true);
          dropdown?.classList.add('hidden');
          renderApp();
          const chosen = getUserById(userId);
          showToast(`🔒 이 기기 사용자가 "${chosen.name}"님으로 고정되었습니다.`);
          return;
        }

        if (dropdown && !dropdown.classList.contains('hidden') && !e.target.closest('#activeUserDropdown')) {
          dropdown.classList.add('hidden');
        }

        const addBookBtn = e.target.closest('[data-open-add-book]');
        if (addBookBtn) {
          openAddBookModal(addBookBtn.getAttribute('data-open-add-book'));
          return;
        }

        const deleteBookBtn = e.target.closest('[data-delete-book]');
        if (deleteBookBtn) {
          e.stopPropagation();
          openDeleteBookModal(deleteBookBtn.getAttribute('data-delete-book'));
          return;
        }

        const openBookBtn = e.target.closest('[data-open-book]');
        if (openBookBtn) {
          state.selectedBookId = openBookBtn.getAttribute('data-open-book');
          renderApp();
          return;
        }

        const editBookCoverBtn = e.target.closest('[data-edit-book-cover]');
        if (editBookCoverBtn) {
          openEditBookCoverModal(editBookCoverBtn.getAttribute('data-edit-book-cover'));
          return;
        }

        const newEntryBtn = e.target.closest('[data-open-new-entry]');
        if (newEntryBtn) {
          const bookId = newEntryBtn.getAttribute('data-open-new-entry');
          const book = state.books.find((b) => b.id === bookId);
          if (book) {
            openEntryEditorModal({ book, existingEntry: null });
          }
          return;
        }

        const editEntryBtn = e.target.closest('[data-edit-entry]');
        if (editEntryBtn) {
          const entryId = editEntryBtn.getAttribute('data-edit-entry');
          const existingEntry = state.entries.find((item) => item.id === entryId);
          const book = existingEntry && state.books.find((b) => b.id === existingEntry.bookId);
          if (book && existingEntry) {
            openEntryEditorModal({ book, existingEntry });
          }
          return;
        }

        const deleteEntryBtn = e.target.closest('[data-delete-entry]');
        if (deleteEntryBtn) {
          openDeleteEntryModal(deleteEntryBtn.getAttribute('data-delete-entry'));
          return;
        }
      });

      document.addEventListener('submit', async (e) => {
        const replyForm = e.target.closest('[data-reply-form]');
        if (!replyForm) return;
        e.preventDefault();

        const entryId = replyForm.getAttribute('data-reply-form');
        const input = replyForm.querySelector('input[name="replyText"]');
        const text = (input?.value || '').trim();
        if (!text) return;

        const entry = state.entries.find((item) => item.id === entryId);
        if (!entry) return;

        if (!Array.isArray(entry.replies)) {
          entry.replies = [];
        }

        entry.replies.push({
          id: `reply-${Date.now()}`,
          authorId: state.activeUserId,
          text,
          date: getTodayDateStr(),
        });

        input.value = '';
        renderApp();
        await syncUpdateEntryReplies(entry.id, entry.replies);
        showToast('답글이 등록되었습니다.');
      });
    }

    // 초기화 실행
    window.addEventListener('DOMContentLoaded', () => {
      bindGlobalEvents();
      renderApp();
      initRealtimeSync();
    });
  </script>
</body>
</html>
