  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      initializeFirestore,
      memoryLocalCache,
      doc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      getDocs,
      collection,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const FALLBACK_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDYv4AIaGOSA1VRRGPICMMVLOMtJY-G9VA",
      authDomain: "readingmemo-a1306.firebaseapp.com",
      projectId: "readingmemo-a1306",
      storageBucket: "readingmemo-a1306.firebasestorage.app",
      messagingSenderId: "295077332637",
      appId: "1:295077332637:web:ae5f3fba2f01149592b674",
      measurementId: "G-Y5E7200DHH",
    };

    const appId = typeof __app_id !== "undefined" ? __app_id : "our-reading-memo";
    const firebaseConfig =
      typeof __firebase_config !== "undefined"
        ? JSON.parse(__firebase_config)
        : FALLBACK_FIREBASE_CONFIG;

    const isFirebaseConfigured =
      firebaseConfig &&
      firebaseConfig.apiKey &&
      !String(firebaseConfig.apiKey).startsWith("YOUR_");

    let db = null;
    let auth = null;
    let currentAuthUser = null;

    if (isFirebaseConfigured) {
      try {
        const fbApp = initializeApp(firebaseConfig);
        db = initializeFirestore(fbApp, {
          localCache: memoryLocalCache(),
        });
        auth = getAuth(fbApp);
      } catch (err) {
        console.error("Firebase 초기화 오류:", err);
      }
    }

    function getPublicCollection(collectionName) {
      return collection(db, "artifacts", appId, "public", "data", collectionName);
    }

    function getPublicDoc(collectionName, docId) {
      return doc(db, "artifacts", appId, "public", "data", collectionName, docId);
    }

    const AVATAR_PALETTE = [
      { bg: 'bg-amber-200', text: 'text-amber-950', dot: 'bg-amber-500', badge: 'bg-amber-100 text-amber-900 border-amber-300' },
      { bg: 'bg-emerald-200', text: 'text-emerald-950', dot: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
      { bg: 'bg-sky-200', text: 'text-sky-950', dot: 'bg-sky-500', badge: 'bg-sky-100 text-sky-900 border-sky-300' },
      { bg: 'bg-rose-200', text: 'text-rose-950', dot: 'bg-rose-500', badge: 'bg-rose-100 text-rose-900 border-rose-300' },
      { bg: 'bg-violet-200', text: 'text-violet-950', dot: 'bg-violet-500', badge: 'bg-violet-100 text-violet-900 border-violet-300' },
      { bg: 'bg-orange-200', text: 'text-orange-950', dot: 'bg-orange-500', badge: 'bg-orange-100 text-orange-900 border-orange-300' },
    ];

    const HIGHLIGHT_COLORS = [
      { name: '노랑', hex: '#FFF28A', swatch: '#FFE873' },
      { name: '연두', hex: '#B7F5BA', swatch: '#9BF2A2' },
      { name: '분홍', hex: '#FFB5CE', swatch: '#FFA6C1' },
      { name: '하늘', hex: '#B5DCFF', swatch: '#94CEFF' },
    ];

    const DEFAULT_USERS = [
      { id: 'user-kkyukkyu', name: '뀨뀨', paletteIndex: 0, createdAt: 1 },
      { id: 'user-kkyungi', name: '뀽이', paletteIndex: 1, createdAt: 2 },
      { id: 'user-ttungi', name: '뚱이', paletteIndex: 2, createdAt: 3 },
    ];

    function readCookieValue(name) {
      const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return match ? decodeURIComponent(match[1]) : '';
    }

    function writeCookieValue(name, value, days = 365) {
      try {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
      } catch (e) {}
    }

    const IDB_NAME = 'readingmemo_device_store';
    const IDB_STORE = 'prefs';

    function openPrefsDb() {
      return new Promise((resolve) => {
        if (!('indexedDB' in window)) {
          resolve(null);
          return;
        }
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const dbInstance = req.result;
            if (!dbInstance.objectStoreNames.contains(IDB_STORE)) {
              dbInstance.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    async function savePrefToIdb(key, value) {
      const dbInstance = await openPrefsDb();
      if (!dbInstance) return;
      try {
        const tx = dbInstance.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
      } catch (e) {}
    }

    async function loadPrefFromIdb(key) {
      const dbInstance = await openPrefsDb();
      if (!dbInstance) return null;
      return new Promise((resolve) => {
        try {
          const tx = dbInstance.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    function getPersistedUserConfig() {
      const params = new URLSearchParams(window.location.search);
      const urlUserId = params.get('user') || '';

      let hashUserId = '';
      try {
        const hashParams = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
        hashUserId = hashParams.get('user') || '';
      } catch (e) {}

      let winNameUserId = '';
      let winNameLocked = '';
      try {
        if (window.name && window.name.startsWith('READINGMEMO_USER:')) {
          const parsed = JSON.parse(window.name.slice('READINGMEMO_USER:'.length));
          winNameUserId = parsed.userId || '';
          winNameLocked = typeof parsed.isLocked === 'boolean' ? String(parsed.isLocked) : '';
        }
      } catch (e) {}

      let lsUserId = '';
      let lsLocked = '';
      try {
        lsUserId = localStorage.getItem('readingmemo_active_user_id') || '';
        lsLocked = localStorage.getItem('readingmemo_user_locked') || '';
      } catch (e) {}
      const cookieUserId = readCookieValue('readingmemo_active_user_id');
      const cookieLocked = readCookieValue('readingmemo_user_locked');

      const resolvedUserId =
        lsUserId || cookieUserId || winNameUserId || urlUserId || hashUserId || '';
      const resolvedLockedStr = lsLocked || cookieLocked || winNameLocked;
      return {
        userId: resolvedUserId,
        isLocked: resolvedUserId ? resolvedLockedStr !== 'false' : false,
      };
    }

    function getSavedLastSeenAt() {
      let lsVal = 0;
      let ckVal = 0;
      try {
        lsVal = Number(localStorage.getItem('readingmemo_last_seen_at') || '0');
      } catch (e) {}
      ckVal = Number(readCookieValue('readingmemo_last_seen_at') || '0');
      const resolved = Math.max(lsVal, ckVal);
      if (resolved > 0) return resolved;

      const initialNow = Date.now();
      try {
        localStorage.setItem('readingmemo_last_seen_at', String(initialNow));
      } catch (e) {}
      writeCookieValue('readingmemo_last_seen_at', String(initialNow), 365);
      return initialNow;
    }

    function getSavedAlertedIds() {
      let raw = '';
      try {
        raw = localStorage.getItem('readingmemo_alerted_event_ids') || '';
      } catch (e) {}
      if (!raw) {
        raw = readCookieValue('readingmemo_alerted_event_ids');
      }
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed.map((id) => String(id)) : [];
      } catch (e) {
        return [];
      }
    }

    const persistedUser = getPersistedUserConfig();

    const state = {
      currentTab: 'home',
      selectedBookId: null,
      activeUserId: persistedUser.userId || 'user-kkyukkyu',
      isUserLocked: persistedUser.userId ? persistedUser.isLocked : true,
      soundAlertEnabled: localStorage.getItem('readingmemo_sound_alert') !== 'false',
      browserNotifyEnabled: localStorage.getItem('readingmemo_browser_notify') === 'true',
      lastSeenAt: getSavedLastSeenAt(),
      cloudConnected: false,
      users: [...DEFAULT_USERS],
      books: [],
      entries: [],
    };

    let initialBooksLoaded = false;
    let initialEntriesLoaded = false;
    let missedCatchupDone = false;
    let isRefreshingRemoteData = false;
    let lastResumeSyncAt = 0;
    let syncAuthReadyPromise = null;
    let realtimeSyncInitialized = false;
    let isSettingUpListeners = false;
    let unsubscribeUsersListener = null;
    let unsubscribeBooksListener = null;
    let unsubscribeEntriesListener = null;
    let resubscribeTimer = null;
    const knownBookIds = new Set();
    const knownEntryIds = new Set();
    const knownReplyIds = new Set();
    const alertedEventIds = new Set(getSavedAlertedIds());

    function persistAlertedEventIds() {
      const uniqueIds = Array.from(alertedEventIds).slice(-400);
      const serialized = JSON.stringify(uniqueIds);
      try {
        localStorage.setItem('readingmemo_alerted_event_ids', serialized);
      } catch (e) {}
      writeCookieValue('readingmemo_alerted_event_ids', serialized, 365);
      savePrefToIdb('readingmemo_alerted_event_ids', uniqueIds);
    }

    function markLastSeenNow() {
      const now = Date.now();
      const currentItems = collectActivityItems();
      for (const item of currentItems) {
        if (item?.id) {
          alertedEventIds.add(String(item.id));
        }
      }
      persistAlertedEventIds();

      state.lastSeenAt = Math.max(Number(state.lastSeenAt || 0), now);
      try {
        localStorage.setItem('readingmemo_last_seen_at', String(state.lastSeenAt));
      } catch (e) {}
      writeCookieValue('readingmemo_last_seen_at', String(state.lastSeenAt), 365);
      savePrefToIdb('readingmemo_last_seen_at', String(state.lastSeenAt));
      updateNewsBadgeUI();
    }

    function getCleanShareUrl() {
      try {
        const url = new URL(window.location.href);
        url.searchParams.delete('user');
        url.hash = '';
        return url.toString();
      } catch (e) {
        return window.location.origin + window.location.pathname;
      }
    }

    function setFixedActiveUser(userId, lock = true) {
      if (!userId) return;
      state.activeUserId = userId;
      state.isUserLocked = Boolean(lock);
      try {
        localStorage.setItem('readingmemo_active_user_id', state.activeUserId);
        localStorage.setItem('readingmemo_user_locked', String(state.isUserLocked));
      } catch (e) {}
      writeCookieValue('readingmemo_active_user_id', state.activeUserId, 365);
      writeCookieValue('readingmemo_user_locked', String(state.isUserLocked), 365);
      try {
        window.name = `READINGMEMO_USER:${JSON.stringify({
          userId: state.activeUserId,
          isLocked: state.isUserLocked,
        })}`;
      } catch (e) {}
      savePrefToIdb('readingmemo_active_user_id', state.activeUserId);
      savePrefToIdb('readingmemo_user_locked', String(state.isUserLocked));
    }

    function cleanupRealtimeListeners() {
      if (resubscribeTimer !== null) {
        clearTimeout(resubscribeTimer);
        resubscribeTimer = null;
      }
      if (typeof unsubscribeUsersListener === 'function') {
        try {
          unsubscribeUsersListener();
        } catch (e) {}
        unsubscribeUsersListener = null;
      }
      if (typeof unsubscribeBooksListener === 'function') {
        try {
          unsubscribeBooksListener();
        } catch (e) {}
        unsubscribeBooksListener = null;
      }
      if (typeof unsubscribeEntriesListener === 'function') {
        try {
          unsubscribeEntriesListener();
        } catch (e) {}
        unsubscribeEntriesListener = null;
      }
      realtimeSyncInitialized = false;
    }

    function scheduleSafeResubscribe() {
      if (isSettingUpListeners || resubscribeTimer !== null) return;
      cleanupRealtimeListeners();
      resubscribeTimer = setTimeout(() => {
        resubscribeTimer = null;
        initRealtimeSync();
      }, 800);
    }

    async function initRealtimeSync() {
      if (!db || !auth) return;
      if (realtimeSyncInitialized || isSettingUpListeners) return;

      if (!syncAuthReadyPromise) {
        syncAuthReadyPromise = (async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              const cred = await signInWithCustomToken(auth, __initial_auth_token);
              currentAuthUser = cred.user;
            } else {
              const cred = await signInAnonymously(auth);
              currentAuthUser = cred.user;
            }
          } catch (err) {
            console.error('Firebase 인증 오류:', err);
          }
        })();
      }
      await syncAuthReadyPromise;

      if (!currentAuthUser) return;
      if (realtimeSyncInitialized || isSettingUpListeners) return;
      isSettingUpListeners = true;

      try {
        cleanupRealtimeListeners();

        const usersColRef = getPublicCollection('users');
        const booksColRef = getPublicCollection('books');
        const entriesColRef = getPublicCollection('entries');

        unsubscribeUsersListener = onSnapshot(
          usersColRef,
          async (snapshot) => {
            if (snapshot.empty) {
              for (const defaultUser of DEFAULT_USERS) {
                await syncSaveUser(defaultUser);
              }
              return;
            }
            const loadedUsers = [];
            snapshot.forEach((docSnap) => {
              loadedUsers.push({ id: docSnap.id, ...docSnap.data() });
            });
            loadedUsers.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            state.users = loadedUsers;
            if (!state.users.some((u) => u.id === state.activeUserId) && state.users[0]) {
              setFixedActiveUser(state.users[0].id, state.isUserLocked);
            }
            renderApp();
          },
          (error) => {
            if (String(error?.message || '').includes('Target ID already exists')) {
              scheduleSafeResubscribe();
            }
          }
        );

        unsubscribeBooksListener = onSnapshot(
          booksColRef,
          (snapshot) => {
            const docsList = [];
            snapshot.forEach((docSnap) => {
              docsList.push({ id: docSnap.id, ...docSnap.data() });
            });
            initialBooksLoaded = true;
            applyBooksSnapshotDocs(docsList);
            checkMissedActivitySinceLastVisit();
          },
          (error) => {
            if (String(error?.message || '').includes('Target ID already exists')) {
              scheduleSafeResubscribe();
            }
          }
        );

        unsubscribeEntriesListener = onSnapshot(
          entriesColRef,
          (snapshot) => {
            const docsList = [];
            snapshot.forEach((docSnap) => {
              docsList.push({ id: docSnap.id, ...docSnap.data() });
            });
            initialEntriesLoaded = true;
            applyEntriesSnapshotDocs(docsList);
            checkMissedActivitySinceLastVisit();
          },
          (error) => {
            if (String(error?.message || '').includes('Target ID already exists')) {
              scheduleSafeResubscribe();
            }
          }
        );

        realtimeSyncInitialized = true;
        state.cloudConnected = true;
      } finally {
        isSettingUpListeners = false;
      }
    }

    function copyTextToClipboard(text) {
      return new Promise((resolve) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(
            () => resolve(true),
            () => resolve(fallbackCopy(text))
          );
          return;
        }
        resolve(fallbackCopy(text));
      });
    }

    function fallbackCopy(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return Boolean(ok);
      } catch (e) {
        return false;
      }
    }

    async function hydratePrefsFromIndexedDb() {
      try {
        const savedUserId = await loadPrefFromIdb('readingmemo_active_user_id');
        const savedLocked = await loadPrefFromIdb('readingmemo_user_locked');
        const savedLastSeen = Number(await loadPrefFromIdb('readingmemo_last_seen_at') || '0');
        const savedAlerted = await loadPrefFromIdb('readingmemo_alerted_event_ids');

        if (!state.activeUserId && savedUserId) {
          state.activeUserId = savedUserId;
        }
        if (savedLocked === 'true' || savedLocked === 'false') {
          state.isUserLocked = savedLocked === 'true';
        }
        if (savedLastSeen > state.lastSeenAt) {
          state.lastSeenAt = savedLastSeen;
          try {
            localStorage.setItem('readingmemo_last_seen_at', String(savedLastSeen));
          } catch (e) {}
          writeCookieValue('readingmemo_last_seen_at', String(savedLastSeen), 365);
        }
        if (Array.isArray(savedAlerted) && savedAlerted.length > 0) {
          savedAlerted.forEach((id) => alertedEventIds.add(String(id)));

    function getEntrySortTimestamp(entry) {
      if (!entry) return 0;
      const created = Number(entry.createdAt);
      if (Number.isFinite(created) && created > 0) return created;

      const idMatch = String(entry.id || '').match(/(\d{10,})/);
      if (idMatch) {
        const parsedIdTs = Number(idMatch[1]);
        if (Number.isFinite(parsedIdTs) && parsedIdTs > 0) return parsedIdTs;

      if (entry.photoDate) {
        const parsedDate = Date.parse(`${entry.photoDate}T00:00:00`);

      return 0;

    function playNotificationChime() {
      if (!state.soundAlertEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.exponentialRampToValueAtTime(0.14, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.02);
        };

        playTone(659.25, now, 0.22);
        playTone(880, now + 0.14, 0.32);

        setTimeout(() => {
          ctx.close().catch(() => {});
        }, 800);
      } catch (e) {}
    }

    function triggerBrowserNotification(title, body, onClickAction = null) {
      if (!state.browserNotifyEnabled) return;
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      try {
        const notif = new Notification(title, {
          body,
          tag: `readingmemo-${Date.now()}`,
        });
        notif.onclick = () => {
          window.focus();
          if (typeof onClickAction === 'function') {
            onClickAction();
          }
          notif.close();
        };
      } catch (e) {}
    }

    function collectActivityItems() {
      const items = [];

      for (const book of state.books) {
        const actId = `act-book-${book.id}`;
        const ts = Number(book.createdAt || 0);
        const actor = getUserById(book.ownerId);
        items.push({
          id: actId,
          type: 'book',
          ts,
          actorId: book.ownerId,
          actorName: actor.name,
          bookId: book.id,
          bookTitle: book.title || '제목 없는 책',
          summary: `${actor.name}님이 "${book.title || '제목 없는 책'}" 책을 책장에 꽂았어요.`,
          dateLabel: book.createdAt
            ? new Date(book.createdAt).toLocaleString('ko-KR', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
              })
            : '',
        });
      }

      for (const entry of state.entries) {
        const book = state.books.find((b) => b.id === entry.bookId);
        const bookTitle = book ? book.title : '책';
        const actor = getUserById(entry.authorId);
        const entryTs = getEntrySortTimestamp(entry);
        const entryActId = `act-entry-${entry.id}`;

        items.push({
          id: entryActId,
          type: 'entry',
          ts: entryTs,
          actorId: entry.authorId,
          actorName: actor.name,
          bookId: entry.bookId,
          bookTitle,
          summary: `${actor.name}님이 "${bookTitle}"에 새 구절 사진을 남겼어요.`,
          dateLabel: entry.photoDate || (entryTs ? new Date(entryTs).toLocaleDateString('ko-KR') : ''),
        });

        const replies = Array.isArray(entry.replies) ? entry.replies : [];
        replies.forEach((rep, idx) => {
          const replyActId = `act-reply-${entry.id}-${rep.id || idx}`;
          const repActor = getUserById(rep.authorId);
          const idMatch = String(rep.id || '').match(/(\d{10,})/);
          const repTs = idMatch ? Number(idMatch[1]) : entryTs + idx + 1;
          items.push({
            id: replyActId,
            type: 'reply',
            ts: repTs,
            actorId: rep.authorId,
            actorName: repActor.name,
            bookId: entry.bookId,
            bookTitle,
            summary: `${repActor.name}님이 "${bookTitle}" 구절에 답글: "${rep.text || ''}"`,
            dateLabel: rep.date || '',
          });
        });
      }

      items.sort((a, b) => b.ts - a.ts);
      return items;
    }

    function createPhotoCaptureController(modalRoot) {
      let stream = null;
      const videoEl = modalRoot.querySelector('[data-camera-video]');
      const cameraBox = modalRoot.querySelector('[data-camera-box]');
      const captureBtn = modalRoot.querySelector('[data-capture-photo-btn]');
      const stopCameraBtn = modalRoot.querySelector('[data-stop-camera-btn]');

      function stopStream() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        if (videoEl) {
          videoEl.srcObject = null;
        }
        if (cameraBox) {
          cameraBox.classList.add('hidden');
        }
      }

      async function startStream(onCapturedDataUrl) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('이 브라우저에서는 직접 카메라 미리보기를 지원하지 않아 사진 선택을 열어드릴게요.');
          modalRoot.querySelector('[data-file-input]')?.click();
          return;
        }
        try {
          stopStream();
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false,
          });
          if (videoEl && cameraBox) {
            videoEl.srcObject = stream;
            cameraBox.classList.remove('hidden');
            await videoEl.play();
          }
          if (captureBtn) {
            captureBtn.onclick = async () => {
              if (!videoEl) return;
              const w = videoEl.videoWidth || 1280;
              const h = videoEl.videoHeight || 720;
              const snapCanvas = document.createElement('canvas');
              snapCanvas.width = w;
              snapCanvas.height = h;
              const sctx = snapCanvas.getContext('2d');
              sctx.drawImage(videoEl, 0, 0, w, h);
              const rawUrl = snapCanvas.toDataURL('image/jpeg', 0.9);
              const compressedUrl = await compressImageDataUrl(rawUrl, 960, 0.78);
              stopStream();
              onCapturedDataUrl(compressedUrl);
            };
          }
          if (stopCameraBtn) {
            stopCameraBtn.onclick = () => stopStream();
          }
        } catch (err) {
          console.warn('카메라 스트림 접근 실패, 파일 선택으로 대체:', err);
          stopStream();
          modalRoot.querySelector('[data-file-input]')?.click();
        }
      }

      return { startStream, stopStream };
    }

    function compressImageDataUrl(rawDataUrl, maxDimension = 960, quality = 0.78) {
      return new Promise((resolve) => {
        if (!rawDataUrl || !rawDataUrl.startsWith('data:image/')) {
          resolve(rawDataUrl);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || 800;
          const h = img.naturalHeight || 800;
          const scale = Math.max(w, h) > maxDimension ? maxDimension / Math.max(w, h) : 1;
          const targetW = Math.max(1, Math.round(w * scale));
          const targetH = Math.max(1, Math.round(h * scale));
          const c = document.createElement('canvas');
          c.width = targetW;
          c.height = targetH;
          const cctx = c.getContext('2d');
          cctx.drawImage(img, 0, 0, targetW, targetH);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(rawDataUrl);
        img.src = rawDataUrl;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          reject(new Error('선택된 파일이 없습니다.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
          const raw = String(reader.result || '');
          const compressed = await compressImageDataUrl(raw);
          resolve(compressed);
        };
        reader.onerror = () => reject(new Error('파일을 읽는 중 오류가 발생했습니다.'));
        reader.readAsDataURL(file);
      });
    }

              >
                ✂️ 오려내기 완료
              </button>
            </div>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      const stage = overlay.querySelector('[data-crop-stage]');
      const imgEl = overlay.querySelector('[data-crop-img]');
      const layerEl = overlay.querySelector('[data-crop-layer]');
      const boxEl = overlay.querySelector('[data-crop-box]');

      // Normalized crop rectangle [0..1] relative to displayed image bounds
      let crop = { x: 0.08, y: 0.08, w: 0.84, h: 0.84 };
      const MIN_FRAC = 0.08;

      const syncLayerToImage = () => {
        if (!stage || !imgEl || !layerEl) return;
        const stageRect = stage.getBoundingClientRect();
        const imgRect = imgEl.getBoundingClientRect();
        const offsetLeft = imgRect.left - stageRect.left;
        const offsetTop = imgRect.top - stageRect.top;
        layerEl.style.left = `${offsetLeft}px`;
        layerEl.style.top = `${offsetTop}px`;
        layerEl.style.width = `${imgRect.width}px`;
        layerEl.style.height = `${imgRect.height}px`;
        layerEl.style.right = 'auto';
        layerEl.style.bottom = 'auto';
      };

      const renderCropBox = () => {
        syncLayerToImage();
        if (!boxEl) return;
        boxEl.style.left = `${crop.x * 100}%`;
        boxEl.style.top = `${crop.y * 100}%`;
        boxEl.style.width = `${crop.w * 100}%`;
        boxEl.style.height = `${crop.h * 100}%`;
      };

      let dragMode = null; // 'move' | 'nw' | 'ne' | 'sw' | 'se'
      let startClientX = 0;
      let startClientY = 0;
      let startCrop = { ...crop };

      const getPoint = (e) => {
        if (e.touches && e.touches[0]) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      };

      const beginDrag = (mode, e) => {
        e.preventDefault();
        e.stopPropagation();
        dragMode = mode;
        const pt = getPoint(e);
        startClientX = pt.x;
        startClientY = pt.y;
        startCrop = { ...crop };
      };

      const onDragMove = (e) => {
        if (!dragMode || !imgEl) return;
        e.preventDefault();
        const rect = imgEl.getBoundingClientRect();
        const iw = rect.width || 1;
        const ih = rect.height || 1;
        const pt = getPoint(e);
        const dx = (pt.x - startClientX) / iw;
        const dy = (pt.y - startClientY) / ih;

        if (dragMode === 'move') {
          const nextX = Math.min(1 - startCrop.w, Math.max(0, startCrop.x + dx));
          const nextY = Math.min(1 - startCrop.h, Math.max(0, startCrop.y + dy));
          crop = { ...startCrop, x: nextX, y: nextY };
        } else {
          let left = startCrop.x;
          let top = startCrop.y;
          let right = startCrop.x + startCrop.w;
          let bottom = startCrop.y + startCrop.h;

          if (dragMode.includes('w')) {
            left = Math.min(right - MIN_FRAC, Math.max(0, startCrop.x + dx));
          }
          if (dragMode.includes('e')) {
            right = Math.max(left + MIN_FRAC, Math.min(1, startCrop.x + startCrop.w + dx));
          }
          if (dragMode.includes('n')) {
            top = Math.min(bottom - MIN_FRAC, Math.max(0, startCrop.y + dy));
          }
          if (dragMode.includes('s')) {
            bottom = Math.max(top + MIN_FRAC, Math.min(1, startCrop.y + startCrop.h + dy));
          }

          crop = {
            x: left,
            y: top,
            w: Math.max(MIN_FRAC, right - left),
            h: Math.max(MIN_FRAC, bottom - top),
          };
        }
        renderCropBox();
      };

      const endDrag = () => {
        dragMode = null;
      };

      boxEl?.addEventListener('mousedown', (e) => {
        if (e.target.closest('[data-crop-handle]')) return;
        beginDrag('move', e);
      });
      boxEl?.addEventListener(
        'touchstart',
        (e) => {
          if (e.target.closest('[data-crop-handle]')) return;
          beginDrag('move', e);
        },
        { passive: false }
      );

      overlay.querySelectorAll('[data-crop-handle]').forEach((handleBtn) => {
        const mode = handleBtn.getAttribute('data-crop-handle');
        handleBtn.addEventListener('mousedown', (e) => beginDrag(mode, e));
        handleBtn.addEventListener('touchstart', (e) => beginDrag(mode, e), { passive: false });
      });

      window.addEventListener('mousemove', onDragMove);
      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchmove', onDragMove, { passive: false });
      window.addEventListener('touchend', endDrag);
      window.addEventListener('resize', renderCropBox);

      const closeOverlay = () => {
        window.removeEventListener('mousemove', onDragMove);
        window.removeEventListener('mouseup', endDrag);
        window.removeEventListener('touchmove', onDragMove);
        window.removeEventListener('touchend', endDrag);
        window.removeEventListener('resize', renderCropBox);
        overlay.remove();
      };

      imgEl.onload = () => {
        renderCropBox();
      };
      if (imgEl.complete) {
        renderCropBox();
      }

      overlay.querySelector('[data-crop-full]')?.addEventListener('click', () => {
        crop = { x: 0, y: 0, w: 1, h: 1 };
        renderCropBox();
      });

      overlay.querySelectorAll('[data-crop-cancel]').forEach((btn) => {
        btn.addEventListener('click', () => {
          closeOverlay();
          onCropped(sourceDataUrl);
        });
      });

      overlay.querySelector('[data-crop-apply]')?.addEventListener('click', async () => {
        const natW = imgEl.naturalWidth || 800;
        const natH = imgEl.naturalHeight || 800;
        const sx = Math.max(0, Math.round(crop.x * natW));
        const sy = Math.max(0, Math.round(crop.y * natH));
        const sw = Math.max(1, Math.min(natW - sx, Math.round(crop.w * natW)));
        const sh = Math.max(1, Math.min(natH - sy, Math.round(crop.h * natH)));

        const outCanvas = document.createElement('canvas');
        outCanvas.width = sw;
        outCanvas.height = sh;
        const octx = outCanvas.getContext('2d');
        octx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);

        const rawCropped = outCanvas.toDataURL('image/jpeg', 0.9);
        const compressedCropped = await compressImageDataUrl(
          rawCropped,
          options.maxDimension || 960,
          0.8
        );
        closeOverlay();
        onCropped(compressedCropped);
      });
    }

    function applyBooksSnapshotDocs(loadedBooks) {
      loadedBooks.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      if (!initialBooksLoaded) {
        loadedBooks.forEach((b) => knownBookIds.add(b.id));
      } else {
        for (const b of loadedBooks) {
          if (!knownBookIds.has(b.id)) {
            knownBookIds.add(b.id);
            const actor = getUserById(b.ownerId);
            notifyIncomingEvent({
              eventId: `act-book-${b.id}`,
              actorId: b.ownerId,
              title: '새 책이 책장에 꽂혔어요',
              body: `${actor.name}님이 "${b.title}" 책을 추가했습니다.`,
              bookId: b.id,
              eventTs: Number(b.createdAt || 0),
            });
          }
        }
      }

      if (loadedBooks.length > 0 || initialBooksLoaded) {
        state.books = [...loadedBooks];
      }
      updateNewsBadgeUI();
      renderApp();
    }

    function applyEntriesSnapshotDocs(loadedEntries) {
      loadedEntries.sort((a, b) => getEntrySortTimestamp(a) - getEntrySortTimestamp(b));

      if (!initialEntriesLoaded) {
        loadedEntries.forEach((e) => {
          knownEntryIds.add(e.id);
          (e.replies || []).forEach((rep, idx) => {
            knownReplyIds.add(`${e.id}:${rep.id || idx}`);
          });
        });
      } else {
        for (const entry of loadedEntries) {
          const book = state.books.find((b) => b.id === entry.bookId);
          const bookTitle = book ? book.title : '책';
          const entryTs = getEntrySortTimestamp(entry);

          if (!knownEntryIds.has(entry.id)) {
            knownEntryIds.add(entry.id);
            const actor = getUserById(entry.authorId);
            notifyIncomingEvent({
              eventId: `act-entry-${entry.id}`,
              actorId: entry.authorId,
              title: '새 구절 사진이 올라왔어요',
              body: `${actor.name}님이 "${bookTitle}"에 새 구절을 남겼습니다.`,
              bookId: entry.bookId,
              eventTs: entryTs,
            });
          }

          const replies = entry.replies || [];
          replies.forEach((rep, idx) => {
            const key = `${entry.id}:${rep.id || idx}`;
            if (!knownReplyIds.has(key)) {
              knownReplyIds.add(key);
              const repActor = getUserById(rep.authorId);
              const idMatch = String(rep.id || '').match(/(\d{10,})/);
              const repTs = idMatch ? Number(idMatch[1]) : entryTs + idx + 1;
              notifyIncomingEvent({
                eventId: `act-reply-${entry.id}-${rep.id || idx}`,
                actorId: rep.authorId,
                title: '새 답글이 달렸어요',
                body: `${repActor.name}님이 "${bookTitle}" 구절에 답글을 남겼습니다.`,
                bookId: entry.bookId,
                eventTs: repTs,
              });
            }
          });
        }
      }

      if (loadedEntries.length > 0 || initialEntriesLoaded) {
        state.entries = [...loadedEntries];
      }
      updateNewsBadgeUI();
      renderApp();
    }

    function checkMissedActivitySinceLastVisit() {
      if (missedCatchupDone) return;
      if (!initialBooksLoaded && !initialEntriesLoaded) return;
      missedCatchupDone = true;

      const unread = getUnreadActivityCount();
      if (unread <= 0) {
        updateNewsBadgeUI();
        return;
      }
      showToast(`🔔 부재중 새소식 ${unread}건이 있어요! 상단 [새소식]을 눌러 확인해보세요.`);
    }

    async function forceSyncLatestRemoteData() {
      if (!db) {
        renderApp();
        return;
      }
      if (syncAuthReadyPromise) {
        await syncAuthReadyPromise;
      }
      if (!currentAuthUser) {
        renderApp();
        return;
      }
      if (isRefreshingRemoteData) return;
      isRefreshingRemoteData = true;
      try {
        if (!realtimeSyncInitialized && !isSettingUpListeners) {
          await initRealtimeSync();
        }

        const [usersSnap, booksSnap, entriesSnap] = await Promise.all([
          getDocs(getPublicCollection('users')),
          getDocs(getPublicCollection('books')),
          getDocs(getPublicCollection('entries')),
        ]);

        if (!usersSnap.empty) {
          const loadedUsers = [];
          usersSnap.forEach((docSnap) => {
            loadedUsers.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedUsers.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          state.users = [...loadedUsers];
        }

        const loadedBooks = [];
        booksSnap.forEach((docSnap) => {
          loadedBooks.push({ id: docSnap.id, ...docSnap.data() });
        });
        initialBooksLoaded = true;
        applyBooksSnapshotDocs(loadedBooks);

        const loadedEntries = [];
        entriesSnap.forEach((docSnap) => {
          loadedEntries.push({ id: docSnap.id, ...docSnap.data() });
        });
        initialEntriesLoaded = true;
        applyEntriesSnapshotDocs(loadedEntries);

        renderApp();
      } catch (err) {
        console.warn('복귀 시 최신 데이터 동기화 지연:', err?.message || err);
        renderApp();
      } finally {
        isRefreshingRemoteData = false;
      }
    }

          openAddBookModal(btn.getAttribute('data-open-add-book'));
        });
      });

      const LONG_PRESS_MS = 550;
      container.querySelectorAll('[data-open-book]').forEach((btn) => {
        const bookId = btn.getAttribute('data-open-book');
        const longPressBookId = btn.getAttribute('data-long-press-book');
        let pressTimer = null;
        let startX = 0;
        let startY = 0;
        let didLongPress = false;

        const clearPressState = () => {
          if (pressTimer !== null) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
          btn.classList.remove('long-press-active');
        };

        const beginPress = (clientX, clientY) => {
          didLongPress = false;
          startX = clientX;
          startY = clientY;
          clearPressState();

          if (!longPressBookId) return;
          btn.classList.add('long-press-active');
          pressTimer = setTimeout(() => {
            pressTimer = null;
            didLongPress = true;
            btn.classList.remove('long-press-active');
            openDeleteBookModal(longPressBookId);
          }, LONG_PRESS_MS);
        };

        const checkMoveCancel = (clientX, clientY) => {
          if (!pressTimer) return;
          if (Math.abs(clientX - startX) > 10 || Math.abs(clientY - startY) > 10) {
            clearPressState();
          }
        };

        btn.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          beginPress(e.clientX, e.clientY);
        });

        btn.addEventListener('pointermove', (e) => {
          checkMoveCancel(e.clientX, e.clientY);
        });

        btn.addEventListener('pointerup', () => {
          clearPressState();
        });

        btn.addEventListener('pointercancel', () => {
          clearPressState();
        });

        btn.addEventListener('touchstart', (e) => {
          const touch = e.touches?.[0];
          if (touch) beginPress(touch.clientX, touch.clientY);
        }, { passive: true });

        btn.addEventListener('touchmove', (e) => {
          const touch = e.touches?.[0];
          if (touch) checkMoveCancel(touch.clientX, touch.clientY);
        }, { passive: true });

        btn.addEventListener('touchend', () => {
          clearPressState();
        });

        btn.addEventListener('touchcancel', () => {
          clearPressState();
        });

        btn.addEventListener('click', (e) => {
          if (didLongPress) {
            e.preventDefault();
            e.stopPropagation();
            didLongPress = false;
            return;
          }
          if (!bookId) return;
          state.selectedBookId = bookId;
          renderApp();
        });
      });
    }

      const modalCard = document.getElementById('modalCard');
      const camHelper = createPhotoCaptureController(modalCard);
      const viewport = modalCard.querySelector('[data-canvas-viewport]');
      const stage = modalCard.querySelector('[data-canvas-stage]');
      const canvas = modalCard.querySelector('[data-hl-canvas]');
      const placeholder = modalCard.querySelector('[data-hl-placeholder]');
      const zoomLabel = modalCard.querySelector('[data-zoom-label]');
      const ctx = canvas.getContext('2d');

      let zoomScale = 1;
      let panX = 0;
      let panY = 0;
      let isPinching = false;
      let pinchStartDist = 0;
      let pinchStartScale = 1;
      let pinchStartMid = { x: 0, y: 0 };
      let pinchStartPan = { x: 0, y: 0 };

      const clampPan = () => {
        if (!viewport) return;
        const vw = viewport.clientWidth || 1;
        const vh = viewport.clientHeight || 1;
        const maxPanX = Math.max(0, vw * (zoomScale - 1));
        const maxPanY = Math.max(0, vh * (zoomScale - 1));
        panX = Math.min(0, Math.max(-maxPanX, panX));
        panY = Math.min(0, Math.max(-maxPanY, panY));
      };

      const applyCanvasTransform = () => {
        clampPan();
        if (stage) {
          stage.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale})`;
        }
        if (zoomLabel) {
          zoomLabel.textContent = `${Math.round(zoomScale * 100)}%`;
        }
      };

      const setZoomAroundPoint = (nextScale, focalClientX, focalClientY) => {
        const clampedScale = Math.min(4, Math.max(1, nextScale));
        if (!viewport) {
          zoomScale = clampedScale;
          applyCanvasTransform();
          return;
        }
        const rect = viewport.getBoundingClientRect();
        const fx = focalClientX - rect.left;
        const fy = focalClientY - rect.top;
        const ratio = clampedScale / zoomScale;
        panX = fx - (fx - panX) * ratio;
        panY = fy - (fy - panY) * ratio;
        zoomScale = clampedScale;
        if (zoomScale <= 1.001) {
          zoomScale = 1;
          panX = 0;
          panY = 0;
        }
        applyCanvasTransform();
      };

      const resetZoomAndPan = () => {
        zoomScale = 1;
        panX = 0;
        panY = 0;
        isPinching = false;
        applyCanvasTransform();
      };

      const loadImageOntoCanvas = (src) => {
        if (!src) return;
        const img = new Image();
        img.onload = () => {
          const maxW = 900;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          hasBaseImageLoaded = true;
          canvas.classList.remove('hidden');
          if (placeholder) placeholder.classList.add('hidden');
          resetZoomAndPan();
        };
        img.src = src;
      };

      if (photoDataUrl) {
        loadImageOntoCanvas(photoDataUrl);
      }

      const getCanvasCoords = (clientX, clientY) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / (rect.width || 1);
        const scaleY = canvas.height / (rect.height || 1);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      };

      const startStroke = (clientX, clientY) => {
        if (!hasBaseImageLoaded || isPinching) return;
        isDrawing = true;
        const pt = getCanvasCoords(clientX, clientY);
        lastX = pt.x;
        lastY = pt.y;
      };

      const moveStroke = (clientX, clientY) => {
        if (!isDrawing || !hasBaseImageLoaded || isPinching) return;
        const pt = getCanvasCoords(clientX, clientY);
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.strokeStyle = selectedColor;
        ctx.lineWidth = Math.max(14, canvas.width * 0.028);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
        ctx.restore();
        lastX = pt.x;
        lastY = pt.y;
      };

      const endStroke = () => {
        isDrawing = false;
      };

      const getTouchDistance = (t1, t2) =>
        Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

      const getTouchMidpoint = (t1, t2) => ({
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2,
      });

      canvas.addEventListener('mousedown', (e) => startStroke(e.clientX, e.clientY));
      canvas.addEventListener('mousemove', (e) => moveStroke(e.clientX, e.clientY));
      window.addEventListener('mouseup', endStroke);

      viewport?.addEventListener('wheel', (e) => {
        if (!hasBaseImageLoaded) return;
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.25 : -0.25;
        setZoomAroundPoint(zoomScale + delta, e.clientX, e.clientY);
      }, { passive: false });

      viewport?.addEventListener('touchstart', (e) => {
        if (!hasBaseImageLoaded) return;
        if (e.touches.length >= 2) {
          e.preventDefault();
          isDrawing = false;
          isPinching = true;
          pinchStartDist = getTouchDistance(e.touches[0], e.touches[1]) || 1;
          pinchStartScale = zoomScale;
          pinchStartMid = getTouchMidpoint(e.touches[0], e.touches[1]);
          pinchStartPan = { x: panX, y: panY };
          return;
        }
        if (e.touches.length === 1 && !isPinching) {
          e.preventDefault();
          startStroke(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      viewport?.addEventListener('touchmove', (e) => {
        if (!hasBaseImageLoaded) return;
        if (e.touches.length >= 2) {
          e.preventDefault();
          isDrawing = false;
          const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
          const currentMid = getTouchMidpoint(e.touches[0], e.touches[1]);
          if (!isPinching) {
            isPinching = true;
            pinchStartDist = currentDist || 1;
            pinchStartScale = zoomScale;
            pinchStartMid = currentMid;
            pinchStartPan = { x: panX, y: panY };
            return;
          }
          const nextScale = Math.min(4, Math.max(1, pinchStartScale * (currentDist / (pinchStartDist || 1))));
          const rect = viewport.getBoundingClientRect();
          const startFocalX = pinchStartMid.x - rect.left;
          const startFocalY = pinchStartMid.y - rect.top;
          const curFocalX = currentMid.x - rect.left;
          const curFocalY = currentMid.y - rect.top;
          const ratio = nextScale / pinchStartScale;

          zoomScale = nextScale;
          if (zoomScale <= 1.001) {
            zoomScale = 1;
            panX = 0;
            panY = 0;
          } else {
            panX = curFocalX - (startFocalX - pinchStartPan.x) * ratio;
            panY = curFocalY - (startFocalY - pinchStartPan.y) * ratio;
          }
          applyCanvasTransform();
          return;
        }
        if (e.touches.length === 1 && !isPinching && isDrawing) {
          e.preventDefault();
          moveStroke(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      viewport?.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          isPinching = false;
        }
        if (e.touches.length === 0) {
          endStroke();
        }
      });

      viewport?.addEventListener('touchcancel', () => {
        isPinching = false;
        endStroke();
      });

      modalCard.querySelector('[data-zoom-in]')?.addEventListener('click', () => {
        if (!hasBaseImageLoaded || !viewport) return;
        const rect = viewport.getBoundingClientRect();
        setZoomAroundPoint(zoomScale + 0.4, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      modalCard.querySelector('[data-zoom-out]')?.addEventListener('click', () => {
        if (!hasBaseImageLoaded || !viewport) return;
        const rect = viewport.getBoundingClientRect();
        setZoomAroundPoint(zoomScale - 0.4, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      modalCard.querySelector('[data-zoom-reset]')?.addEventListener('click', () => {
        if (!hasBaseImageLoaded) return;
        resetZoomAndPan();
      });

      modalCard.querySelectorAll('[data-hl-color]').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedColor = btn.getAttribute('data-hl-color') || HIGHLIGHT_COLORS[0].hex;
          modalCard.querySelectorAll('[data-hl-color]').forEach((b) => {
            b.classList.remove('ring-2', 'ring-ink', 'scale-105');
            b.classList.add('opacity-85');
          });
          btn.classList.add('ring-2', 'ring-ink', 'scale-105');
          btn.classList.remove('opacity-85');
        });
      });

      modalCard.querySelector('[data-reset-canvas]')?.addEventListener('click', () => {
        if (!photoDataUrl) return;
        loadImageOntoCanvas(photoDataUrl);
      });

      const handleNewPhoto = (rawUrl) => {
        if (!rawUrl) return;
        openImageCropperOverlay(
          rawUrl,
          (croppedUrl) => {
            photoDataUrl = croppedUrl;
            loadImageOntoCanvas(photoDataUrl);
          },
          {
            title: '구절 사진 오리기',
            helperText: '형광펜을 칠할 구절 영역만 원하는 만큼 오려내세요.',
            maxDimension: 960,
          }
        );
      };

      modalCard.querySelector('[data-crop-entry-photo]')?.addEventListener('click', () => {
        if (!photoDataUrl) {
          showToast('먼저 구절 사진을 촬영하거나 선택해주세요.');
          return;
        }
        const currentCanvasUrl = hasBaseImageLoaded
          ? canvas.toDataURL('image/jpeg', 0.9)
          : photoDataUrl;
        handleNewPhoto(currentCanvasUrl);
      });

      modalCard.querySelector('[data-start-camera]')?.addEventListener('click', () => {
        camHelper.startStream(handleNewPhoto);
      });

      const fileInput = modalCard.querySelector('[data-file-input]');
      modalCard.querySelector('[data-pick-file]')?.addEventListener('click', () => {
        fileInput?.click();
      });
      fileInput?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await readFileAsDataUrl(file);
          handleNewPhoto(dataUrl);
        } catch (err) {
          showToast(err.message || '사진을 불러오지 못했습니다.');
        }
        e.target.value = '';
      });

      const cleanupObserver = new MutationObserver(() => {
        if (!document.body.contains(canvas)) {
          window.removeEventListener('mouseup', endStroke);
          camHelper.stopStream();
          cleanupObserver.disconnect();
        }
      });
      cleanupObserver.observe(document.body, { childList: true, subtree: true });

      modalCard.querySelectorAll('[data-close-modal]').forEach((btn) => {
        btn.addEventListener('click', () => {
          window.removeEventListener('mouseup', endStroke);
          camHelper.stopStream();
          cleanupObserver.disconnect();
          closeModal();
        });
      });

      document.getElementById('entryEditorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        camHelper.stopStream();
        window.removeEventListener('mouseup', endStroke);
        cleanupObserver.disconnect();

        const formData = new FormData(e.target);
        const photoDate = String(formData.get('photoDate') || '').trim() || getTodayDateStr();

        if (!photoDataUrl) {
          showToast('구절 사진을 촬영하거나 선택해주세요.');
          return;
        }

        const rawFinalUrl = hasBaseImageLoaded
          ? canvas.toDataURL('image/jpeg', 0.82)
          : photoDataUrl;
        const finalPhotoUrl = await compressImageDataUrl(rawFinalUrl, 960, 0.78);

        state.currentTab = 'home';
        state.selectedBookId = book.id;

        if (existingEntry) {
          existingEntry.photoUrl = finalPhotoUrl;
          existingEntry.photoDate = photoDate;
          closeModal();
          renderApp();
          await syncSaveEntry(existingEntry);
          showToast('구절 기록이 수정되었습니다.');
        } else {
          const newEntry = {
            id: `entry-${Date.now()}`,
            bookId: book.id,
            authorId: state.activeUserId,
            photoUrl: finalPhotoUrl,
            photoDate,
            replies: [],
            createdAt: Date.now(),
          };
          knownEntryIds.add(newEntry.id);
          alertedEventIds.add(`act-entry-${newEntry.id}`);
          persistAlertedEventIds();
          state.entries.push(newEntry);
          closeModal();
          renderApp();
          await syncSaveEntry(newEntry);
          showToast('구절 사진이 저장되었습니다.');
        }
      });
    }

    function openDeleteEntryModal(entryId) {
      const entry = state.entries.find((e) => e.id === entryId);
      if (!entry) return;
      if (!canManageEntry(entry)) {
        showToast('본인이 작성한 구절만 삭제할 수 있습니다.');
        return;
      }

      openModal(`
        <div class="space-y-2">
          <h3 class="font-serif text-lg font-bold text-ink">구절 기록을 삭제할까요?</h3>
          <p class="text-xs text-muted leading-relaxed">
            삭제된 구절 사진과 달린 답글은 복구할 수 없습니다.
          </p>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" data-close-modal class="rounded-2xl bg-amber-100/70 text-muted text-xs font-bold px-4 py-2.5 cursor-pointer">취소</button>
          <button type="button" id="confirmDeleteEntryBtn" class="rounded-2xl bg-rose-600 text-white text-xs font-bold px-4 py-2.5 cursor-pointer">삭제하기</button>
        </div>
      `);

      document.getElementById('modalCard').querySelector('[data-close-modal]')?.addEventListener('click', closeModal);
      document.getElementById('confirmDeleteEntryBtn').addEventListener('click', async () => {
        state.currentTab = 'home';
        state.selectedBookId = entry.bookId;
        state.entries = state.entries.filter((item) => item.id !== entryId);
        closeModal();
        renderApp();
        await syncDeleteEntry(entryId);
        showToast('구절 기록이 삭제되었습니다.');
      });
    }

    function bindGlobalEvents() {
      const goHomeView = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        closeModal();
        document.getElementById('activeUserDropdown')?.classList.add('hidden');
        state.currentTab = 'home';
        state.selectedBookId = null;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'auto' });
      };

      const navHomeBtn = document.getElementById('navHomeBtn');
      if (navHomeBtn) {
        navHomeBtn.addEventListener('click', goHomeView);
        navHomeBtn.addEventListener('touchend', goHomeView, { passive: false });
      }

      document.getElementById('navSettingsBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        closeModal();
        document.getElementById('activeUserDropdown')?.classList.add('hidden');
        state.currentTab = 'settings';
        state.selectedBookId = null;
        renderApp();
      });

      document.getElementById('headerBackBtn')?.addEventListener('click', () => {
        state.selectedBookId = null;
        renderApp();
      });

      document.getElementById('newsFeedBtn')?.addEventListener('click', () => {
        openNewsFeedModal();
      });

      const badgeBtn = document.getElementById('activeUserBadgeBtn');
      const dropdown = document.getElementById('activeUserDropdown');

      badgeBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown?.classList.toggle('hidden');
      });

      dropdown?.addEventListener('click', (e) => {
        const userBtn = e.target.closest('[data-select-active-user]');
        if (userBtn) {
          const nextUserId = userBtn.getAttribute('data-select-active-user');
          setFixedActiveUser(nextUserId, true);
          dropdown.classList.add('hidden');
          renderApp();
          showToast(`이 기기를 "${getUserById(nextUserId).name}"님으로 고정했습니다.`);
          return;
        }

        const lockBtn = e.target.closest('[data-toggle-user-lock]');
        if (lockBtn) {
          setFixedActiveUser(state.activeUserId, !state.isUserLocked);
          dropdown.classList.add('hidden');
          renderApp();
          showToast(
            state.isUserLocked
              ? `이 기기를 "${getUserById(state.activeUserId).name}"님으로 고정했습니다.`
              : '기기 사용자 고정을 해제했습니다.'
          );
        }
      });

      document.addEventListener('click', (e) => {
        const zoomPhotoBtn = e.target.closest('[data-zoom-entry-photo]');
        if (zoomPhotoBtn && document.getElementById('modalBackdrop')?.classList.contains('hidden')) {
          const entryId = zoomPhotoBtn.getAttribute('data-zoom-entry-photo');
          if (entryId) {
            openEntryPhotoZoomModal(entryId);
            return;
          }
        }

        if (!dropdown?.classList.contains('hidden')) {
          if (!dropdown.contains(e.target) && !badgeBtn?.contains(e.target)) {
            dropdown.classList.add('hidden');
          }
        }
      });

      const backdrop = document.getElementById('modalBackdrop');
      backdrop?.addEventListener('click', (e) => {
        if (e.target === backdrop) {
          closeModal();
        }
      });

      document.addEventListener('submit', async (e) => {
        const replyForm = e.target.closest('[data-reply-form]');
        if (!replyForm) return;
        e.preventDefault();

        const entryId = replyForm.getAttribute('data-reply-form');
        const input = replyForm.querySelector('input[name="replyText"]');
        const text = (input?.value || '').trim();
        if (!text) return;

        const entry = state.entries.find((item) => item.id === entryId);
        if (!entry) return;

        const newReply = {
          id: `reply-${Date.now()}`,
          authorId: state.activeUserId,
          text,
          date: getTodayDateStr(),
        };
        knownReplyIds.add(`${entry.id}:${newReply.id}`);
        alertedEventIds.add(`act-reply-${entry.id}-${newReply.id}`);
        persistAlertedEventIds();
        entry.replies = [...(entry.replies || []), newReply];

        input.value = '';
        renderApp();
        await syncUpdateEntryReplies(entry.id, entry.replies);
        showToast('답글이 등록되었습니다.');
      });

      const triggerResumeRefresh = () => {
        const now = Date.now();
        if (now - lastResumeSyncAt < 800) return;
        lastResumeSyncAt = now;
        forceSyncLatestRemoteData();
      };

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          triggerResumeRefresh();
        }
      });

      window.addEventListener('pageshow', () => {
        triggerResumeRefresh();
      });

      window.addEventListener('focus', () => {
        triggerResumeRefresh();
      });

      window.addEventListener('pagehide', () => {
        markLastSeenNow();
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await hydratePrefsFromIndexedDb();
      bindGlobalEvents();
      renderApp();
      await initRealtimeSync();
      await forceSyncLatestRemoteData();
    });
  </script>
</body>
</html>
